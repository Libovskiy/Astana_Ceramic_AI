<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Технолог — ACAI</title>
<script src="/static/theme.js?v=2"></script>
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/acai.css?v=63">
<style>
.stage-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;}
.stage-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;}
.stage-title{font-size:15px;font-weight:700;}
.stage-icon{font-size:20px;margin-right:10px;}
.param-row{display:grid;grid-template-columns:1fr 80px 80px 80px 120px 36px 36px;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--border);}
.param-row:last-child{border-bottom:none;}
.param-row:hover{background:rgba(59,130,246,.03);}
.param-name{font-size:13px;font-weight:500;}
.param-unit{font-size:11px;color:var(--text-dim);text-align:center;}
.param-input{font-family:var(--mono);font-size:13px;text-align:center;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);width:100%;}
.param-input:focus{border-color:var(--accent);outline:none;}
.param-input.readonly{color:var(--text-dim);cursor:default;background:var(--surface);}
.param-input.ok{border-color:var(--ok);}
.param-input.warn{border-color:var(--warn);}
.param-input.danger{border-color:var(--danger);}
.live-val{font-family:var(--mono);font-size:14px;font-weight:700;text-align:center;}
.param-field{display:contents;}
.param-field span{display:none;}
.col-head{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:6px 18px;}
.param-grid-head{display:grid;grid-template-columns:1fr 80px 80px 80px 120px 36px 36px;gap:8px;padding:6px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);}

/* ТЕЛЕФОН. Семь колонок (1fr + 80+80+80+120+36+36) требуют минимум
   450 px — на 390 они вылезали за экран. Сворачиваем строку в
   карточку: название сверху, под ним допуски подписанными полями.
   Подписи ставим здесь, потому что в разметке их нет вовсе — они
   жили только в шапке таблицы, а шапка на телефоне прячется. */
@media (max-width: 560px) {
  .param-grid-head { display: none; }
  /* Значки истории и удаления были 29 px — по ним не попасть. */
  .param-row button { min-width: 44px; min-height: 44px; }
  /* Заголовок участка: «▼ Свернуть» вылезал за край на 12 px. */
  .stage-head { flex-wrap: wrap; gap: 6px; }
  .stage-head > div { flex-wrap: wrap; }
  .param-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    padding: 12px 14px;
  }
  .param-row > *:first-child { flex: 1 0 100%; }
  .param-row .param-field { display: flex; align-items: center; gap: 6px; }
  .param-row .param-field span {
    display: inline;
    font-size: 11px;
    color: var(--text-dim);
  }
  .param-row .param-input { width: 64px; }
  .param-row .live-val { margin-left: auto; }
}
.sensor-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;}
.sensor-ok{background:rgba(34,197,94,.15);color:var(--ok);}
.sensor-warn{background:rgba(245,158,11,.15);color:var(--warn);}
.sensor-danger{background:rgba(239,68,68,.15);color:var(--danger);}

/* Вкладки — те же, что в «Знаниях»: один вид на всю систему. */
.kn-tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.kn-tab { padding:8px 14px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600;
  cursor:pointer; font-family:var(--sans); display:flex; align-items:center; gap:7px;
  min-height:44px; }   /* под палец: ниже 44 промахиваются */
.kn-tab:hover { border-color:var(--accent); }
.kn-tab.on { background:var(--accent-solid); border-color:var(--accent-solid); color:#fff; }
.kn-tab .kn-n { font-size:11px; padding:1px 7px; border-radius:999px;
  background:var(--surface-2); color:var(--text-dim); }
.kn-tab.on .kn-n { background:rgba(255,255,255,.22); color:#fff; }

.doc-note { font-size:12px;color:var(--text-dim);line-height:1.5;margin:0 0 10px; }

/* Строка регистра: слева имя как его шлёт панель, дальше — что это
   значит и чей это станок. Эти два поля и заполняет инженер. */
.reg-row { display:grid; grid-template-columns:minmax(200px,1fr) minmax(180px,1fr) minmax(200px,1fr);
  gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); }
.reg-row:last-child { border-bottom:none; }
.reg-name { font-family:var(--code); font-size:12px; font-weight:600; overflow-wrap:anywhere; }
.reg-sub { font-size:11px; color:var(--text-dim); margin-top:3px; display:flex;
  align-items:center; gap:6px; flex-wrap:wrap; }
/* Почему регистр молчит: причина у каждого своя, и знать её должен
   тот, кто будет решать. Прятать в подсказку нельзя — её не откроют. */
.reg-note { font-size:11px; color:var(--warn); margin-top:5px; line-height:1.45; }
.input.sm { padding:6px 9px; font-size:12px; }
@media (max-width: 760px) {
  .reg-row { grid-template-columns:1fr; gap:6px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Технолог</div>
        <div class="topbar-sub">Параметры производства и допуски</div>
      </div>
      <div class="topbar-right">
        <button class="btn primary" onclick="openAddParam()">+ Параметр</button>
        <span id="sensorTime" style="font-size:11px;color:var(--text-dim);font-family:var(--mono)"></span>
        <span class="topbar-clock" id="topbarClock"></span>
      </div>
    </header>
    <div class="page">

      <!-- Вопрос вкладки: держим ли режим. Ответ словами: что вышло за
           допуск прямо сейчас — и по каким параметрам живых данных нет. -->
      <div class="verdict calm" id="techVerdict">
        <div class="v-title" style="color:var(--text-dim)">Сверяю с допусками…</div>
      </div>

      <!-- МЕТРИКИ -->
      <div class="metrics" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px" id="techMetrics">
        <div class="metric"><div class="metric-label">Загрузка...</div></div>
      </div>

      <div id="collectionState"></div>
      <div class="kn-tabs" id="techTabs"></div>

      <!-- ЭТАПЫ -->
      <div id="stagesContent"><div class="empty">Загрузка...</div></div>

      <!-- РЕГИСТРЫ ПАНЕЛИ -->
      <div id="registersContent" style="display:none"></div>

    </div>
  </div>
</div>

<div class="overlay hidden" id="_overlay"><div class="modal" id="_modal" style="width:500px;max-width:95vw"></div></div>

<script src="/static/icons.js?v=4"></script>
<script src="/static/acai_layout.js?v=63"></script>
<script src="/static/mobile_nav_v2.js?v=6"></script>
<script>
const STAGE_ICONS={
  'Массаподготовка':ACAI.icon('gear'),
  'Формовка':ACAI.icon('build'),
  'Сушка':ACAI.icon('wind'),
  'Обжиг':ACAI.icon('fire'),
  'Упаковка':ACAI.icon('parts')
};
const STAGE_ORDER=['Массаподготовка','Формовка','Сушка','Обжиг','Упаковка'];

// живые данные WebHMI
// Связь «параметр → регистр панели» лежит в базе, а не здесь.
// Раньше это был словарь на пять пар прямо в шаблоне: поменять мог
// только программист, а знает эти пары главный инженер. Теперь он
// правит их на вкладке «Регистры», а страница читает готовое.
//
// Значение может быть трёх видов, и путать их нельзя:
//   есть регистр и он live      → показываем число
//   есть регистр, но он silent  → «не поступает с панели»
//   регистра нет вовсе          → «регистр не назначен»
let LIVE_MAP = {};        // имя параметра → имя регистра
let REG_STATE = {};       // имя регистра → live | silent | unknown
let allRegisters = [];
let regEquipment = [];
let canEditRegisters = false;

function regOf(paramName){ return LIVE_MAP[paramName] || null; }
function edEscT(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}

// Идёт ли сбор вообще. Если стоит — числами не притворяемся: старое
// значение рядом со «сверяется с живыми показаниями» это прямая ложь,
// а технолог по ней меняет режим.
let collection = null;

function liveValueOf(paramName){
  const key = regOf(paramName);
  if (!key) return {kind: 'none'};
  if (collection && !collection.ok && collection.state !== 'never')
    return {kind: 'silent', register: key, down: true};
  if (REG_STATE[key] !== 'live') return {kind: 'silent', register: key};
  const row = liveData[key];
  if (!row) return {kind: 'silent', register: key};
  return {kind: 'value', register: key, value: parseFloat(row.value), at: row.updated_at};
}

let canEditParams=false;
let allParams=[];let liveData={};let currentUser=null;
const collapsed=new Set();

async function load(){
  const [pr, lr, rr, hr] = await Promise.allSettled([
    ACAI.get('/api/technolog/params'),
    ACAI.get('/api/sensors/live'),
    ACAI.get('/api/sensor-registers'),
    ACAI.get('/api/sensors/health')
  ]);

  collection = hr.value || null;

  if(rr.value?.success){
    allRegisters = rr.value.registers || [];
    if(rr.value.can_edit && !regEquipment.length){
      try{
        const eq = await ACAI.get('/api/equipment');
        regEquipment = (eq.equipment || eq || []).filter(e => e.is_active !== 0);
      }catch{}
    }
    canEditRegisters = rr.value.can_edit === true;
    LIVE_MAP = {};
    REG_STATE = {};
    for(const r of allRegisters){
      REG_STATE[r.register] = r.state;
      if((r.title || '').trim()) LIVE_MAP[r.title.trim()] = r.register;
    }
  }
  if(pr.value?.success){
    allParams=pr.value.params;
    canEditParams=pr.value.can_edit===true;
    // Стартовый набор заводит только тот, кому это положено. Раньше
    // страница звала эту ручку у всех подряд, и аналитик получал 403 в
    // консоль — а ручка при этом была открыта любому вошедшему.
    if(!allParams.length&&canEditParams){
      await ACAI.post('/api/technolog/params/seed',{});
      const r2=await ACAI.get('/api/technolog/params');
      allParams=r2.params||[];
    }
  }
  liveData=lr.value||{};
  renderCollection();
  renderMetrics();
  renderTabs();
  renderStages();
  renderRegisters();
}

// Строка о том, что сбор стоит — над вкладками, чтобы её нельзя было
// не заметить, прежде чем смотреть на цифры.
function renderCollection(){
  const box = document.getElementById('collectionState');
  if (!box) return;
  if (!collection || collection.ok || collection.state === 'never'){ box.innerHTML=''; return; }
  const since = (collection.since || '').slice(11,16);
  const why = collection.state === 'panel' ? 'панель не отвечает' : 'расширение не на связи';
  box.innerHTML = `<div class="sensor-silence">
      <b>${since ? 'Нет данных с ' + since : 'Нет данных с датчиков'}</b> — ${why}${
      collection.error ? ' · ' + edEscT(collection.error) : ''}.
      Параметры ниже остаются справочными: сверять не с чем.
    </div>`;
}

// ── ВКЛАДКИ ────────────────────────────────────────────────────────
let techTab = 'params';

function renderTabs(){
  const unbound = allRegisters.filter(r => !r.equipment_id).length;
  document.getElementById('techTabs').innerHTML = `
    <button class="kn-tab ${techTab==='params'?'on':''}" onclick="switchTech('params')">
      <span data-icon=technolog></span> Параметры
      <span class="kn-n">${allParams.length}</span>
    </button>
    <button class="kn-tab ${techTab==='registers'?'on':''}" onclick="switchTech('registers')">
      <span data-icon=diagnostics></span> Регистры панели
      <span class="kn-n">${allRegisters.length}</span>
    </button>`;
  ACAI.paintIcons(document.getElementById('techTabs'));
}

function switchTech(tab){
  techTab = tab;
  document.getElementById('stagesContent').style.display = tab==='params' ? '' : 'none';
  document.getElementById('registersContent').style.display = tab==='registers' ? '' : 'none';
  renderTabs();
}

// ── РЕГИСТРЫ ПАНЕЛИ ────────────────────────────────────────────────
//
// Здесь главный инженер проходит все регистры за один раз: что это,
// в чём измеряется, к какому станку относится. Раньше эти пары были
// зашиты в код страницы, и поменять их мог только программист.
//
// Привязка к станку НЕ УГАДЫВАЕТСЯ. «pl024_1_загрузка_проц» похоже на
// «PL024», но похоже — не значит «тот самый»: привязать неверно хуже,
// чем не привязать.
const REG_STATE_LABEL = {
  live:    {text: 'приходит',          cls: 'ok'},
  silent:  {text: 'не поступает',      cls: 'warn'},
  unknown: {text: 'не разобран',       cls: ''},
};

function renderRegisters(){
  const box = document.getElementById('registersContent');
  if(!box) return;

  if(!allRegisters.length){
    box.innerHTML = '<div class="empty compact"><span class="empty-text">Панель не присылала ни одного регистра — привязывать нечего.</span></div>';
    return;
  }

  const live = allRegisters.filter(r => r.state === 'live').length;
  const silent = allRegisters.filter(r => r.state === 'silent').length;
  const unbound = allRegisters.filter(r => !r.equipment_id).length;
  const unnamed = allRegisters.filter(r => !(r.title||'').trim()).length;

  box.innerHTML = `
    <div class="doc-note">
      Регистров ${allRegisters.length}: приходит ${live}, не поступает ${silent}.
      Без станка ${unbound}, без названия ${unnamed}.
      ${canEditRegisters ? 'Привязка к станку не угадывается — назначайте сами.'
                         : 'Править может главный инженер.'}
    </div>
    <div class="card"><div class="card-body" style="padding:0">
      ${allRegisters.map(regRow).join('')}
    </div></div>`;
  ACAI.paintIcons(box);
}

function regRow(r){
  const state = REG_STATE_LABEL[r.state] || REG_STATE_LABEL.unknown;
  const seen = r.last_seen_at ? String(r.last_seen_at).slice(0, 16) : 'ни разу';

  return `
    <div class="reg-row">
      <div class="reg-main">
        <div class="reg-name">${edEscT(r.register)}</div>
        <div class="reg-sub">
          <span class="badge ${state.cls}" style="font-size:10px">${state.text}</span>
          последний раз ${edEscT(seen)}${r.unit ? ' · ' + edEscT(r.unit) : ''}
        </div>
        ${r.note ? `<div class="reg-note">${edEscT(r.note)}</div>` : ''}
      </div>
      <div class="reg-title">${
        canEditRegisters
          ? `<input class="input sm" value="${edEscT(r.title||'')}" placeholder="что это значит"
                    onchange="saveRegister(${r.id}, 'title', this.value)">`
          : edEscT(r.title || '—')}</div>
      <div class="reg-eq">${
        canEditRegisters
          ? `<select class="input sm" onchange="saveRegister(${r.id}, 'equipment_id', this.value)">
               <option value="">— станок не назначен —</option>
               ${regEquipment.map(e => `<option value="${e.id}" ${e.id===r.equipment_id?'selected':''}>${edEscT(e.name)}</option>`).join('')}
             </select>`
          : edEscT(r.equipment_name || '— не назначен —')}</div>
    </div>`;
}

async function saveRegister(id, field, value){
  const patch = {};
  if(field === 'equipment_id'){
    if(String(value) === '') patch.clear_equipment = true;
    else patch.equipment_id = parseInt(value, 10);
  } else {
    patch[field] = value;
  }

  try{
    const r = await fetch(`/api/sensor-registers/${id}`, {
      method: 'PUT', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(patch),
    });
    const data = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(data.detail || 'Не удалось сохранить');
    ACAI.toast(data.changed?.length ? 'Сохранено' : 'Без изменений', 'ok');
    await load();
    switchTech('registers');
  }catch(e){
    ACAI.toast(e.message || 'Не удалось сохранить', 'danger');
  }
}

function renderMetrics(){
  const total=allParams.length;
  // «С живыми данными» — только те, у кого регистр назначен И приходит.
  // Раньше сюда попадали и те, чей регистр панель не присылает ни
  // разу: счётчик показывал пять, а значений было два.
  const withLive=allParams.filter(p=>liveValueOf(p.param_name).kind==='value').length;
  const silent=allParams.filter(p=>liveValueOf(p.param_name).kind==='silent').length;

  let outOfRange=0;
  for(const p of allParams){
    const live=liveValueOf(p.param_name);
    if(live.kind!=='value'||!isFinite(live.value))continue;
    if(p.min_val!==null&&live.value<p.min_val)outOfRange++;
    if(p.max_val!==null&&live.value>p.max_val)outOfRange++;
  }
  document.getElementById('techMetrics').innerHTML=`
    <div class="metric accent"><div class="metric-label">Параметров контроля</div><div class="metric-value accent">${total}</div></div>
    <div class="metric accent"><div class="metric-label">С живыми данными</div><div class="metric-value accent">${withLive}</div><div class="metric-sub">${silent?`${silent} регистр${silent>4?'ов':silent>1?'а':''} не поступает`:'с панели'}</div></div>
    <div class="metric ${outOfRange>0?'danger':'ok'}"><div class="metric-label">Вне допуска</div><div class="metric-value ${outOfRange>0?'danger':'ok'}">${outOfRange}</div></div>
    <div class="metric ok"><div class="metric-label">Этапов</div><div class="metric-value ok">${[...new Set(allParams.map(p=>p.stage))].length}</div></div>`;

  renderTechVerdict({total, withLive, outOfRange});
}

// «Вне допуска: 0» ничего не значит, если живых показаний нет вовсе:
// сверять не с чем. Так и пишем.
function renderTechVerdict(m){
  if(!m.total){
    ACAI.verdict('techVerdict', {title:'Параметры контроля не заданы',
      sub:'Ни одного параметра с допусками — отклонения ловить не по чему.'});
    return;
  }
  const live = Object.keys(liveData || {}).length;
  const rows = [];
  const bad = [];
  for(const p of allParams){
    const live = liveValueOf(p.param_name);
    if(live.kind !== 'value' || !isFinite(live.value)) continue;
    if((p.min_val!==null && live.value<p.min_val) || (p.max_val!==null && live.value>p.max_val))
      bad.push(`${p.param_name} — ${live.value}`);
  }
  if(bad.length) rows.push({level:'critical', what:`Вне допуска: ${bad.length}`,
    where:bad.slice(0,3).join(', ')+(bad.length>3?` и ещё ${bad.length-3}`:'')});
  if(!live || !m.withLive) rows.push({level:'warning',
    what:'Живых показаний нет',
    where:'панель WebHMI не отдаёт данные — режим сверять не с чем, параметры остаются справочными'});

  if(rows.length){ ACAI.verdict('techVerdict', {title: bad.length?'Режим нарушен':'Сверять не с чем', rows}); return; }
  ACAI.verdict('techVerdict', {title:'Режим в допуске',
    sub:`${m.withLive} параметров сверяются с живыми показаниями, отклонений нет · всего в контроле ${m.total}`});
}

function getLiveStatus(param, liveVal){
  if(liveVal===null||liveVal===undefined)return null;
  const v=parseFloat(liveVal);
  if(isNaN(v))return null;
  if((param.min_val!==null&&v<param.min_val)||(param.max_val!==null&&v>param.max_val))return'danger';
  // жёлтый если ближе 10% к границе
  const range=(param.max_val||0)-(param.min_val||0);
  if(range>0){
    if(param.min_val!==null&&v<param.min_val+range*0.1)return'warn';
    if(param.max_val!==null&&v>param.max_val-range*0.1)return'warn';
  }
  return'ok';
}

function renderStages(){
  const byStage={};
  for(const p of allParams){
    if(!byStage[p.stage])byStage[p.stage]=[];
    byStage[p.stage].push(p);
  }
  const stages=[...STAGE_ORDER.filter(s=>byStage[s]),...Object.keys(byStage).filter(s=>!STAGE_ORDER.includes(s))];
  const canEdit=canEditParams;   // право приходит с сервера, а не выписано здесь вторым списком

  document.getElementById('stagesContent').innerHTML=stages.map(stage=>{
    const params=byStage[stage];
    const isCollapsed=collapsed.has(stage);

    // считаем нарушения
    let violations=0;
    for(const p of params){
      const live=liveValueOf(p.param_name);
      if(live.kind!=='value')continue;
      if(getLiveStatus(p,live.value)==='danger')violations++;
    }

    return`<div class="stage-card">
      <div class="stage-head" onclick="toggleStage('${stage}')">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="stage-icon">${STAGE_ICONS[stage]||ACAI.icon('diagnostics')}</span>
          <span class="stage-title">${stage}</span>
          <span style="font-size:11px;color:var(--text-dim)">${params.length} параметров</span>
          ${violations>0?`<span class="sensor-badge sensor-danger"><span data-icon=alert></span> ${violations} вне допуска</span>`:''}
        </div>
        <span style="color:var(--text-dim);font-size:12px">${isCollapsed?'▶ Развернуть':'▼ Свернуть'}</span>
      </div>
      ${isCollapsed?'':`
        <div class="param-grid-head">
          <div class="col-head" style="text-align:left">Параметр</div>
          <div class="col-head">Мин</div>
          <div class="col-head">Макс</div>
          <div class="col-head">Цель</div>
          <div class="col-head">Факт (WebHMI)</div>
          <div class="col-head"></div>
        </div>
        ${params.map(p=>{
          const live=liveValueOf(p.param_name);
          const lk=live.register||null;
          const lv=live.kind==='value'?live.value:null;
          const status=lv!==null?getLiveStatus(p,lv):null;
          const statusClass=status?`sensor-${status}`:'';

          return`<div class="param-row">
            <div>
              <div class="param-name">${p.param_name}</div>
              <div style="font-size:10px;color:var(--text-dim)">${p.updated_by?`обновил ${p.updated_by}`:''} ${p.updated_at?p.updated_at.slice(0,10):''}</div>
            </div>
            <label class="param-field"><span>Мин</span>
            <input class="param-input ${canEdit?'':'readonly'}" type="number" step="0.1"
              value="${p.min_val??''}" ${canEdit?`onchange="updateParam(${p.id},'min_val',this.value,${p.max_val??'null'},${p.target_val??'null'})"`:' readonly'}
              title="Минимальный допуск"></label>
            <label class="param-field"><span>Макс</span>
            <input class="param-input ${canEdit?'':'readonly'}" type="number" step="0.1"
              value="${p.max_val??''}" ${canEdit?`onchange="updateParam(${p.id},'max_val',${p.min_val??'null'},this.value,${p.target_val??'null'})"`:' readonly'}
              title="Максимальный допуск"></label>
            <label class="param-field"><span>Цель</span>
            <input class="param-input ${canEdit?'':'readonly'}" type="number" step="0.1"
              value="${p.target_val??''}" ${canEdit?`onchange="updateParam(${p.id},'target_val',${p.min_val??'null'},${p.max_val??'null'},this.value)"`:' readonly'}
              title="Целевое значение"></label>
            <div class="live-val ${statusClass?'sensor-badge '+statusClass:''}" style="font-size:${lv!==null?'14':'12'}px">
              ${lv!==null ? `${lv.toFixed(1)} ${p.unit||''}`
                : live.kind==='silent'
                  ? `<span style="color:var(--text-dim);font-size:11px" title="Регистр ${edEscT(lk)} назначен, но панель его не присылает. Нужен электрик, а не перезапуск страницы.">не поступает с панели</span>`
                  : '<span style="color:var(--text-dim);font-size:11px" title="Регистр этому параметру не назначен. Назначает главный инженер на вкладке «Регистры».">регистр не назначен</span>'}
            </div>
            <button onclick="showHistory(${p.id},'${p.param_name}')"
              style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:4px"
              title="История изменений"><span data-icon=equipment></span></button>
            ${canEdit?`<button onclick="deleteParam(${p.id},'${p.param_name.replace(/'/g,"\\'")}',event)"
              style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:4px"
              title="Удалить"><span data-icon=trash></span></button>`:''}
          </div>`;
        }).join('')}
      `}
    </div>`;
  }).join('');
}

function toggleStage(stage){
  if(collapsed.has(stage))collapsed.delete(stage);
  else collapsed.add(stage);
  renderStages();
}

// таймер для debounce
const updateTimers={};
function updateParam(id, field, min_val, max_val, target_val){
  clearTimeout(updateTimers[id]);
  updateTimers[id]=setTimeout(async()=>{
    try{
      await fetch(`/api/technolog/params/${id}`,{
        method:'PUT',credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          min_val:min_val===null||min_val===''?null:parseFloat(min_val),
          max_val:max_val===null||max_val===''?null:parseFloat(max_val),
          target_val:target_val===null||target_val===''?null:parseFloat(target_val)
        })
      });
      ACAI.toast('Допуск сохранён ✓','ok');
      // обновляем локально
      const p=allParams.find(p=>p.id===id);
      if(p){
        if(field==='min_val')p.min_val=parseFloat(min_val);
        if(field==='max_val')p.max_val=parseFloat(max_val);
        if(field==='target_val')p.target_val=parseFloat(target_val);
      }
    }catch(e){ACAI.toast(e.message,'danger');}
  },800);
}

async function showHistory(paramId, paramName){
  const r=await ACAI.get(`/api/technolog/params/${paramId}/history`);
  const history=r.history||[];
  ACAI.showModal(`
    <h3>История изменений: ${paramName}</h3>
    <div style="max-height:400px;overflow-y:auto">
      ${history.length?history.map(h=>`
        <div style="padding:10px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:6px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:13px;font-weight:600"><span data-icon=user></span> ${h.changed_by||'—'}</span>
            <span style="font-size:11px;color:var(--text-dim);font-family:var(--mono)">${h.changed_at?.slice(0,16)||'—'}</span>
          </div>
          <div style="font-size:12px;color:var(--text-dim)">
            Мин: <b>${h.old_min??'—'}</b> → <b style="color:var(--accent)">${h.new_min??'—'}</b> &nbsp;
            Макс: <b>${h.old_max??'—'}</b> → <b style="color:var(--accent)">${h.new_max??'—'}</b> &nbsp;
            Цель: <b>${h.old_target??'—'}</b> → <b style="color:var(--accent)">${h.new_target??'—'}</b>
          </div>
        </div>`).join('')
      :'<div class="empty">История изменений пуста</div>'}
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="ACAI.closeModal()">Закрыть</button>
    </div>
  `);
}

function openAddParam(){
  const stages=['Массаподготовка','Формовка','Сушка','Обжиг','Упаковка','Лаборатория','Другое'];
  const units=['%','Гц','°C','бар','мм','кг/час','м/мин','час','л/мин','кПа','об/мин','мА','В','кВт'];
  ACAI.showModal(`
    <h3>Новый параметр</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label>Этап *</label>
        <select class="input" id="ap-stage">
          ${stages.map(s=>`<option>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Единица измерения</label>
        <select class="input" id="ap-unit">
          ${units.map(u=>`<option>${u}</option>`).join('')}
          <option value="custom">Другая...</option>
        </select>
      </div>
      <div class="field" style="grid-column:1/-1"><label>Название параметра *</label>
        <input class="input" id="ap-name" placeholder="Например: Температура Зона 5">
      </div>
      <div class="field" id="ap-unit-custom-wrap" style="display:none;grid-column:1/-1">
        <label>Своя единица</label>
        <input class="input" id="ap-unit-custom" placeholder="Например: т/сут">
      </div>
      <div class="field"><label>Мин</label><input class="input" id="ap-min" type="number" step="0.1" placeholder="0"></div>
      <div class="field"><label>Макс</label><input class="input" id="ap-max" type="number" step="0.1" placeholder="100"></div>
      <div class="field"><label>Цель</label><input class="input" id="ap-target" type="number" step="0.1" placeholder="50"></div>
    </div>
    <div id="ap-err" style="color:var(--danger);font-size:12px;min-height:16px"></div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="ACAI.closeModal()">Отмена</button>
      <button class="btn primary" onclick="submitAddParam()">Добавить</button>
    </div>
  `);
  document.getElementById('ap-unit').onchange=function(){
    document.getElementById('ap-unit-custom-wrap').style.display=this.value==='custom'?'block':'none';
  };
}

async function submitAddParam(){
  const name=document.getElementById('ap-name')?.value.trim();
  const stage=document.getElementById('ap-stage')?.value;
  const unitSel=document.getElementById('ap-unit')?.value;
  const unit=unitSel==='custom'?document.getElementById('ap-unit-custom')?.value.trim():unitSel;
  const errEl=document.getElementById('ap-err');
  if(!name){errEl.textContent='Введите название';return;}
  try{
    const r=await fetch('/api/technolog/params',{
      method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        stage,param_name:name,unit:unit||null,
        min_val:parseFloat(document.getElementById('ap-min')?.value)||null,
        max_val:parseFloat(document.getElementById('ap-max')?.value)||null,
        target_val:parseFloat(document.getElementById('ap-target')?.value)||null,
      })
    });
    const rd=await r.json();
    if(!rd.success){errEl.textContent=rd.message||'Ошибка';return;}
    ACAI.toast('Параметр добавлен ✓','ok');
    ACAI.closeModal();
    await load();
  }catch(e){errEl.textContent=e.message;}
}

async function deleteParam(id,name){
  if(!confirm(`Удалить параметр "${name}"?`))return;
  try{
    await fetch(`/api/technolog/params/${id}`,{method:'DELETE',credentials:'include'});
    ACAI.toast('Удалено');
    allParams=allParams.filter(p=>p.id!==id);
    renderStages();renderMetrics();
  }catch(e){ACAI.toast(e.message,'danger');}
}
async function refreshLive(){
  try{
    const [live, health] = await Promise.allSettled([
      ACAI.get('/api/sensors/live'),
      ACAI.get('/api/sensors/health')
    ]);
    liveData=live.value||{};
    collection=health.value||collection;

    const box=document.getElementById('sensorTime');
    if(box){
      // Когда сбор стоит, время последнего значения — это не «WebHMI
      // сейчас», а «когда данные были в последний раз». Так и пишем:
      // иначе строка читается как отметка свежести.
      if(collection && !collection.ok && collection.state!=='never'){
        const since=(collection.since||'').slice(11,16);
        box.textContent = since ? 'нет данных с '+since : 'нет данных';
      }else{
        const ts=Object.values(liveData)[0]?.updated_at;
        if(ts)box.textContent='WebHMI: '+new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      }
    }

    renderCollection();
    renderStages();
    renderMetrics();
  }catch{}
}

async function init(){
  const ctx=await initLayout();
  currentUser=ctx?.user;
  await load();
  setInterval(refreshLive,3000);
}
init();
</script>
