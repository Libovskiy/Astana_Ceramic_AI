<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой регламент — ACAI</title>
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/acai.css?v=15">
<style>
/* Вёрстка под телефон у станка: крупные цифры, никакой мелочи.
   Человек смотрит на это в цеху, часто в перчатках и при плохом свете. */
.prod-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;background:var(--surface-2);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}
.prod-name{font-size:17px;font-weight:700}
.prod-sub{font-size:12px;color:var(--text-dim);margin-top:2px}

.param{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;margin-bottom:8px}
.param.critical{border-color:var(--danger)}
.param-name{font-size:15px;font-weight:600;line-height:1.3}
.param-where{font-size:11px;color:var(--text-dim);margin-top:3px}
.param-norm{font-family:var(--mono);font-size:22px;font-weight:700;
  white-space:nowrap;text-align:right}
.crit-mark{display:inline-block;font-size:10px;font-weight:700;color:var(--danger);
  border:1px solid var(--danger);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}

.ack-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;
  margin-bottom:14px;font-size:13px;flex-wrap:wrap}
.ack-need{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3)}
.ack-done{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:var(--ok)}

@media (max-width:520px){
  .param{flex-direction:column;align-items:flex-start;gap:6px}
  .param-norm{font-size:26px;text-align:left}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Мой регламент</div>
        <div class="topbar-sub">Нормы по вашему оборудованию</div>
      </div>
      <div class="topbar-right"><span class="topbar-clock" id="topbarClock"></span></div>
    </header>
    <div class="page">
      <div id="pickWrap" style="display:none;margin-bottom:14px">
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px">
          За вами не закреплено оборудование. Выберите станок — или попросите
          мастера закрепить его за вами, тогда нормы будут открываться сразу.
        </div>
        <select class="input" id="eqPick" onchange="load(this.value)">
          <option value="">— выберите станок —</option>
        </select>
      </div>

      <div id="content"><div class="empty">Загрузка...</div></div>
    </div>
  </div>
</div>

<script src="/static/acai_layout.js?v=14"></script>
<script src="/static/mobile_nav_v2.js?v=3"></script>
<script>
let picked = null;

async function load(equipmentId){
  picked = equipmentId || null;

  let d;
  try{
    const url = picked ? `/api/my-regulation?equipment_id=${picked}` : '/api/my-regulation';
    d = await ACAI.get(url);
  }catch(e){
    document.getElementById('content').innerHTML =
      `<div class="empty">Не удалось загрузить: ${e.message||''}</div>`;
    return;
  }

  // Нет закреплённого оборудования — даём выбрать вручную.
  if(!d.bound && !picked){
    const wrap = document.getElementById('pickWrap');
    const select = document.getElementById('eqPick');
    select.innerHTML = '<option value="">— выберите станок —</option>' +
      (d.all_equipment||[]).map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
    wrap.style.display = '';
  }

  render(d);
}

function render(d){
  const groups = d.groups || [];

  if(!groups.length){
    document.getElementById('content').innerHTML = `
      <div class="empty" style="line-height:1.7">
        По вашему оборудованию действующих норм пока нет.<br>
        <span style="font-size:12px">Технолог ещё не завёл регламент или не привязал
        параметры к станку. Работайте по прежним указаниям мастера.</span>
      </div>`;
    return;
  }

  document.getElementById('content').innerHTML = groups.map(g=>`
    <div style="margin-bottom:22px">
      <div class="prod-head">
        <div>
          <div class="prod-name">${g.product_type || g.regulation_name || 'Регламент'}</div>
          <div class="prod-sub">${g.regulation_name || ''} · версия ${g.version ?? '—'}</div>
        </div>
      </div>

      ${g.acknowledged ? `
        <div class="ack-bar ack-done">✓ Вы ознакомлены с этой версией</div>
      ` : `
        <div class="ack-bar ack-need">
          <span style="flex:1">Вы ещё не отмечали, что прочитали эти нормы.</span>
          <button class="btn primary sm" onclick="ack(${g.regulation_id})">Ознакомлен</button>
        </div>
      `}

      ${g.parameters.map(p=>`
        <div class="param ${p.is_critical?'critical':''}">
          <div>
            <div class="param-name">
              ${p.name}${p.is_critical?'<span class="crit-mark">важно</span>':''}
            </div>
            ${(p.equipment_name||p.stage_name)?`
              <div class="param-where">${[p.equipment_name,p.stage_name].filter(Boolean).join(' · ')}</div>
            `:''}
          </div>
          <div class="param-norm">${p.norm}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

async function ack(regulationId){
  try{
    await ACAI.post(`/api/my-regulation/${regulationId}/ack`, {});
    ACAI.toast('Отмечено: ознакомлен','ok');
    await load(picked);
  }catch(e){
    ACAI.toast(e.message||'Не получилось отметить','danger');
  }
}

initLayout();
load();
</script>
</body>
</html>
