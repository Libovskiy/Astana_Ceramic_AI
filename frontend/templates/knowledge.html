<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Знания — ACAI</title>
<script src="/static/theme.js?v=2"></script>
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/acai.css?v=57">
<style>
/* Раздел «Знания» — три источника ответа «как чинить», сведённые на
   одну страницу. Раньше их было два: «Инструкции» и «База знаний»,
   причём вторая целиком повторяла половину первой, а документация
   станков не была видна нигде, кроме карточки своего станка. */
.kn-tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.kn-tab {
  padding:8px 14px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim);
  font-size:13px; font-weight:600; cursor:pointer; font-family:var(--sans);
  display:flex; align-items:center; gap:7px;
}
.kn-tab:hover { border-color:var(--accent); }
.kn-tab.on { background:var(--accent-solid); border-color:var(--accent-solid); color:#fff; }
.kn-tab .kn-n {
  font-size:11px; padding:1px 7px; border-radius:999px;
  background:var(--surface-2); color:var(--text-dim);
}
.kn-tab.on .kn-n { background:rgba(255,255,255,.22); color:#fff; }

.kb-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:16px; margin-bottom:8px;
  cursor:pointer; transition:border-color .15s;
  border-left:4px solid var(--border);
}
.kb-card:hover { border-color:var(--accent); }
.kb-card.confirmed { border-left-color:var(--ok); }
.kb-machine { font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px; }
.kb-symptom { font-size:14px;font-weight:600;margin-bottom:6px; }
.kb-resolution { font-size:13px;color:var(--text-dim);line-height:1.5; }
.kb-footer { display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--text-dim);flex-wrap:wrap; }

.section-head {
  font-size:11px;font-weight:700;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.06em;
  margin:20px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.section-count { background:var(--surface-2);padding:2px 8px;border-radius:999px;font-weight:400; }

/* Строка документа: название, станок, размер — и ссылка на файл. */
.doc-row {
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-bottom:1px solid var(--border);
  text-decoration:none; color:inherit;
}
.doc-row:last-child { border-bottom:none; }
.doc-row:hover { background:var(--surface-2); }
.doc-row [data-icon] { color:var(--text-dim); display:flex; flex-shrink:0; }
.doc-name { font-size:13px; font-weight:600;
  /* Имена вроде «GERIM_-______________» длиннее строки. Переносим
     по знакам, а не обрезаем: обрезанное имя не опознать. */
  overflow-wrap:anywhere; }
.doc-where { font-size:11px; color:var(--text-dim); margin-top:2px; }
.doc-row.gone { cursor:default; opacity:.65; }
.doc-row.gone:hover { background:none; }
.doc-note { font-size:12px;color:var(--text-dim);line-height:1.5;margin:0 0 10px; }
.doc-part { font-size:12px;font-weight:600;color:var(--text);
  margin:12px 0 6px;display:flex;align-items:center;gap:8px; }
.doc-part-n { font-size:11px;font-weight:400;color:var(--text-dim);
  background:var(--surface-2);padding:1px 7px;border-radius:999px; }
.section-head.foldable { cursor:pointer; }
.section-head.foldable:hover { color:var(--accent); }
.doc-caret { display:inline-block;width:12px;color:var(--text-dim); }
.doc-part.foldable { cursor:pointer; }
.doc-part.foldable:hover { color:var(--accent); }
.doc-part-hint { font-size:11px;font-weight:400;color:var(--accent); }
.doc-orig { font-size:11px;color:var(--text-dim);flex-shrink:0;
  border-bottom:1px dotted var(--text-dim);cursor:pointer; }
.doc-orig:hover { color:var(--accent);border-color:var(--accent); }

.search-wrap { position:relative;margin-bottom:16px; }
.search-wrap input { padding-left:36px; }
.search-wrap [data-icon] { position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);pointer-events:none;display:flex; }

@media (max-width: 560px) {
  /* Под палец: 44 px — минимум, ниже промахиваются. */
  .kn-tab { flex:1; justify-content:center; padding:12px 10px; min-height:44px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Знания</div>
        <div class="topbar-sub">Инструкции, решения из обращений, документация станков</div>
      </div>
      <div class="topbar-right">
        <button class="btn primary sm" id="procAddBtn" style="display:none" onclick="openProcForm()">+ Инструкция</button>
        <span class="topbar-clock" id="topbarClock"></span>
      </div>
    </header>
    <div class="page">

      <!-- Поиск один на все три вкладки: человек у станка не знает и не
           должен знать, инструкция это, чужое решение или страница
           руководства. Он знает слово «подшипник». -->
      <div class="search-wrap">
        <span data-icon=search></span>
        <input class="input" id="searchKn" placeholder="Поиск по станку, симптому или названию документа...">
      </div>

      <div class="kn-tabs" id="knTabs"></div>

      <!-- Вывод о состоянии знаний: из них ИИ берёт ответы, и пока
           брать нечего, он честно зовёт механика. -->
      <div class="verdict calm" id="kbVerdict">
        <div class="v-title" style="color:var(--text-dim)">Смотрю знания…</div>
      </div>

      <div id="knContent"><div class="empty">Загрузка...</div></div>

    </div>
  </div>
</div>

<div class="overlay hidden" id="_overlay">
  <div class="modal" id="_modal" style="width:580px;max-width:95vw"></div>
</div>

<script src="/static/icons.js?v=4"></script>
<script src="/static/acai_layout.js?v=57"></script>
<script src="/static/mobile_nav_v2.js?v=6"></script>
<script>
// ── Три источника знаний ────────────────────────────────────────────
let procedures = {};      // инструкции завода, пишут люди
let resolutions = {};     // решения из закрытых обращений
let docGroups = [];       // документация с диска, по станкам
let docOrphans = [];      // записи системы, потерявшие файл
let docStats = {};
let procEquipment = [];
let knUser = null;
let tab = 'proc';
let searchQ = '';

const PROC_WRITE_ROLES = ['chief_engineer','chief_mechanic','chief_electrician','admin'];

const TABS = [
  {key:'proc', icon:'instructions', label:'Инструкции'},
  {key:'sol',  icon:'diagnostics',  label:'Решения из обращений'},
  {key:'doc',  icon:'reports',      label:'Документация'},
];

function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}

function has(text){ return String(text||'').toLowerCase().includes(searchQ); }

// ── Сколько в каждой вкладке С УЧЁТОМ поиска ────────────────────────
// Счётчик по всему разделу при активном поиске врал бы: человек видит
// «Документация 18», открывает и находит там одну строку.
function counts(){
  return {
    proc: Object.entries(procedures).reduce((n,[m,items]) =>
      n + items.filter(p => !searchQ || has(m) || has(p.title)).length, 0),
    sol: Object.entries(resolutions).reduce((n,[m,items]) =>
      n + items.filter(i => !searchQ || has(m) || has(i.symptom) || has(i.resolution)).length, 0),
    doc: docGroups.reduce((n, g) => n + g.items.filter(d => docMatch(g, d)).length, 0),
  };
}

function renderTabs(){
  const c = counts();
  document.getElementById('knTabs').innerHTML = TABS.map(t => `
    <button class="kn-tab ${tab===t.key?'on':''}" onclick="switchTab('${t.key}')">
      <span data-icon=${t.icon}></span> ${t.label}
      <span class="kn-n">${c[t.key]}</span>
    </button>`).join('');
  ACAI.paintIcons(document.getElementById('knTabs'));
}

function switchTab(key){
  tab = key;
  renderTabs();
  render();
}

// ── Вывод: хватает ли знаний, чтобы ИИ не отвечал «не знаю» ─────────
function renderVerdict(){
  const procTotal = Object.values(procedures).reduce((s,a)=>s+a.length,0);
  const solTotal = Object.values(resolutions).reduce((s,a)=>s+a.length,0);
  const docTotal = docStats.unique || 0;
  const missing = docOrphans.length;

  if(!procTotal && !solTotal && !docTotal){
    ACAI.verdict('kbVerdict', {title:'Знаний пока нет',
      sub:'ИИ по любой поломке зовёт механика. Знания появятся, когда заведут первую инструкцию или закроют обращение с описанием ремонта.'});
    return;
  }

  const rows = [];
  if(!procTotal) rows.push({level:'warning', what:'Инструкций нет ни одной',
    where:'ИИ ищет здесь в первую очередь — пока искать нечего'});
  if(!solTotal) rows.push({level:'warning', what:'Решений из обращений нет',
    where:'они появляются сами, когда специалист закрывает обращение с описанием ремонта'});
  if(missing) rows.push({level:'warning', what:`Записей без файла: ${missing}`,
    where:'документ заводили, но файла по этому пути нет — надо перезалить'});
  if(docStats.empty) rows.push({level:'warning', what:`Пустых файлов: ${docStats.empty}`,
    where:'файл на диске есть, но в нём ноль байт — страницу надо загрузить заново в карточке станка'});
  if(docStats.replaced) rows.push({level:'info', what:`Перезалито страниц: ${docStats.replaced}`,
    where:'пустые заменены — из списка убраны, в группе станка осталась живая страница'});
  if(docStats.unlinked) rows.push({level:'info', what:`Не привязано к станку: ${docStats.unlinked}`,
    where:'папка не совпала ни с одним названием станка — лежат в конце списка'});

  const sub = `Инструкций ${procTotal} · решений ${solTotal} · документов ${docTotal}`;
  if(rows.length){
    ACAI.verdict('kbVerdict', {title:sub, rows});
    return;
  }
  ACAI.verdict('kbVerdict', {title:'Знания есть по всем трём источникам', sub});
}

// В базе симптом хранится вместе с названием станка («Дробилка DTE 117.
// стучит вал»), а на карточке станок и так написан отдельной строкой.
// Показываем только саму жалобу.
function shortSymptom(text, machine) {
  const value = String(text || '').trim();
  const name = String(machine || '').trim();
  if (!name || !value.toLowerCase().startsWith(name.toLowerCase())) return value;
  return value.slice(name.length).replace(/^[\s.,:;—-]+/, '') || value;
}

// ── Вкладка «Инструкции» ────────────────────────────────────────────
function renderProcedures(){
  const canWrite = PROC_WRITE_ROLES.includes(knUser?.role);
  const groups = Object.entries(procedures)
    .map(([machine, items]) => [machine, items.filter(p => !searchQ || has(machine) || has(p.title))])
    .filter(([, items]) => items.length);

  if(!groups.length){
    return searchQ
      ? '<div class="empty compact"><span class="empty-text">По запросу инструкций нет.</span></div>'
      : `<div class="empty compact"><span class="empty-text">Инструкций пока нет. ИИ ищет здесь в первую очередь — заведите первую, и он начнёт её показывать сразу.</span>${
          canWrite ? '<button class="btn secondary sm" onclick="openProcForm()">+ Инструкция</button>' : ''}</div>`;
  }

  return groups.map(([machine, items]) => `
    <div class="section-head">
      <span><span data-icon=equipment></span> ${esc(machine)}</span>
      <span class="section-count">${items.length}</span>
    </div>
    ${items.map(p => `
      <div class="top-item" style="align-items:flex-start;cursor:pointer" onclick="openProcView(${p.id})">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(p.title)}</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:2px">
            ${p.steps_count!=null?p.steps_count+' шагов':''}${p.duration_minutes?' · '+p.duration_minutes+' мин':''}${p.requires_stop?' · нужна остановка':''}
          </div>
        </div>
        ${canWrite?`<button class="btn danger sm" onclick="event.stopPropagation();deleteProc(${p.id})" title="Убрать">✕</button>`:''}
      </div>`).join('')}
  `).join('');
}

// ── Вкладка «Решения из обращений» ──────────────────────────────────
function renderResolutions(){
  const groups = Object.entries(resolutions)
    .map(([machine, items]) => [machine, items.filter(i =>
      !searchQ || has(machine) || has(i.symptom) || has(i.resolution))])
    .filter(([, items]) => items.length);

  if(!groups.length){
    return searchQ
      ? '<div class="empty compact"><span class="empty-text">По запросу решений нет.</span></div>'
      : `<div class="empty compact"><span class="empty-text">Решений пока нет — они появляются сами, когда специалист закрывает обращение с описанием ремонта.</span><a class="btn secondary sm" href="/cases">Обращения</a></div>`;
  }

  return groups.map(([machine, items]) => `
    <div class="section-head">
      <span><span data-icon=diagnostics></span> ${esc(machine)}</span>
      <span class="section-count">${items.length}</span>
    </div>
    ${items.map(item => `
      <div class="kb-card ${item.confirmed_by?'confirmed':''}" onclick="openItem(${JSON.stringify(item).replace(/"/g,'&quot;')})">
        <div class="kb-machine">${esc(machine)}</div>
        <div class="kb-symptom">${esc(shortSymptom(item.symptom, machine)) || 'Общее решение'}</div>
        <div class="kb-resolution">${esc((item.resolution||'').slice(0,120))}${(item.resolution||'').length>120?'…':''}</div>
        <div class="kb-footer">
          ${item.confirmed_by ? `<span class="badge ok">Подтвердил ${esc(item.confirmed_by)}</span>` : '<span class="badge neutral">Из документации</span>'}
          ${item.use_count ? `<span>Использовано ${item.use_count} раз</span>` : ''}
          ${item.created_at ? `<span>${ACAI.shortDate(item.created_at)}</span>` : ''}
        </div>
      </div>`).join('')}
  `).join('');
}

// ── Вкладка «Документация» ──────────────────────────────────────────
// Показываем то, что лежит на диске, а не то, что завели руками: в
// списке системы 18 строк, на диске 650 файлов. Одинаковые файлы
// схлопнуты по sha256 — одну инструкцию по вентилятору положили в
// пять папок, и списком это читалось бы как пять разных документов.
function docSize(bytes){
  const mb = (bytes || 0) / 1048576;
  return mb >= 1 ? `${mb.toFixed(1)} МБ` : `${Math.max(1, Math.round((bytes||0)/1024))} КБ`;
}

// Со скольких файлов часть сворачивается: до восьми список читается,
// дальше он выдавливает соседние станки за экран.
const DOC_PART_FOLD = 8;

// Что человек раскрыл руками.
const docOpen = new Set();
function docToggle(title){
  docOpen.has(title) ? docOpen.delete(title) : docOpen.add(title);
  render();
}

// Параметр называется file, а не item: «item» на этой странице — это
// решение из обращения, и tests/test_knowledge_shows_content.py сверяет
// все item.<поле> с ответом /api/knowledge. Документ приходит из другого
// запроса, и путать их нельзя — проверка перестанет ловить настоящее.
function docMatch(group, file){
  // Ищем и по всему пути: «ПАСПОРТ РЕСИВЕР 627481 ЗАО РЕМЕЗА-2» —
  // это папка в середине дерева, а имя файла у неё «1.pdf». По имени
  // и верхней папке такой документ не найти вовсе.
  return !searchQ || has(file.title) || has(group.title)
      || has(file.part) || has(group.sub) || has(file.path);
}

function renderDocuments(){
  const groups = docGroups
    .map(g => ({...g, items: g.items.filter(i => docMatch(g, i))}))
    .filter(g => g.items.length);

  if(!groups.length && !docOrphans.length){
    return searchQ
      ? '<div class="empty compact"><span class="empty-text">По запросу документов нет.</span></div>'
      : '<div class="empty compact"><span class="empty-text">Документов нет. Руководства кладут в папки завода или прикрепляют в карточке станка.</span><a class="btn secondary sm" href="/equipment">Оборудование</a></div>';
  }

  const head = (!searchQ && docStats.unique) ? `
    <div class="doc-note">
      Всего файлов ${docStats.files_total}, из них разных ${docStats.unique}${
        docStats.duplicates ? ` · одинаковых копий ${docStats.duplicates}, показаны один раз` : ''}.
      Файлы открываются только после входа в систему.
    </div>` : '';

  const orphans = (!searchQ && docOrphans.length) ? `
    <div class="section-head">
      <span><span data-icon=alert></span> Файл не найден</span>
      <span class="section-count">${docOrphans.length}</span>
    </div>
    <div class="doc-note">Эти документы заводили в системе, но файла по записанному пути нет — их надо перезалить. Записи оставлены, чтобы было видно, что именно пропало.</div>
    <div class="card"><div class="card-body" style="padding:0">
      ${docOrphans.map(o => `
        <div class="doc-row gone" title="${esc(o.file_path || '')}">
          <span data-icon=alert></span>
          <div style="flex:1;min-width:0">
            <div class="doc-name">${esc(o.title)}</div>
            <div class="doc-where">${esc(o.equipment_name || 'станок не указан')}${o.added_at ? ' · заведён ' + ACAI.shortDate(o.added_at) : ''}</div>
          </div>
        </div>`).join('')}
    </div></div>` : '';

  return head + groups.map((g, gi) => {
    // Внутри станка — по частям: «РЭ», «Электрическая схема». Без
    // этого руководство по вальцам выглядело бы списком из 114
    // безымянных сканов вместо двух документов.
    const byPart = {};
    g.items.forEach(i => (byPart[i.part || ''] ||= []).push(i));
    const parts = Object.keys(byPart).sort();

    // Непривязанные папки свёрнуты: в «Технической базе» 400 с лишним
    // сканов, и развёрнутыми они превращали страницу в 40 000 px
    // скролла, сквозь который не пройти до нужного станка. При поиске
    // разворачиваем сами — человек ищет, а не листает.
    const open = g.linked || searchQ || docOpen.has(g.title);
    const body = !open ? '' : `
      ${g.linked ? '' : `<div class="doc-note">${esc(g.sub)} — папка не совпала ни с одним названием станка, поэтому не привязана. Угадывать не стали.</div>`}
      ${parts.map(part => {
        // Руководство разложено постранично: 60 сканов «РЭ» — это один
        // документ, а не шестьдесят. Длинные части свёрнуты, чтобы
        // сквозь них было видно соседние станки.
        const key = g.title + '/' + part;
        const many = byPart[part].length > DOC_PART_FOLD;
        const shown = (!many || searchQ || docOpen.has(key)) ? byPart[part] : [];
        return `
        ${part ? `<div class="doc-part ${many ? 'foldable' : ''}"
             ${many ? `onclick="docToggle(${JSON.stringify(key).replace(/"/g,'&quot;')})"` : ''}>
             ${many ? `<span class="doc-caret">${shown.length ? '▾' : '▸'}</span>` : ''}${esc(part)}
             <span class="doc-part-n">${byPart[part].length}</span>
             ${many && !shown.length ? '<span class="doc-part-hint">показать</span>' : ''}</div>` : ''}
        ${!shown.length ? '' : `
        <div class="card" style="margin-bottom:8px"><div class="card-body" style="padding:0">
          ${shown.map(d => d.empty ? `
            <div class="doc-row gone" title="Файл на месте, но в нём ноль байт — страница не докопировалась при выгрузке">
              <span data-icon=alert></span>
              <div style="flex:1;min-width:0">
                <div class="doc-name">${esc(d.title)}</div>
                <div class="doc-where">файл пустой — страница потерялась при выгрузке</div>
              </div>
              ${docStats.can_upload_page ? `<button class="btn secondary sm"
                onclick="uploadPage(${JSON.stringify(d.path).replace(/"/g,'&quot;')})">Загрузить эту страницу</button>` : ''}
            </div>` : `
            <a class="doc-row" href="${d.preview_url || d.url}" target="_blank" rel="noopener">
              <span data-icon=reports></span>
              <div style="flex:1;min-width:0">
                <div class="doc-name">${esc(d.title)}</div>
                <div class="doc-where">${d.kind} · ${docSize(d.size_bytes)}${
                  d.also_in.length ? ` · лежит ещё в: ${esc(d.also_in.slice(0,2).join(', '))}${d.also_in.length>2?' и ещё '+(d.also_in.length-2):''}` : ''}</div>
              </div>
              ${d.preview_url
                // Скан в TIF Chrome не показывает — ни на компьютере, ни
                // на Android. По «Открыть» уходим на копию в PNG, а
                // оригинал остаётся отдельной кнопкой: он нужен тому,
                // кто печатает чертёж или кладёт его себе.
                ? `<span class="doc-orig" onclick="event.preventDefault();event.stopPropagation();window.open('${d.url}','_blank')" title="Скачать исходный TIF">оригинал</span>` : ''}
              <span class="badge accent" style="font-size:10px">Открыть</span>
            </a>`).join('')}
        </div></div>`}`;
      }).join('')}`;

    return `
      <div class="section-head ${g.linked ? '' : 'foldable'}"
           ${g.linked ? '' : `onclick="docToggle(${JSON.stringify(g.title).replace(/"/g,'&quot;')})"`}>
        <span>${g.linked ? '' : `<span class="doc-caret">${open ? '▾' : '▸'}</span>`}<span data-icon=${g.linked ? 'equipment' : 'reports'}></span> ${esc(g.title)}</span>
        <span class="section-count">${g.items.length}</span>
      </div>
      ${body}`;
  }).join('') + orphans;
}

function render(){
  const box = document.getElementById('knContent');
  box.innerHTML = tab === 'proc' ? renderProcedures()
                : tab === 'sol'  ? renderResolutions()
                : renderDocuments();
  ACAI.paintIcons(box);
}

// ── Загрузить страницу взамен пустой ────────────────────────────────
//
// Кладём файл В ТУ ЖЕ ПАПКУ, где лежит пустая страница. Через карточку
// станка это не работает для непривязанных документов: там файл уходит
// в uploads/<станок>, а у паспорта ресивера РЕМЕЗА станка нет вовсе —
// ни ресивера, ни компрессорной установки среди 49 единиц. Пустая
// страница в «Технической базе» так и осталась бы висеть.
function uploadPage(path){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png,.tif,.tiff,.doc,.docx,.xls,.xlsx';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    if (file.size === 0) { ACAI.toast('Этот файл тоже пустой', 'danger'); return; }
    if (file.size > 25 * 1024 * 1024) { ACAI.toast('Файл больше 25 МБ', 'danger'); return; }

    ACAI.toast('Загружаю…');
    try {
      const content = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
        reader.readAsDataURL(file);
      });
      await ACAI.post('/api/knowledge/documents/upload-page',
                      {path, filename: file.name, content});
      ACAI.toast('Страница загружена', 'ok');
      await loadAll();
    } catch (e) {
      ACAI.toast(e.message || 'Не удалось загрузить', 'danger');
    }
  };
  input.click();
}

      ${esc(p.equipment_name||'')}${p.duration_minutes?' · '+p.duration_minutes+' мин':''}${p.requires_stop?' · требуется остановка станка':''}

    <ol style="padding-left:20px;display:flex;flex-direction:column;gap:8px">
      ${(p.steps||[]).map(s=>`<li style="font-size:13px">${esc(s.text)}</li>`).join('')}
    </ol>

function openProcForm(){
  ACAI.showModal(`
    <h3>Новая инструкция</h3>
    <div class="field"><label>Оборудование *</label>
      <select class="input" id="pr-eq">

    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label>Сколько занимает, мин</label><input class="input" id="pr-dur" type="number" min="1" placeholder="30"></div>
      <div class="field"><label>Кто делает</label>
        <select class="input" id="pr-role">
          <option value="">— любой —</option>
          <option value="mechanic">механик</option>
          <option value="electrician">электрик</option>
          <option value="worker">оператор</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="pr-stop" style="width:auto"> Требуется остановка станка
      </label>
    </div>
    <div class="field"><label>Шаги *</label>
      <div id="pr-steps"></div>
      <button class="btn secondary sm" style="margin-top:6px" onclick="addProcStep()">+ Шаг</button>
    </div>

function addProcStep(){
  const box = document.getElementById('pr-steps');
  const n = box.children.length + 1;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  row.innerHTML = `<span style="font-size:12px;color:var(--text-dim);width:18px">${n}.</span>
    <input class="input pr-step" placeholder="Что сделать на этом шаге" style="flex:1">
    <button class="btn secondary sm" onclick="this.parentElement.remove();renumberProcSteps()">✕</button>`;
  box.appendChild(row);
}

function renumberProcSteps(){
  [...document.getElementById('pr-steps').children].forEach((row,i)=>{
    row.querySelector('span').textContent = (i+1)+'.';
  });
}

async function submitProc(){
  const errEl = document.getElementById('pr-err');
  const equipment_id = parseInt(document.getElementById('pr-eq').value||0);
  const title = document.getElementById('pr-title').value.trim();
  const steps = [...document.querySelectorAll('.pr-step')].map(i=>i.value.trim()).filter(Boolean);

  if(!equipment_id){ errEl.textContent='Выберите оборудование'; return; }
  if(!title){ errEl.textContent='Введите название'; return; }
  if(!steps.length){ errEl.textContent='Добавьте хотя бы один шаг'; return; }

  try{
    const r = await ACAI.post('/api/procedures',{
      equipment_id, title,
      duration_minutes: parseInt(document.getElementById('pr-dur').value||0) || null,
      target_role: document.getElementById('pr-role').value || null,
      requires_stop: document.getElementById('pr-stop').checked,
      steps,
    });
    if(r.success===false){ errEl.textContent=r.message||'Ошибка'; return; }
    ACAI.closeModal(); ACAI.toast('Инструкция добавлена','ok'); await loadAll();
  }catch(e){ errEl.textContent = e.message||'Ошибка'; }
}

async function deleteProc(id){
  if(!confirm('Убрать инструкцию?')) return;
  try{
    const r = await fetch(`/api/procedures/${id}`,{method:'DELETE',credentials:'include'});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status);
    ACAI.toast('Убрано','ok'); await loadAll();
  }catch(e){ ACAI.toast(e.message||'Не удалось','danger'); }
}

// ── Загрузка ────────────────────────────────────────────────────────
// Три запроса параллельно: последовательно страница ждала бы три
// круга до сети, а вкладки нужны сразу — по ним видно, где искать.
async function loadAll(){
  const [proc, know, docs] = await Promise.all([
    ACAI.get('/api/procedures').catch(() => ({})),
    ACAI.get('/api/knowledge').catch(() => ({})),
    ACAI.get('/api/knowledge/documents').catch(() => ({})),
  ]);
  procedures = proc.grouped || {};
  resolutions = know.grouped || {};
  docGroups = docs.groups || [];
  docOrphans = docs.orphans || [];
  docStats = {files_total: docs.files_total || 0, unique: docs.unique || 0,
              duplicates: docs.duplicates || 0, unlinked: docs.unlinked || 0,
              empty: docs.empty || 0, replaced: docs.replaced || 0,
              can_upload_page: docs.can_upload_page === true};

  // Открываем ту вкладку, где что-то есть: раздел с тремя пустыми
  // вкладками читается как сломанный, даже когда работает.
  const c = counts();
  if(!c.proc) tab = c.sol ? 'sol' : (c.doc ? 'doc' : 'proc');

  renderTabs();
  renderVerdict();
  render();
}
