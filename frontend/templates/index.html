<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACAI — Astana Ceramic</title>
<script src="/static/theme.js?v=2"></script>
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/acai.css?v=63">
<style>
/* ОТВЕТ НА ГЛАВНЫЙ ВОПРОС: всё ли в порядке */
.verdict{border-radius:16px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);}
.verdict.calm{padding:22px 24px;}
.verdict.calm .v-title{font-size:26px;font-weight:700;letter-spacing:-.01em;}
.verdict .v-sub{font-size:14px;color:var(--text-dim);margin-top:6px;line-height:1.45;}
.verdict.alert{border:2px solid var(--danger);overflow:hidden;}
.verdict.alert.only-warn{border-color:var(--warn);}
.v-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 10px;}
.v-head .v-title{font-size:22px;font-weight:700;}
.v-all{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.v-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--border);color:var(--text);text-decoration:none;}
.v-row:hover{background:var(--surface-2);}
.v-mark{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.v-row .v-what{font-size:16px;font-weight:600;}
.v-row .v-where{font-size:14px;color:var(--text-dim);margin-top:2px;}
.v-row .v-go{margin-left:auto;font-size:22px;color:var(--text-dim);}
@media (max-width:600px){
  .verdict.calm{padding:18px;}
  .verdict.calm .v-title{font-size:22px;}
  .v-head{padding:14px 16px 8px;}
  .v-head .v-title{font-size:19px;}
  .v-row{padding:14px 16px;}
}

/* Полоса показаний в две строки: сверху бункеры и питатели (что
   происходит с массой), снизу конвейеры (чем её везут). Раньше всё
   шло одной лентой, и на телефоне конвейеры перемешивались с
   бункерами. */
.sensor-strip{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 20px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
.ss-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.ss-row + .ss-row{border-top:1px solid var(--border);padding-top:8px;}
.ss-group{font-size:11px;color:var(--text-dim);flex-shrink:0;}
.ss-item{display:flex;align-items:center;gap:6px;}
.ss-stale{font-size:10px;color:var(--warn);white-space:nowrap;}
.ss-label{font-size:11px;color:var(--text-dim);}
.ss-val{font-family:var(--mono);font-size:13px;font-weight:700;}
.ss-bar{width:48px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.ss-fill{height:100%;border-radius:2px;transition:width .5s;}
.ss-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;}

/* Шапка карточки: слева раздел, справа вход в 3D-карту. Кнопка живёт
   в шапке, а показания — в #sensorStripBody, поэтому «нет данных» или
   остановленный сбор её не стирают: карта от датчиков не зависит. */
.ss-head{display:flex;align-items:center;gap:12px;justify-content:space-between;}
.ss-head + #sensorStripBody{border-top:1px solid var(--border);padding-top:8px;}
.ss-expand{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:border-color .15s,color .15s;}
.ss-expand:hover{border-color:var(--accent);color:var(--accent);}
.ss-expand svg{width:16px;height:16px;}

/* Развёрнутый вид — на весь экран: цех разглядывают, а не подсматривают
   в окошко. .overlay и .hidden — общие, из acai.css. */
.massa-overlay{padding:0;}
/* Размер берём от .overlay (position:fixed; inset:0), а не от 100vh:
   в мобильном Safari 100vh — это высота вместе со скрытой адресной
   строкой, и низ карты уезжал бы под экран. requestFullscreen не
   используем: у iframe он на телефонах работает через раз. */
.massa-modal{display:flex;flex-direction:column;width:100%;height:100%;
  background:var(--surface);}
.massa-modal-head{display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);flex:none;}
.massa-modal-title{display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;}
.massa-modal-title svg{width:18px;height:18px;}
.massa-frame{flex:1;min-height:0;width:100%;border:0;display:block;}

/* КАРТА */
.prod-map-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:16px;overflow:hidden;}
.prod-map-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);}
.prod-map-header h2{font-size:13px;font-weight:600;}
.prod-map-body{padding:16px 20px;overflow-x:auto;}

/* ЗОНЫ */
.prod-flow{display:flex;align-items:flex-end;gap:0;min-width:900px;}
.prod-zone{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 8px 14px;border-radius:14px;cursor:pointer;
  transition:transform .2s,box-shadow .2s;
  position:relative;
}
.prod-zone:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4);}
/* норма — спокойная, цвет только у отклонений */
.prod-zone.ok{background:var(--surface-2);border:1px solid var(--border);}
.prod-zone.warn{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.3);}
.prod-zone.danger{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.3);}

.zone-3d{width:100%;height:120px;display:flex;align-items:center;justify-content:center;}
.zone-name{font-size:12px;font-weight:700;text-align:center;}
.zone-pct{font-family:var(--mono);font-size:15px;font-weight:700;}
.zone-bar{width:80%;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.zone-bar-fill{height:100%;border-radius:2px;transition:width 1s;}
.zone-status{font-size:10px;font-weight:600;}
.zone-pulse{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;}
.zone-pulse.ok{display:none;}
.zone-pulse.warn{background:var(--warn);animation:zpulse 1.5s infinite;}
.zone-pulse.danger{background:var(--danger);animation:zpulse 1s infinite;}
@keyframes zpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

.prod-arrow{display:flex;align-items:center;padding:0 4px;padding-bottom:40px;}
.prod-arrow svg{flex-shrink:0;}

/* НИЖНЯЯ СЕТКА */
.bottom-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
.case-row{padding:9px 10px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--border);margin-bottom:5px;cursor:pointer;}
.case-row.esc{border-left-color:var(--danger);}
.case-row.draft{border-left-color:var(--warn);}
.case-row.open{border-left-color:var(--accent);}
.prob-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.prob-row:last-child{border-bottom:none;}

/* НЕДЕЛЯ */
.week-strip{display:flex;gap:6px;}
.week-day{flex:1;text-align:center;padding:8px 4px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--surface-2);transition:all .15s;position:relative;}
.week-day:hover{border-color:var(--accent);}
/* Сегодня — обводка и подпись; выбранный день — заливка. Два разных
   признака, поэтому их видно и в светлой теме, и при дальтонизме. */
.week-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.week-day.today .wd-num{font-weight:700;}
.wd-today{font-size:9px;font-weight:600;color:var(--accent);letter-spacing:.02em;margin-top:1px;}
.week-day.has-task::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--warn);}
.week-day.today.has-task::after{background:var(--warn);}
.wd-name{font-size:10px;color:var(--text-dim);margin-bottom:3px;}
.wd-num{font-size:15px;font-weight:700;}
.today .wd-name,.today .wd-num{color:#fff;}
.dev-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--surface-2);margin-bottom:4px;font-size:12px;}
.dev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cal-full{margin-top:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dn{font-size:10px;color:var(--text-dim);text-align:center;padding:3px;font-weight:600;}
.cal-d{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:background .15s;position:relative;}
.cal-d:hover{background:var(--border);}
.cal-d.today{background:var(--accent-solid);color:#fff;font-weight:700;}
.cal-d.has-task::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--warn);}
.cal-d.today.has-task::after{background:#fff;}  /* на залитом синем белая точка видна */
.cal-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);cursor:pointer;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;transition:color .15s;}
.cal-toggle:hover{color:var(--text);}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <!-- Было «Производство» — так же называется соседняя вкладка, и
             было непонятно, на какой странице находишься. -->
        <div class="topbar-title">Главная</div>
        <div class="topbar-sub" id="topbarDate"></div>
      </div>
      <div class="topbar-right">
        <span class="topbar-clock" id="topbarClock"></span>
      </div>
    </header>
    <div class="page">

      <!-- Директор открывает главную с одним вопросом: всё ли в порядке.
           Ответ — первым: «Завод работает» или 2–3 строки «что решить»,
           каждая ведёт прямо в запись. Цифры и цепочка — ниже. -->
      <div class="verdict calm" id="verdict">
        <div class="v-title" style="color:var(--text-dim)">Проверяю…</div>
      </div>

      <div class="metrics" id="metrics" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px">
        <div class="metric"><div class="metric-label">Загрузка...</div><div class="metric-value" style="color:var(--text-dim)">—</div></div>
      </div>

      <!-- Массаподготовка: быстрый взгляд — те же показания, что были
           здесь раньше, тем же способом и из того же источника. 3D-карта
           линии лежит за кнопкой «Развернуть»: внутри карточки её нет,
           чтобы сводка открывалась так же быстро, как раньше. -->
      <div class="sensor-strip" id="sensorStrip">
        <div class="ss-head">
          <span class="ss-group"><span data-icon=gear></span> Массаподготовка · WebHMI</span>
          <button type="button" class="ss-expand" id="massaExpand" onclick="openMassaMap()"
                  title="3D-карта линии массаподготовки">
            <span data-icon=cube></span> Развернуть
          </button>
        </div>
        <div id="sensorStripBody">
          <span style="font-size:11px;color:var(--text-dim)">Откройте вкладку WebHMI</span>
        </div>
      </div>

      <!-- Развёрнутый вид: сцена живёт отдельной страницей и грузится
           в iframe только после нажатия. Закрыли — адрес убираем,
           чтобы Three.js не держал видеокарту в фоне. -->
      <div class="overlay massa-overlay hidden" id="massaOverlay">
        <div class="massa-modal">
          <div class="massa-modal-head">
            <span class="massa-modal-title"><span data-icon=cube></span> Массаподготовка — 3D карта линии</span>
            <button type="button" class="ss-expand" onclick="closeMassaMap()">
              <span data-icon=close></span> Свернуть
            </button>
          </div>
          <iframe class="massa-frame" id="massaFrame" title="3D-карта линии массаподготовки"></iframe>
        </div>
      </div>

      <!-- ПРОИЗВОДСТВЕННАЯ КАРТА -->
      <div class="prod-map-wrap">
        <div class="prod-map-header">
          <h2>Производственная цепочка — Astana Ceramic</h2>
          <span id="mapTime" style="font-size:11px;color:var(--text-dim)"></span>
        </div>
        <div class="prod-map-body">
          <div class="prod-flow" id="prodFlow"></div>
        </div>
      </div>

      <div class="bottom-grid">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="card">
            <div class="card-head">
              <h2>Открытые обращения</h2>
              <span id="openCount" style="font-size:11px;color:var(--text-dim);background:var(--surface-2);padding:2px 8px;border-radius:999px">0</span>
            </div>
            <div class="card-body" id="caseList" style="padding:10px 12px"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>Частые неисправности</h2></div>
            <div class="card-body" id="problemList" style="padding:10px 16px"></div>
          </div>
          <!-- Простой цеха директор должен видеть сразу, не заходя в аналитику -->
          <div class="card">
            <div class="card-head">
              <h2>Простои сегодня</h2>
              <span id="downtimeTotal" style="font-size:11px;color:var(--text-dim);background:var(--surface-2);padding:2px 8px;border-radius:999px">—</span>
            </div>
            <div class="card-body" id="downtimeList" style="padding:10px 12px"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2>Календарь</h2>
            <div class="cal-toggle" onclick="toggleCal()">
              <span><span data-icon=calendar></span></span><span id="calToggleText">Развернуть</span>
            </div>
          </div>
          <div class="card-body" style="padding:10px 14px">
            <div id="weekView">
              <div class="week-strip" id="weekStrip"></div>
              <div id="weekEvents" style="margin-top:8px"></div>
            </div>
            <div id="fullCal" style="display:none" class="cal-full">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                <button onclick="prevMonth()" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text);cursor:pointer;font-size:12px">‹</button>
                <span id="calMonth" style="font-size:13px;font-weight:600"></span>
                <button onclick="nextMonth()" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text);cursor:pointer;font-size:12px">›</button>
              </div>
              <div class="cal-grid" id="calGrid"></div>
              <div id="calDayEvents" style="margin-top:8px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/icons.js?v=6"></script>
<script src="/static/sensor-names.js?v=4"></script>
<script src="/static/acai_layout.js?v=64"></script>
<script src="/static/mobile_nav_v2.js?v=6"></script>
<script>
document.getElementById('topbarDate').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});

// ── 3D SVG МОДЕЛИ ЦЕХОВ ────────────────────────────────────
function svgMassa(color){
  return `<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <!-- здание изометрия -->
    <polygon points="20,60 60,40 100,60 100,90 60,110 20,90" style="fill:var(--ill-2)" stroke="${color}" stroke-width="1.5"/>
    <polygon points="20,60 60,40 60,70 20,90" style="fill:var(--ill-1)" stroke="${color}" stroke-width="1"/>
    <polygon points="60,40 100,60 100,90 60,70" style="fill:var(--ill-3)" stroke="${color}" stroke-width="1"/>
    <polygon points="20,60 60,40 100,60 60,80" style="fill:var(--ill-4)" stroke="${color}" stroke-width="1"/>
    <!-- крыша акцент -->
    <polygon points="20,60 60,40 100,60 60,80" fill="${color}" opacity=".15"/>
    <!-- дробилка -->
    <rect x="42" y="55" width="16" height="18" rx="3" style="fill:var(--ill-5)" stroke="${color}" stroke-width="1"/>
    <rect x="45" y="58" width="10" height="4" rx="1" fill="${color}" opacity=".6"/>
    <!-- бункер -->
    <polygon points="48,48 72,48 68,56 52,56" style="fill:var(--ill-6)" stroke="${color}" stroke-width="1"/>
    <!-- конвейер анимированный -->
    <line x1="20" y1="85" x2="100" y2="85" stroke="${color}" stroke-width="2" opacity=".3"/>
    <rect x="20" y="83" width="8" height="4" rx="2" fill="${color}" opacity=".7">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="80,0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- труба -->
    <rect x="72" y="30" width="6" height="20" rx="2" style="fill:var(--ill-4)" stroke="${color}" stroke-width="1"/>
    <ellipse cx="75" cy="30" rx="4" ry="2" style="fill:var(--ill-5)" stroke="${color}" stroke-width="1"/>
    <!-- пар -->
    <circle cx="75" cy="24" r="3" fill="white" opacity=".2">
      <animate attributeName="cy" from="24" to="18" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".2" to="0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78" cy="22" r="2" fill="white" opacity=".15">
      <animate attributeName="cy" from="22" to="15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".15" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </svg>`;
}

function svgFormovka(color){
  return `<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <polygon points="20,60 60,40 100,60 100,90 60,110 20,90" style="fill:var(--ill-2)" stroke="${color}" stroke-width="1.5"/>
    <polygon points="20,60 60,40 60,70 20,90" style="fill:var(--ill-1)" stroke="${color}" stroke-width="1"/>
    <polygon points="60,40 100,60 100,90 60,70" style="fill:var(--ill-3)" stroke="${color}" stroke-width="1"/>
    <polygon points="20,60 60,40 100,60 60,80" fill="${color}" opacity=".12"/>
    <!-- пресс экструдер -->
    <rect x="35" y="58" width="50" height="14" rx="3" style="fill:var(--ill-4)" stroke="${color}" stroke-width="1"/>
    <rect x="38" y="61" width="44" height="8" rx="2" style="fill:var(--ill-6)" stroke="${color}" stroke-width=".5"/>
    <!-- форсунка -->
    <rect x="82" y="63" width="8" height="4" rx="2" fill="${color}" opacity=".8"/>
    <!-- кирпичики выходят -->
    <rect x="91" y="64" width="6" height="4" rx="1" fill="${color}" opacity=".9">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="10,0" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".9" to="0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- мотор -->
    <circle cx="45" cy="65" r="5" style="fill:var(--ill-4)" stroke="${color}" stroke-width="1"/>
    <circle cx="45" cy="65" r="2" fill="${color}" opacity=".6">
      <animateTransform attributeName="transform" type="rotate" from="0,45,65" to="360,45,65" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <!-- крыша -->
    <rect x="50" y="40" width="8" height="20" rx="2" style="fill:var(--ill-4)" stroke="${color}" stroke-width="1"/>
  </svg>`;
}

function svgSushka(color){
  return `<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <polygon points="20,60 60,40 100,60 100,90 60,110 20,90" style="fill:var(--ill-2)" stroke="${color}" stroke-width="1.5"/>
    <polygon points="20,60 60,40 60,70 20,90" style="fill:var(--ill-1)" stroke="${color}" stroke-width="1"/>
    <polygon points="60,40 100,60 100,90 60,70" style="fill:var(--ill-3)" stroke="${color}" stroke-width="1"/>
    <polygon points="20,60 60,40 100,60 60,80" fill="${color}" opacity=".1"/>
    <!-- туннель сушилки -->
    <rect x="25" y="62" width="70" height="20" rx="4" style="fill:var(--ill-hole)" stroke="${color}" stroke-width="1"/>
    <ellipse cx="25" cy="72" rx="6" ry="10" style="fill:var(--ill-hole)" stroke="${color}" stroke-width="1"/>
    <ellipse cx="95" cy="72" rx="6" ry="10" style="fill:var(--ill-hole)" stroke="${color}" stroke-width="1"/>
    <!-- вагонетки -->
    <rect x="30" y="70" width="12" height="8" rx="2" style="fill:var(--ill-5)" stroke="${color}" stroke-width=".8">

const ZONE_SVGS = {
  'Массаподготовка': svgMassa,
  'Формовка': svgFormovka,
  'Сушка / Углесушка': svgSushka,
  'Обжиг': svgObzhig,
  'Упаковка': svgUpakovka,
};

const ZONES_ORDER = ['Массаподготовка','Формовка','Сушка / Углесушка','Обжиг','Упаковка'];

// норма — серая: зелёная цепочка из пяти цехов отвлекает от единственного красного
// Цвета берём из темы, а не задаём числами: в светлой теме #94a3b8
// на белом даёт контраст 2,26 — «норма» и проценты зон было почти не
// видно. Переменные --danger/--warn/--text-dim в светлой теме уже
// затемнены до читаемых значений.
function getColor(cls){
  return cls === 'danger' ? 'var(--danger)'
       : cls === 'warn'   ? 'var(--warn)'
       : 'var(--text-dim)';
}

function renderProdMap(equipment, liveData){
  const byZone={};
  for(const e of equipment){
    const z=e.location||e.stage||'Другое';
    if(!byZone[z])byZone[z]={total:0,ok:0,warn:0,err:0};
    byZone[z].total++;
    if(e.status==='Работает')byZone[z].ok++;
    else if(e.status==='Внимание')byZone[z].warn++;
    else byZone[z].err++;
  }

  const flow=document.getElementById('prodFlow');
  const parts=[];
  let prevColor=null;

  ZONES_ORDER.forEach((zone,i)=>{
    const s=byZone[zone]||{total:0,ok:0,warn:0,err:0};
    let pct=s.total?Math.round(s.ok/s.total*100):100;
    const svgFn=ZONE_SVGS[zone];

    // Живая загрузка с панели важнее доли исправного оборудования:
    // если она есть и достоверна (0–100), по ней и показываем.
    // Какой регистр показывает загрузку этой зоны, решает справочник:
    // берём живой регистр загрузки, привязанный к станку этого цеха.
    // Имя регистра здесь больше не зашито — после привязки инженером
    // зона подхватит свой датчик сама.
    let liveLabel='';
    const zoneReg=ACAISensors.all().find(x =>
      x.state==='live' && x.register.includes('загрузка_проц') &&
      x.zone===zone && liveData[x.register]);
    if(zoneReg){
      const v=parseFloat(liveData[zoneReg.register].value);
      if(isFinite(v)&&v>=0&&v<=100){ pct=Math.round(v); liveLabel=ACAISensors.short(zoneReg.register); }
    }

    // Цвет — по показанному проценту, а не по тому, есть ли где-то
    // «Внимание». Раньше 46% горели жёлтым, потому что в зоне не было
    // ошибок. Для производства ниже 50% — это уже авария.
    //   < 50  красный
    //   < 80  жёлтый
    //   >= 80 зелёный
    let cls=pct<50?'danger':pct<80?'warn':'ok';
    // Оборудование с ошибкой всё равно делает зону красной, даже если
    // процент ещё высокий — иначе поломку не заметят.
    if(s.err>0) cls='danger';
    const color=getColor(cls);

    const liveVal=`${liveLabel?`<span style="font-size:10px;color:var(--text-dim)">${liveLabel}</span>`:''}
      <span class="zone-pct" style="color:${color}">${pct}%</span>`;

    if(i>0) parts.push(`<div class="prod-arrow">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <defs><linearGradient id="ag${i}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${prevColor||color}"/>
          <stop offset="100%" stop-color="${color}"/>
        </linearGradient></defs>
        <path d="M4,12 H18 M14,8 L18,12 L14,16" stroke="url(#ag${i})" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>`);

    prevColor=color;
    parts.push(`<div class="prod-zone ${cls}" onclick="window.location='/equipment?zone='+encodeURIComponent('${zone}')" title="Открыть оборудование участка «${zone}»">
      <div class="zone-pulse ${cls}"></div>
      <div class="zone-3d">${svgFn?svgFn(color):''}</div>
      <div class="zone-name">${zone}</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:100%">
        ${liveVal}
        <div class="zone-bar" style="width:80%">
          <div class="zone-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <div class="zone-status" style="color:${color}">
          ${s.err>0?`<span data-icon=alert></span> ${s.err} ошибок`:cls==='danger'?'<span data-icon=alert></span> Низкая загрузка':s.warn>0?`! ${s.warn} внимание`:cls==='warn'?'! Ниже нормы':s.total>0?'норма':''}
        </div>
        <div style="font-size:10px;color:var(--text-dim)">${s.total} ед.</div>
      </div>
    </div>`);
  });

  flow.innerHTML=parts.join('');
  document.getElementById('mapTime').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}

// ── СЕНСОРЫ ───────────────────────────────────────────────
let _live={};
let _health=null;
async function fetchLive(){
  // Имена регистров — из справочника. Ждём его до отрисовки: иначе
  // в первую секунду подписи будут системными именами.
  try{ await ACAISensors.load(); }catch{}
  // И сразу — идёт ли сбор. Без этого строка показаний врала: она
  // рисовала последние известные значения и ставила рядом текущее
  // время, то есть выдавала старые цифры за живые.
  try{ _health=await ACAISensors.health(); }catch{ _health=null; }
  try{_live=await ACAI.get('/api/sensors/live');}catch{}
  renderSensors(_live);
}
function renderSensors(lv){
  // Сбор стоит — показаний не показываем вовсе. Лучше честная строка
  // «нет данных с 14:32», чем цифры, которые давно не менялись.
  if(_health && !_health.ok && _health.state!=='never'){
    document.getElementById('sensorStripBody').innerHTML =
      ACAISensors.silenceNote(_health, 'margin:0');
    return;
  }
  if(!Object.keys(lv).length)return;
  // Загрузки, авария и частоты приводов. Частоты раньше собирались,
  // но на экран не выводились — их просто не было в этом списке.
  // Верхняя строка: сколько массы в бункерах и с какой частотой её
  // подают. Проценты загрузки питателей убраны — панель отдаёт их
  // только по одному питателю, и рядом с частотами они путали.
  // KP-10 убран с главной по просьбе владельца: его датчик даёт
  // значения вне 0-100% (видели и -189%, и +105%), и место на первой
  // строке он занимал зря. В «Отчётах» и «Аналитике» показание
  // осталось — там оно с пометкой о недостоверности.
  // Список и имена — из справочника регистров, а не отсюда. Раньше
  // тут стояли три зашитых массива и словарь подписей: новый регистр
  // с панели не появлялся на странице, пока его не впишет программист,
  // а имена расходились с «Аналитикой» и «Отчётами».
  //
  // Группы по смыслу оставляем, но собираем их по имени регистра:
  // загрузка в процентах — бункеры, частота питателя — питатели,
  // частота конвейера — ленты. Новый конвейер встанет в свой ряд сам.
  // Отбор сохраняет два решения владельца, принятые раньше: KP-10 с
  // «Главной» убран (его датчик даёт значения вне 0-100%), проценты
  // загрузки питателей тоже — панель отдаёт их только по одному, и
  // рядом с частотами они путали. Поэтому бункеры — именно PL024, а
  // не «всё, что в процентах».
  // Решение владельца 02.10.2026: на «Главной» остаются только бункеры
  // (PL024-1/2) и два питателя — песок и глина. Конвейеры и сигнал
  // панели переехали в развёрнутую 3D-карту: на сводке они занимали
  // вторую строку, а решения по ним не принимают.
  const known = Object.keys(lv || {});
  const BUNKERS = known.filter(k => k.startsWith('pl024') && k.endsWith('загрузка_проц'));
  const FEEDERS = known.filter(k => k.startsWith('питатель_') && k.endsWith('_гц'));
  const LABELS  = Object.fromEntries(known.map(k => [k, ACAISensors.short(k)]));
  const item=k=>{
    const v=parseFloat(lv[k].value);
    const a=k==='авария_флаг';
    const hz=k.endsWith('_гц');

    // Загрузка вне 0-100% физически невозможна — так ведёт себя
    // сбитый датчик (KP-10 шлёт и -189%, и +105%). Подменять такое
    // нулём нельзя: сводка начнёт тихо врать, а датчик никто не
    // починит. Показываем значение и помечаем как недостоверное.
    const pctKey = k.includes('проц') && !a;
    const bogus = pctKey && (!isFinite(v) || v < 0 || v > 100);

    // Частота — не процент: нулевая означает, что привод стоит,
    // и красить её как «низкую загрузку» неверно.
    // Красным этот сигнал не красим. Регистр 1658 поднят 785 раз из
    // 2807 за сутки — для аварии слишком часто, и что он значит на
    // самом деле, пока не подтверждено. Красное требует действия, а
    // действовать не на что.
    const c = bogus ? 'var(--text-dim)'
            : a  ? 'var(--text)'
            : hz ? (v>0?'var(--text)':'var(--text-dim)')
            : v<50?'var(--danger)':v<80?'var(--warn)':'var(--text)';

    // Единицу берём из справочника одним общим правилом — тем же, что
    // на «Аналитике» и в «Отчётах». Раньше каждая страница угадывала
    // по имени регистра, и подписи расходились.
    const shown = ACAISensors.value(k, lv[k].value);
    const p = shown.percent != null ? shown.percent : 0;
    const text = (hz && v === 0) ? 'стоит'
               : shown.bogus ? shown.text + ' <span data-icon=alert></span>'
               : shown.text;

    return `<div class="ss-item"${bogus?' title="Значение вне диапазона 0-100% — датчик неисправен или откалиброван неверно"':(a?' title="Регистр 1658 панели WebHMI. Что он означает — не подтверждено: за сутки поднят 785 раз из 2807, для аварии это слишком часто. Уточняется у главного инженера. Ни на какие расчёты и на «Аварии» в меню не влияет."':'')}>
      ${p?`<div class="ss-bar"><div class="ss-fill" style="width:${p}%;background:${c}"></div></div>`:''}
      <span class="ss-label">${LABELS[k]}</span>
      <span class="ss-val" style="color:${c}">${text}</span>
      ${ACAISensors.staleNote(k)?`<span class="ss-stale">${ACAISensors.staleNote(k)}</span>`:''}
    </div>`;
  };

  const line = keys => keys.filter(k => lv[k]).map(item).join('<div class="ss-sep"></div>');

  const top = [line(BUNKERS), line(FEEDERS)]
    .filter(Boolean).join('<div class="ss-sep"></div>');

  // Время СНЯТИЯ данных, а не текущее: если сбор отстал на минуту,
  // человек должен видеть минуту, а не «сейчас».
  const takenAt = _health && _health.last_data_at ? new Date(_health.last_data_at) : new Date();
  const now=takenAt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  document.getElementById('sensorStripBody').innerHTML=
    `<div class="ss-row">
       <span class="ss-group">Бункеры и питатели</span>
       <div class="ss-sep"></div>${top}
       <span style="margin-left:auto;font-size:10px;color:var(--text-dim);font-family:var(--mono)">${now}</span>
     </div>`;
}

// ── 3D-КАРТА МАССАПОДГОТОВКИ ──────────────────────────────
// Свёрнуто — карточка с цифрами, развёрнуто — страница /massaprep/3d
// на весь экран. Адрес ставится в iframe по нажатию и снимается при
// закрытии: пока карту не открыли, Three.js не грузится вовсе, а
// после закрытия сцена не держит видеокарту.
function openMassaMap(){
  const overlay=document.getElementById('massaOverlay');
  const frame=document.getElementById('massaFrame');
  const theme=(window.acaiTheme&&window.acaiTheme.get())||'dark';
  frame.src='/massaprep/3d?theme='+theme;
  overlay.classList.remove('hidden');
  document.body.style.overflow='hidden';
}

function closeMassaMap(){
  const overlay=document.getElementById('massaOverlay');
  overlay.classList.add('hidden');
  document.getElementById('massaFrame').removeAttribute('src');
  document.body.style.overflow='';
}

function massaMapOpen(){
  return !document.getElementById('massaOverlay').classList.contains('hidden');
}

// Esc закрывает и когда фокус на «Главной», и когда он уже внутри
// карты: там нажатие не доходит до нас, поэтому сцена присылает
// сообщение (см. frontend/templates/massaprep_map.html).
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&massaMapOpen())closeMassaMap();
});
window.addEventListener('message',e=>{
  if(e.origin===location.origin&&e.data==='acai-massaprep-close'&&massaMapOpen())closeMassaMap();
});
// Тему переключили при открытой карте — перерисовываем сцену в ней же.
document.addEventListener('acai-theme',()=>{
  if(massaMapOpen())openMassaMap();
});

// ── ДАШБОРД ───────────────────────────────────────────────
async function renderDashboard(){
  let d;try{d=await ACAI.get('/dashboard');}catch{return;}
  const eq=d.equipment||[];
  const w=eq.filter(e=>e.status==='Работает').length;
  const wa=eq.filter(e=>e.status==='Внимание').length;
  const er=eq.filter(e=>e.status==='Ошибка').length;
  const escalated=(d.open_problem_cases||[]).filter(c=>c.status==='Требует специалиста').length;
  const activeDt=d.active_downtimes_count||0;
  // Цвет — только отклонение: ошибки/внимание, ждут специалиста, идёт простой.
  // «Работает» и «Закрыто» — всегда серые, это норма.
  const probCls=er>0?'danger':wa>0?'warn':'';
  const casesCls=escalated>0?'danger':'';
  const dtCls=activeDt>0?'warn':'';
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Работает</div><div class="metric-value">${w}</div><div class="metric-sub">из ${eq.length} ед.</div></div>
    <div class="metric ${probCls}"><div class="metric-label">Проблемы</div><div class="metric-value ${probCls}">${er+wa}</div><div class="metric-sub">${er} ошибок · ${wa} внимание</div></div>
    <div class="metric ${casesCls}"><div class="metric-label">Обращений</div><div class="metric-value ${casesCls}">${d.open_cases||0}</div><div class="metric-sub">${escalated?`${escalated} ждут специалиста`:`всего ${d.total_cases||0}`}</div></div>

  renderVerdict(d, w, eq.length);

  document.getElementById('openCount').textContent=open.length;
  document.getElementById('caseList').innerHTML=open.length
    ?open.slice(0,4).map(c=>{const cls=c.status==='Требует специалиста'?'esc':c.status==='Черновик закрытия'?'draft':'open';const color=cls==='esc'?'var(--danger)':cls==='draft'?'var(--warn)':'var(--text-dim)';const badge=cls==='esc'?'Ждём специалиста':cls==='draft'?'Подтвердить закрытие':'ИИ ведёт рабочего';return`<div class="case-row ${cls}" onclick="window.location='/chat?case=${c.id}'"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:12px;font-weight:600">${c.equipment_name||c.machine||'—'}</span><span style="font-size:10px;font-weight:700;color:${color}">${badge}</span></div><div style="font-size:11px;color:var(--text-dim)">${c.symptom||c.worker_question||'—'}</div><div style="font-size:10px;color:var(--text-dim);margin-top:2px">${ACAI.timeAgo(c.created_at)}</div></div>`;}).join('')
    :'<div class="empty">Открытых обращений нет</div>';
  const probs=d.top_problems||[];const maxC=probs[0]?.count||1;
  document.getElementById('problemList').innerHTML=probs.length
    ?probs.slice(0,5).map((p,i)=>`<div class="prob-row"><span style="font-size:11px;color:var(--text-dim);width:16px;text-align:right;flex-shrink:0">${i+1}</span><span style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.symptom||'—'}</span><div style="width:70px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0"><div style="width:${Math.round(p.count/maxC*100)}%;height:100%;background:var(--accent);border-radius:2px"></div></div><span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;width:20px;text-align:right">${p.count}</span></div>`).join('')
    :'<div class="empty">Нет данных</div>';

  // ── простои (перенесено со старой страницы /production) ──
  const dts=d.active_downtimes||[];
  const totalMin=d.total_downtime_today_minutes||0;
  document.getElementById('downtimeTotal').textContent=
    totalMin>=60?`${Math.floor(totalMin/60)}ч ${totalMin%60}м`:`${totalMin}м`;
  document.getElementById('downtimeList').innerHTML=dts.length
    ?dts.map(dt=>`<div style="padding:8px 10px;border-radius:8px;margin-bottom:5px;background:var(--surface-2)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
          <span style="font-size:12px;font-weight:600">${dt.equipment_name||dt.machine||'—'}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--warn)">${dt.duration_minutes??0} мин</span>
        </div>
        <div style="font-size:11px;color:var(--text-dim)">${dt.reason||'Причина не указана'}</div>
      </div>`).join('')
    // без ✓: пусто может значить и «не было», и «не фиксировали» — обращений сегодня нет
    :'<div class="empty">Сегодня простоев не фиксировали</div>';
}

// ── ОТВЕТ: ВСЁ ЛИ В ПОРЯДКЕ ───────────────────────────────
// Лесенка: сводка («требует решения: 3») → список (колокольчик) →
// запись (обращение, станок). На каждом шаге понятно, куда идёшь.
async function renderVerdict(d, working, total){
  const box=document.getElementById('verdict');
  if(!box) return;
  let items=[];
  try{ items=(await ACAI.get('/api/notifications')).notifications||[]; }catch{ return; }
  const urgent=items.filter(x=>x.severity==='critical'||x.severity==='warning');
  const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if(!urgent.length){
    box.className='verdict calm';
    const open=d.open_cases||0;
    // «Завод работает» — вывод по тому, что система знает: по
    // уведомлениям и статусам станков. Сами станки о себе не
    // сообщают, статус ставит человек, поэтому в подписи названо,
    // откуда вывод, — иначе это обещание, которого мы не давали.
    box.innerHTML=`<div class="v-title">Ничего не требует решения</div>
      <div class="v-sub">По уведомлениям и статусам оборудования · ${working} из ${total} единиц в работе${open?` · обращений в работе: ${open}`:''}</div>`;
    return;
  }

  const critical=urgent.some(x=>x.severity==='critical');
  box.className='verdict alert'+(critical?'':' only-warn');
  const n=urgent.length;
  const word=(n%10===1&&n%100!==11)?'вопрос':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'вопроса':'вопросов';
  // Ссылку ставим только туда, куда этой роли открыт вход: аналитик
  // видит простой и эскалацию, но /chat и /equipment ему закрыты —
  // такая строка вела прямо на «нет доступа».
  const rows=urgent.slice(0,3).map(x=>{
    const link=bellLink(x);
    const inner=`
      <span class="v-mark" style="background:${x.severity==='critical'?'var(--danger)':'var(--warn)'}"></span>
      <span style="min-width:0">
        <div class="v-what">${esc(x.title)}</div>
        <div class="v-where">${esc(x.subtitle||x.message||'')}</div>
      </span>`;
    return link
      ? `<a class="v-row" href="${esc(link)}">${inner}<span class="v-go">›</span></a>`
      : `<div class="v-row">${inner}</div>`;
  }).join('');
  box.innerHTML=`
    <div class="v-head">
      <span class="v-title">Требует решения: ${n} ${word}</span>
      ${n>3?`<button class="v-all" onclick="document.getElementById('bellBtn')?.click()">Все ${n} →</button>`:''}
    </div>
    ${rows}`;
}

// ── КАЛЕНДАРЬ ─────────────────────────────────────────────
let calDate=new Date();let allTasks=[];let calOpen=false;
let selectedDate=new Date();

async function loadTasks(){
  try{const r=await ACAI.get('/api/tasks');allTasks=r.tasks||[];}catch{}
  renderWeek();
}

function dayKey(d){return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;}

function renderWeek(){
  const today=new Date();const days=[];
  // центрируем вокруг выбранной даты — показываем 3 дня до и 3 после
  for(let i=-3;i<=3;i++){const d=new Date(selectedDate);d.setDate(selectedDate.getDate()+i);days.push(d);}
  const DN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  document.getElementById('weekStrip').innerHTML=days.map((d)=>{
    const isToday=dayKey(d)===dayKey(today);
    const isSel=dayKey(d)===dayKey(selectedDate);
    const ht=allTasks.some(t=>{if(!t.due_at)return false;return dayKey(new Date(t.due_at))===dayKey(d);});
    const ts=d.getTime();
    let style='';
    if(isSel) style='background:var(--accent-solid);border-color:var(--accent-solid);color:#fff';
    // Сегодня и выбранный день различаются ФОРМОЙ, а не только цветом:
    // выбранный — залит, сегодня — обведён рамкой и подписан. Раньше
    // сегодня помечалось белой точкой, которая на светлой теме была
    // белым по белому, то есть никак.
    return`<div class="week-day ${isToday?'today':''} ${ht&&!isSel?'has-task':''}"
      style="${style}"
      onclick="selectDate(new Date(${ts}))">
      <div class="wd-name" style="${isSel?'color:rgba(255,255,255,.7)':''}">${DN[d.getDay()]}</div>
      <div class="wd-num">${d.getDate()}</div>
      ${isToday?`<div class="wd-today" style="${isSel?'color:rgba(255,255,255,.85)':''}">сегодня</div>`:''}
    </div>`;
  }).join('');
  renderDayEvents();
}

function selectDate(d){
  selectedDate=d;
  if(calOpen){renderFullCal();}else{renderWeek();}
  renderDayEvents();
}

function taskDueColor(t){
  if(!t.due_at) return 'var(--text-dim)';
  if(t.status==='done') return 'var(--ok)';
  const diff=new Date(t.due_at).getTime()-Date.now();
  if(diff<0) return 'var(--danger)';           // просрочено
  if(diff<86400000) return 'var(--warn)';       // сегодня/завтра
  if(diff<86400000*3) return '#f59e0b';         // скоро
  return 'var(--ok)';                           // есть время
}

function renderDayEvents(){
  const d=selectedDate;
  const isToday=dayKey(d)===dayKey(new Date());
  const dt=allTasks.filter(t=>{
    if(!t.due_at) return isToday; // без даты показываем сегодня
    return dayKey(new Date(t.due_at))===dayKey(d);
  });
  const P={'high':'var(--danger)','medium':'var(--warn)','low':'var(--ok)'};
  const dateStr=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  // Кнопка была высотой 12 px — на телефоне по ней не попасть.
  // Отступы дают площадь под палец, вид почти не меняется.
  const addBtn=`<button onclick="openAddTask()" style="font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;padding:11px 8px;margin-left:auto;min-height:44px">+ Задача</button>`;
  const header=`<div style="display:flex;align-items:center;margin-bottom:6px"><span style="font-size:11px;color:var(--text-dim)">${dateStr}</span>${addBtn}</div>`;

  const eventsEl=calOpen?document.getElementById('calDayEvents'):document.getElementById('weekEvents');
  if(!eventsEl)return;
  eventsEl.innerHTML=header+(dt.length
    ?dt.map(t=>{
        const color=taskDueColor(t);
        const diff=t.due_at?new Date(t.due_at).getTime()-Date.now():null;
        const label=t.status==='done'?'Выполнена':diff===null?'':diff<0?'Просрочено':diff<86400000?'Сегодня':'';
        return`<div class="dev-item" style="border-left:3px solid ${color}">
          <div class="dev-dot" style="background:${color}"></div>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${t.title}</span>
          ${label?`<span style="font-size:10px;color:${color};font-weight:600;flex-shrink:0">${label}</span>`:''}
        </div>`;
      }).join('')
    :'<div style="font-size:12px;color:var(--text-dim);text-align:center;padding:6px">Задач нет</div>');
}

async function submitTask(){
  const title=document.getElementById('qt-title')?.value.trim();
  if(!title){document.getElementById('qt-err').textContent='Введите название';return;}
  const vis=document.getElementById('qt-vis')?.value;
  const role=vis==='role'?document.getElementById('qt-role')?.value:null;
  try{
    await ACAI.post('/api/tasks',{
      title,
      description:document.getElementById('qt-desc')?.value.trim()||null,
      priority:document.getElementById('qt-prio')?.value||'medium',
      task_type:document.getElementById('qt-type')?.value||'other',
      due_at:document.getElementById('qt-due')?.value||null,
      visibility:vis==='assignees'?'assignees':vis==='role'?'role':'everyone',
      visibility_role:role,
    });
    ACAI.toast('Задача создана','ok');
    ACAI.closeModal();
    await loadTasks();
  }catch(e){document.getElementById('qt-err').textContent=e.message;}
}

function toggleCal(){
  calOpen=!calOpen;
  document.getElementById('weekView').style.display=calOpen?'none':'block';
  document.getElementById('fullCal').style.display=calOpen?'block':'none';
  document.getElementById('calToggleText').textContent=calOpen?'Свернуть':'Развернуть';
  if(calOpen)renderFullCal();else renderWeek();
}
function renderFullCal(){
  const year=calDate.getFullYear();const month=calDate.getMonth();const today=new Date();
  document.getElementById('calMonth').textContent=new Date(year,month,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const fd=new Date(year,month,1).getDay();const dim=new Date(year,month+1,0).getDate();const off=fd===0?6:fd-1;
  const td=new Set();allTasks.forEach(t=>{if(!t.due_at)return;const d=new Date(t.due_at);if(d.getFullYear()===year&&d.getMonth()===month)td.add(d.getDate());});
  const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let h=DN.map(d=>`<div class="cal-dn">${d}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++){
    const it=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const isSel=d===selectedDate.getDate()&&month===selectedDate.getMonth()&&year===selectedDate.getFullYear();
    const ht=td.has(d);
    const ts=new Date(year,month,d).getTime();
    h+=`<div class="cal-d ${it?'today':''} ${ht?'has-task':''}" style="${isSel&&!it?'background:rgba(59,130,246,.2);':''}" onclick="selectDate(new Date(${ts}))">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML=h;
  renderDayEvents();
}

function prevMonth(){calDate.setMonth(calDate.getMonth()-1);renderFullCal();}
function nextMonth(){calDate.setMonth(calDate.getMonth()+1);renderFullCal();}

// вообще открывает помощника. Период уходит на сервер явно, а не
// угадывается по тексту.
const AI_PERIODS = [
  ['Простои за сегодня', 'today'],
  ['за неделю', 'week'],
  ['за месяц', 'month'],
];

function aiGreet(){
  aiAdd('assistant',
    'Отвечаю по данным системы: оборудование, обращения, простои, задачи. ' +
    'Спросите своими словами.');
  const body = document.getElementById('aiBody');

  const periods = document.createElement('div');
  periods.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:10px';
  periods.innerHTML = AI_PERIODS.map(([label, period]) =>
    `<button class="btn primary sm" style="font-size:11px"
       onclick="askLosses('${period}','${label}')">${label}</button>`
  ).join('');
  body.appendChild(periods);

  const hints = document.createElement('div');
  hints.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:8px';
  hints.innerHTML = AI_HINTS.map(h =>
    `<button class="btn secondary sm" style="font-size:11px"
       onclick="document.getElementById('aiInput').value='${h}';askAi()">${h}</button>`
  ).join('');
  body.appendChild(hints);
}

// Вопрос про простои за период: период передаём явно.
async function askLosses(period, label){
  aiAdd('user', label);
  const waiting = aiAdd('assistant', 'Считаю простои…');
  document.getElementById('aiSend').disabled = true;
  try{
    const r = await ACAI.post('/management-ai', {
      message: `Простои и потери ${label.toLowerCase()}: сколько часов и сколько денег, по участкам.`,
      period,
    });
    waiting.querySelector('div').textContent = r.answer || 'Не удалось получить ответ.';
  }catch(e){
    waiting.querySelector('div').textContent =
      'Не удалось получить ответ: ' + (e.message || 'ошибка связи');
  }finally{
    document.getElementById('aiSend').disabled = false;
    document.getElementById('aiBody').scrollTop = 9e9;
  }
}

function aiAdd(who, text){
  const body = document.getElementById('aiBody');
  const row = document.createElement('div');
  row.style.cssText = 'margin-bottom:12px';
  row.innerHTML = who === 'user'
    ? `<div style="text-align:right"><span style="display:inline-block;
         background:var(--accent-solid);color:#fff;padding:8px 12px;border-radius:12px;
         max-width:85%;text-align:left">${text}</span></div>`
    : `<div style="white-space:pre-wrap">${text}</div>`;
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  return row;
}

async function askAi(){
  const input = document.getElementById('aiInput');
  const question = input.value.trim();
  if (!question) return;

  input.value = '';
  aiAdd('user', question);

  const waiting = aiAdd('assistant', 'Смотрю данные...');
  document.getElementById('aiSend').disabled = true;

  try{
    const r = await ACAI.post('/management-ai', { message: question });
    waiting.querySelector('div').textContent =
      r.answer || 'Не удалось получить ответ.';
  }catch(e){
    waiting.querySelector('div').textContent =
      'Не удалось получить ответ: ' + (e.message || 'ошибка связи');
  }finally{
    document.getElementById('aiSend').disabled = false;
    document.getElementById('aiBody').scrollTop = 9e9;
  }
}

// Показываем только тем, кому эндпоинт и так доступен: рабочему этот
// помощник не нужен и права на него у него нет.
(function(){
  const allowed = ['admin','director','chief_engineer','engineer',
                   'shift_supervisor','analyst','chief_mechanic','chief_electrician'];
  const check = setInterval(() => {
    const role = document.body.dataset.role;
    if (!role) return;
    clearInterval(check);
    if (allowed.includes(role)) {
      document.getElementById('aiFab').style.display = 'block';
      document.getElementById('aiFab').onclick = () => toggleAi(true);
    }
  }, 200);
})();
</script>


<script>
// Состояние сбора показаний.
// Данные идут через расширение в браузере: закрыл вкладку с панелью,
// уснул мак — сбор молча встал, и никто не узнает. Директор посмотрит
// на вчерашние цифры и решит, что система врёт. Показываем правду.
(async function(){
  const BOX_ID = 'sensorState';

  async function check(){
    let box = document.getElementById(BOX_ID);

    let last = null;
    try{
      const r = await ACAI.get('/api/sensors/latest');
      const items = r.readings || r || [];
      for (const item of (Array.isArray(items) ? items : Object.values(items))) {
        const at = item.recorded_at || item.updated_at;
        if (at && (!last || at > last)) last = at;
      }
    }catch{ return; }

    if (!last) return;

    const minutes = Math.round((Date.now() - new Date(last.replace(' ', 'T')).getTime()) / 60000);
    // Показания идут раз в минуту. Полчаса тишины — сбор встал.
    const stale = minutes > 30;

    if (!box) {
      box = document.createElement('div');
      box.id = BOX_ID;
      box.style.cssText = 'padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:12px';
      const page = document.querySelector('.page');
      const verdict = document.getElementById('verdict');
      if (page) page.insertBefore(box, verdict ? verdict.nextSibling : page.firstChild);
      else return;
    }

    box.style.display = stale ? 'block' : 'none';
    if (!stale) return;

    const hours = Math.floor(minutes / 60);
    const when = hours ? `${hours} ч ${minutes % 60} мин назад` : `${minutes} мин назад`;

    box.style.background = 'rgba(245,158,11,.1)';
    box.style.border = '1px solid rgba(245,158,11,.35)';
    box.style.color = 'var(--warn)';
    box.innerHTML = `<span data-icon=alert></span> Показатели оборудования не обновляются: последние данные ${when}.
      <span style="color:var(--text-dim)">Проверьте, открыта ли вкладка WebHMI в браузере на сервере.</span>`;
  }

  await check();
  setInterval(check, 60000);
})();
</script>
