<!DOCTYPE html>
<html lang="ru">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цех в 3D — ACAI</title>

<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/acai.css?v=65">

<script>
  /* Развёрнуто с «Главной» (?embed=1) — убираем меню и шапку: окно
     подписано снаружи, а место лучше отдать цеху. Тема приходит
     параметром от «Главной», как у карты линии. */
  (function () {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
    var theme = q && q.get('theme');
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    }
    if (q && q.get('embed') === '1') document.documentElement.classList.add('acai-embed');
  })();
</script>
<style>
/* Режим «в окне»: без меню и шапки, сцена во весь экран. */
.acai-embed .sidebar, .acai-embed .topbar, .acai-embed .mobile-nav { display:none !important; }
.acai-embed .main-content { margin:0 !important; padding:0 !important; }
.acai-embed .page.plant-page { padding:0 !important; }
.acai-embed .plant { border-radius:0; border:0; }

/* «Цех в 3D». Цвета — из темы сайта (acai.css), своё только для
   подсветки узла и маршрутов электрика/слесаря. */
.plant{--fg:var(--text);--muted:var(--text-dim);--line:var(--border);--on-accent:#fff;--hl:#e8590c;--el:#b7791f;--sl:#2f6fb5;
  position:relative;width:100%;height:640px;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--border);color:var(--text);}
.plant button{font:inherit;color:inherit;cursor:pointer;}
.plant :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.page.plant-page{padding:10px 12px;}
#scene{position:absolute;inset:0;display:block;touch-action:none;}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;white-space:nowrap;border:0;background:var(--surface);color:var(--fg);border-radius:8px;
  padding:4px 8px 4px 6px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgb(0 0 0 / .2);display:flex;align-items:center;gap:6px;}
.lbl::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--surface);border-bottom:0;}
.lbl .n{min-width:20px;height:20px;border-radius:10px;display:none;place-items:center;font-size:11px;padding:0 5px;font-variant-numeric:tabular-nums;}
.route-el .lbl.on-route .n{display:grid;background:var(--el);color:#14110a;}
.route-sl .lbl.on-route .n{display:grid;background:var(--sl);color:#0a1220;}
.lbl.sel{background:var(--accent);color:var(--on-accent);}
.lbl.sel::after{border-top-color:var(--accent);}
.route-el .lbl:not(.on-route), .route-sl .lbl:not(.on-route){opacity:.45;}
.plbl{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid rgb(255 255 255 / .25);background:rgb(12 20 32 / .82);color:#fff;border-radius:6px;padding:2px 7px;
  font-size:11.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.plbl::before{content:"";width:6px;height:6px;border-radius:50%;background:#7fb2ff;}
.plbl.hot{background:var(--hl);border-color:var(--hl);z-index:4;}
.plbl.hot::before{background:currentColor;}
.zlbl{position:absolute;left:0;top:0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgb(10 18 30 / .6);
  padding:3px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;}
.top{z-index:10;position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none;}
.seg{pointer-events:auto;display:flex;gap:3px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow);}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 11px;font-weight:600;font-size:13px;color:var(--muted);}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);}
.seg button[data-route="el"][aria-pressed="true"]{background:var(--el);color:#14110a;}
.seg button[data-route="sl"][aria-pressed="true"]{background:var(--sl);color:#0a1220;}
.views{pointer-events:auto;display:flex;gap:6px;}
/* Показания с панели — тонкой строкой над подсказкой, чтобы не
   спорить ни с подписями станков, ни с карточкой справа. */
.live{position:absolute;left:12px;bottom:46px;z-index:2;display:flex;flex-wrap:wrap;gap:4px 14px;
  max-width:min(620px,70%);padding:7px 12px;border-radius:10px;background:var(--surface);
  border:1px solid var(--border);box-shadow:0 2px 10px rgb(0 0 0 / .18);font-size:12px;color:var(--text-dim);}
.live[hidden]{display:none;}
.live b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
.live .warnText{color:var(--warn);}
@media (max-width:768px){ .live{display:none;} }
.iconbtn{border:0;background:var(--surface);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;font-weight:600;}
.panel{z-index:10;position:absolute;top:12px;right:12px;bottom:12px;width:min(390px,42vw);background:var(--surface);
  border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;}
.panel-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);}
.panel-b{padding:12px 16px 16px;overflow-y:auto;flex:1;min-height:0;}
.crumb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.panel h2{margin:4px 0 0;font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance;}
.panel h2 .code{font-family:var(--mono);font-size:14px;color:var(--accent);margin-left:6px;font-weight:600;}
.panel h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;gap:6px;}
.panel p{margin:0;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
.checks{display:grid;gap:4px;}
.ck{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;font-size:13.5px;padding:7px 9px;border-radius:8px;background:var(--surface-2);border:1px solid transparent;}
.ck .mk{color:var(--ok);font-weight:700;}
.ck .go{margin-left:auto;font-size:11.5px;color:var(--accent);font-weight:600;white-space:nowrap;padding-left:6px;}
.ck[aria-pressed="true"]{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 12%,var(--surface));}
.ck[aria-pressed="true"] .go{color:var(--hl);}
.ck:disabled{cursor:default;color:var(--fg);}
.parts{display:flex;flex-wrap:wrap;gap:6px;}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:500;}
.pchip[aria-pressed="true"]{border-color:var(--hl);background:var(--hl);color:#fff;}
.pinfo{margin-top:8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--hl) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--hl) 40%,var(--line));font-size:13.5px;}
.pinfo b{display:block;margin-bottom:2px;}
.none{color:var(--muted);font-size:13px;}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:10px;}
.facts dt{color:var(--muted);} .facts dd{margin:0;}
.step{display:flex;align-items:center;gap:8px;margin-top:10px;}
.step .of{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1;text-align:center;}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn:disabled{opacity:.4;cursor:default;}
.list .zone{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:6px;}
.list button{display:flex;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;gap:8px;align-items:center;font-size:13.5px;}
.list button:hover{background:var(--surface-2);}
.list button .tags{margin-left:auto;display:flex;gap:4px;}
.tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;}
.tag.el{background:color-mix(in srgb,var(--el) 22%,transparent);color:var(--el);}
.tag.sl{background:color-mix(in srgb,var(--sl) 22%,transparent);color:var(--sl);}
.intro{font-size:13.5px;color:var(--muted);}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.hint{position:absolute;left:12px;bottom:12px;background:rgb(10 18 30 / .6);color:#fff;font-size:12px;border-radius:8px;padding:6px 10px;pointer-events:none;z-index:2;}
.close{float:right;border:0;background:var(--surface-2);border-radius:8px;width:30px;height:30px;font-size:16px;line-height:1;}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:20;}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600;z-index:0;}
@media (max-width:768px){
  .page.plant-page{padding:6px;}
  .panel{top:auto;left:8px;right:8px;width:auto;bottom:8px;max-height:46%;}
  .panel.min{max-height:66px;}
  .panel.min .panel-b{display:none;}
  .hint{display:none;}
  .top{left:8px;right:8px;top:8px;}
  .seg button{padding:6px 8px;}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Цех в 3D</div>
        <div class="topbar-sub">Где что стоит и что на станке проверять</div>
      </div>
      <div class="topbar-right"><span class="topbar-clock" id="topbarClock"></span></div>
    </header>
    <div class="page plant-page">
      <!-- Учебный макет для новичков: станки из чек-листов дежурных,
           узлы станков и маршрут обхода. Расположение сушилки, печи,
           упаковки, компрессорной и склада угля — примерное, по логике
           производства, а не по плану цеха. -->
      <div class="plant" id="plant">
        <div class="loading" id="loading">Строю цех…</div>
        <canvas id="scene" aria-label="3D-макет цеха"></canvas>
        <div class="labels" id="labels"></div>
        <div class="top">
          <div class="seg" role="group" aria-label="Маршрут обхода">
            <button data-route="" aria-pressed="true">Весь цех</button>
            <button data-route="el" aria-pressed="false">Обход электрика</button>
            <button data-route="sl" aria-pressed="false">Обход слесаря</button>
          </div>
          <div class="views">
            <button class="iconbtn" id="viewAll">⤢ Весь цех</button>
            <button class="iconbtn" id="motion">❚❚ Пауза</button>
          </div>
        </div>
        <aside class="panel" id="panel" aria-live="polite">
          <div class="panel-h" id="panelHead"></div>
          <div class="panel-b" id="panelBody"></div>
        </aside>
        <!-- Живых показаний у завода четыре: загрузка двух бункеров и
             частоты питателей глины и песка. Они же на «Главной» и на
             карте линии; остальные станки панель не присылает. -->
        <div class="live" id="live" hidden></div>
        <div class="hint">Крутить — зажать и тянуть · Приблизить — колесо или два пальца · Нажмите на станок, потом на его узел</div>
      </div>
    </div>
  </div>
</div>

<script src="/static/icons.js?v=7"></script>
<script src="/static/acai_layout.js?v=67"></script>
<script src="/static/mobile_nav_v2.js?v=7"></script>
<!-- Three.js лежит у нас: 3D открывается и без интернета, как весь сайт -->
<script src="/static/vendor/three-0.128.0.min.js"></script>
<script src="/static/vendor/three-0.128.0-OrbitControls.js"></script>
<script>

// ═══ Чек-листы дежурного электрика и слесаря ═══
// Не копия: приходят с сервера из тех же листов, что у «Обхода
// дежурного» (duty_round_service.TEMPLATES). Поменяли лист — 3D
// показывает новое, разъехаться им не из чего.
let EL = {}, SL = {}, ROUTE = {el:[], sl:[]};
function eqTitleOf(g){ return g.n + (g.c ? " " + g.c : "") + (g.s ? ` (${g.s})` : ""); }
function loadLists(T){
  for (const [kind, store] of [["el", EL], ["sl", SL]]){
    const tpl = T.templates[kind]; if (!tpl) continue;
    for (const g of tpl.groups){ store[eqTitleOf(g)] = g.it.slice(); ROUTE[kind].push(eqTitleOf(g)); }
  }
}

// ═══ Узлы станков: что это, словами для новичка ═══
const PART = {
  motor:{n:"Двигатель", t:"Электродвигатель — крутит станок. Синий рёбристый цилиндр, сзади кожух вентилятора. Проверяют нагрев (через перчатку или пирометром), гул и вибрацию."},
  gearbox:{n:"Редуктор", t:"Коробка с шестернями: снижает обороты двигателя и даёт усилие на вал. Проверяют шум, нагрев, течь масла."},
  belts:{n:"Ремни", t:"Клиноремённая передача от двигателя под жёлтым кожухом. Натяжение и износ ремней смотрят только на остановленном станке, кожух на ходу не снимать."},
  bearings:{n:"Подшипники", t:"Корпуса подшипников на концах валов. Проверяют нагрев, посторонний шум, смазку."},
  cabinet:{n:"Шкаф управления", t:"Серый шкаф: автоматы, частотники, кнопки. Дверь закрыта, нет запаха гари, горят нужные лампы."},
  limits:{n:"Концевики", t:"Концевые выключатели у конвейера — красные коробочки с рычагом. Останавливают ленту при сходе или аварии. Рычаг должен ходить свободно."},
  sensor:{n:"Датчик", t:"Датчик уровня или наличия материала: сообщает в систему, есть ли масса."},
  beater:{n:"Бильный вал", t:"Вал с билами над лентой питателя — разбивает комья, чтобы материал шёл ровно."},
  rollers:{n:"Вальцы", t:"Валки, между которыми раздавливается и перетирается масса. Смотрят износ поверхности и зазор."},
  knives:{n:"Ножи", t:"Ножи на малом валке дезинтегратора — режут массу. Смотрят износ и крепление."},
  scraper:{n:"Скребок", t:"Скребок счищает налипшую массу с валка или ленты."},
  blades:{n:"Лопатки", t:"Лопатки на валах смесителя — перемешивают массу. Смотрят износ и крепление."},
  belt:{n:"Лента", t:"Лента конвейера (у питателя — из стальных пластин). Смотрят порезы, сход, натяжение."},
  drums:{n:"Барабаны", t:"Приводной и натяжной барабаны на концах конвейера. Смотрят налипание и подшипники."},
  hopper:{n:"Бункер-воронка", t:"Приёмная воронка: сюда сыплется материал."},
  water:{n:"Вода", t:"Синяя труба подачи воды с манометром и расходомером. Смотрят давление и расход."},
  air:{n:"Сжатый воздух", t:"Жёлтая труба сжатого воздуха с манометром. Смотрят давление."},
  lube:{n:"Центральная смазка", t:"Станция смазки: бачок с насосом и трубки к подшипникам. Смотрят уровень смазки и работу насоса."},
  vacuum:{n:"Вакуум", t:"Вакуумная камера и насос: убирают воздух из глины, чтобы брус был плотным."},
  auger:{n:"Шнек пресса", t:"Шнек в цилиндре пресса — давит массу к фильере."},
  die:{n:"Фильера", t:"Формующая головка: через неё выходит брус глины нужного сечения."},
  column:{n:"Брус глины", t:"Брус после пресса. Его осматривают — трещины, рваные края."},
  cutter:{n:"Резчик", t:"Рамка со струнами режет брус на кирпичи."},
  pusher:{n:"Толкатели", t:"Цилиндры, которые двигают кирпич или вагонетки."},
  robot:{n:"Робот", t:"Робот-манипулятор: ставит сырец на вагонетки или снимает готовый кирпич."},
  brake:{n:"Тормоз", t:"Тормоз удерживает состав вагонеток, чтобы они не накатывались."},
  rails:{n:"Рельсы", t:"Рельсы для вагонеток с кирпичом."},
  compressor:{n:"Компрессоры", t:"Винтовые компрессоры дают сжатый воздух цеху. На панели — давление, температура, ошибки."},
  receiver:{n:"Ресивер", t:"Бак сжатого воздуха."},
  drain:{n:"Слив конденсата", t:"Кран внизу ресивера — сюда сливают воду (конденсат)."},
  thermo:{n:"Температура", t:"Датчики и табло температуры."},
  fans:{n:"Вентиляторы", t:"Вентиляторы гонят горячий воздух. Смотрят шум, вибрацию, ремни."},
  servo:{n:"Сервоприводы", t:"Синие сервоприводы открывают и закрывают заслонки по зонам."},
  burners:{n:"Горелки", t:"Горелки сверху печи — подают топливо в зону обжига."},
  hoses:{n:"Шланги", t:"Шланги подачи топлива и воздуха к горелкам. Смотрят трещины и подтёки."},
  lights:{n:"Освещение", t:"Светильники над участком."},
  chains:{n:"Цепные конвейеры", t:"Цепи везут пакеты кирпича. Смотрят натяжение и смазку."},
  guides:{n:"Направляющие", t:"Жёлтые направляющие ровняют пакеты на конвейере."},
  products:{n:"Готовая продукция", t:"Пакеты обожжённого кирпича (ГП). Смотрят сколы, трещины, обвязку."},
  wrapper:{n:"Обвязка и плёнка", t:"Станция, которая обвязывает пакет и затягивает плёнкой."},
  screw:{n:"Шнек угля", t:"Шнек подаёт уголь к печи."},
  generator:{n:"Генератор", t:"Привод системы подачи топлива."},
  feeder:{n:"Питатель PL 024", t:"Питатель под бункерами — выдаёт массу на ленту к вальцам."},
  left:{n:"Левый запасник", t:"Левый отсек склада угля."}, right:{n:"Правый запасник", t:"Правый отсек склада угля."},
  hydraulics:{n:"Гидравлика", t:"Гидроцилиндры держат зазор между валками."},
};
// пункт чек-листа → где это на станке
const RULES = [
  [/двигател/i, ["motor"]], [/подшипник/i, ["bearings"]], [/ремн/i, ["belts"]], [/редуктор/i, ["gearbox"]],
  [/вибрац|шум/i, ["motor","bearings","fans"]], [/концев/i, ["limits"]], [/шкаф/i, ["cabinet"]],
  [/датчик/i, ["sensor"]], [/бильн/i, ["beater"]], [/лент/i, ["belt"]], [/скреб/i, ["scraper"]],
  [/вальц|валк/i, ["rollers"]], [/нож/i, ["knives"]], [/лопат/i, ["blades"]], [/барабан/i, ["drums"]],
  [/^конвейер$|^конвейера$|конвейеров/i, ["belt","drums","limits"]],
  [/вод/i, ["water"]], [/воздух/i, ["air"]], [/смазк/i, ["lube"]], [/формовк/i, ["column","die"]],

// ═══ Объединение неподвижных деталей ═══
// Две тысячи отдельных деталей — это две тысячи вызовов отрисовки, и
// телефон не тянет. Неподвижное у каждого станка склеиваем по узлу и
// материалу: подсветка и подписи работают по-прежнему по узлам.
function mergeGeoms(geos){
  let n = 0; for (const g of geos) n += g.attributes.position.count;
  const pos = new Float32Array(n*3), nor = new Float32Array(n*3), uv = new Float32Array(n*2);
  let o = 0;
  for (const g of geos){
    pos.set(g.attributes.position.array, o*3); nor.set(g.attributes.normal.array, o*3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, o*2);
    o += g.attributes.position.count;
  }
  const m = new THREE.BufferGeometry();
  m.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  m.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  m.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  m.computeBoundingSphere(); m.computeBoundingBox();
  return m;
}
function flipWinding(g){
  for (const name of ["position", "normal", "uv"]){
    const a = g.attributes[name]; if (!a) continue;
    const s = a.itemSize, arr = a.array, tmpA = new Float32Array(s);
    for (let i = 0; i < a.count; i += 3){
      const i1 = (i + 1)*s, i2 = (i + 2)*s;
      tmpA.set(arr.subarray(i1, i1 + s)); arr.copyWithin(i1, i2, i2 + s); arr.set(tmpA, i2);
    }
  }
}
function optimize(root){
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets = new Map(), remove = [];
  root.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh) return;
    for (let a = o; a && a !== root; a = a.parent) if (a.userData.dyn) return;
    const unit = o.userData.unit, key = (unit ? unit.id : "") + "|" + (o.userData.part || "") + "|" + o.material.uuid;
    const mtx = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(mtx);
    if (mtx.determinant() < 0) flipWinding(g);
    if (!buckets.has(key)) buckets.set(key, {mat:o.material, unit, part:o.userData.part, geos:[], shadow:o.castShadow});
    buckets.get(key).geos.push(g);
    remove.push(o);
  });
  for (const o of remove) o.parent.remove(o);
  for (const b of buckets.values()){
    const mesh = new THREE.Mesh(mergeGeoms(b.geos), b.mat);
    mesh.castShadow = b.shadow; mesh.receiveShadow = true;
    mesh.userData = {unit:b.unit, part:b.part};
    root.add(mesh);
  }
}
// после объединения узлы станков — это уже новые объекты
function rebuildParts(){
  UNITS.forEach(u => u.parts = {});
  scene.traverse(o => { const u = o.userData.unit, k = o.userData.part; if (o.isMesh && u && k){ (u.parts[k] = u.parts[k] || []).push(o); } });
}

// Esc: в окне с «Главной» закрывает окно (сначала снимает выбор
// станка), на своей странице — просто снимает выбор.
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (SELECTED){ select(null); return; }
  if (document.documentElement.classList.contains("acai-embed")){

// ── Живые показания с панели ──────────────────────────────────
// Те же четыре регистра и те же правила, что на «Главной»: имена из
// справочника, сбор остановлен — чисел не показываем вовсе.
const LIVE_REG = {"pl024_1_загрузка_проц":null, "pl024_2_загрузка_проц":null,
                  "питатель_1_гц":null, "питатель_2_гц":null};

async function refreshLive(){
  const box = $("live");
  if (!box || !window.ACAISensors) return;
  try { await ACAISensors.load(); } catch (e) {}

  let health = null;
  try { health = await ACAISensors.health(); } catch (e) {}

  if (health && !health.ok && health.state !== "never"){
    const since = (health.since || "").slice(11, 16);
    const why = health.state === "panel" ? "панель не отвечает"
              : health.state === "collector" ? "расширение не на связи" : "сбор остановлен";
    box.innerHTML = `<span class="warnText">Показаний нет${since ? " с " + since : ""} — ${esc(why)}</span>`;
    box.hidden = false;
    return;
  }

  let live = null;
  try { const r = await fetch("/api/sensors/live", {credentials:"include"}); live = r.ok ? await r.json() : null; }
  catch (e) {}
  if (!live) return;

  const parts = [];
  for (const key of Object.keys(LIVE_REG)){
    const row = live[key];
    if (!row) continue;
    const shown = ACAISensors.value(key, row.value);
    const text = parseFloat(row.value) === 0 && key.endsWith("_гц") ? "стоит" : shown.text;
    parts.push(`${esc(ACAISensors.short(key))} <b>${text}</b>`);
  }
  if (!parts.length) return;

  const at = health && health.last_data_at ? new Date(health.last_data_at) : null;
  if (at) parts.push(`снято в <b>${at.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit", second:"2-digit"})}</b>`);
  box.innerHTML = parts.join("<span>·</span>");
  box.hidden = false;
}

function init(){
  if (!window.THREE || !THREE.OrbitControls){ $("plant").insertAdjacentHTML("beforeend", '<div class="fail">3D не загрузился: браузер не смог открыть библиотеку Three.js. Обновите страницу.</div>'); $("loading").remove(); return; }
  const canvas = $("scene");
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth <= 768 ? 1.5 : 1.75));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, 1, .3, 700);
  controls = new THREE.OrbitControls(camera, canvas);
  Object.assign(controls, {enableDamping:true, dampingFactor:.08, maxPolarAngle:Math.PI*.48, minDistance:3, maxDistance:240, screenSpacePanning:false});
  raycaster = new THREE.Raycaster();
  makeTextures();
  buildWorld();
  resize(); addEventListener("resize", resize);
  viewAll(true); bindPicking(canvas);
  $("loading").remove();
  let last = performance.now();
  refreshLive();
  setInterval(() => { if (!document.hidden) refreshLive(); }, 30000);

  (function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - last)/1000); last = now;
    if (RUN) for (const f of ANIM) f(dt);
    tick(dt, now);
  })(last);
}

function buildWorld(){
  const dark = isDark();
  scene.background = new THREE.Color(dark ? 0x0e151d : 0xdde4ec);
  scene.fog = new THREE.Fog(scene.background, 170, 420);
  scene.add(new THREE.HemisphereLight(0xffffff, dark ? 0x1c242d : 0x8e98a3, dark ? .55 : .7));
  scene.add(new THREE.AmbientLight(0xffffff, dark ? .12 : .18));
  const sun = new THREE.DirectionalLight(0xfff6ea, dark ? .75 : 1.0);
  sun.position.set(-45, 95, 55); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004;
  Object.assign(sun.shadow.camera, {left:-115, right:115, top:75, bottom:-75, near:1, far:280}); scene.add(sun);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 130), new THREE.MeshStandardMaterial({map:TEX.floor, roughness:.95}));
  floor.rotation.x = -Math.PI/2; floor.position.set(42, 0, 33); floor.receiveShadow = true; scene.add(floor);

  // Корпуса: колонны по углам и низкие стены без крыши — чтобы было
  // видно внутрь. Три здания, как на заводских схемах: главный корпус
  // (печь, сушилки, формовка, упаковка), корпус Оптимы с бункерами и
  // корпус массаподготовки.
  const shell = new THREE.Group();
  function building(x0, z0, x1, z1, step){
    step = step || 16;
    const w = x1 - x0, d = z1 - z0, cx = x0 + w/2, cz = z0 + d/2;
    for (const [z, h] of [[z0, .9], [z1, .9]]) box(shell, w, 2.6, .5, M(0xa9b0b8, .9, 0), cx, 1.3, z);
    for (const x of [x0, x1]) box(shell, .5, 2.6, d, M(0xa9b0b8, .9, 0), x, 1.3, cz);
    for (const [z] of [[z0], [z1]]) box(shell, w, .4, .7, M(0x9aa2ab), cx, 2.75, z);
    for (let x = x0; x <= x1 + .1; x += step){
      for (const z of [z0, z1]) box(shell, .7, 11, .7, M(0x8e969f, .7, .4), Math.min(x, x1), 5.5, z);
    }
  }
  building(-47, 13, 47, 57);     // главный корпус
  building(47, 13, 69.5, 57);    // Оптима и бункеры
  building(72, 33, 132, 60);     // массаподготовка
  scene.add(shell); optimize(shell);

  // Жёлтая разметка проходов — вдоль главной линии и по массаподготовке.
  const lineM = new THREE.MeshBasicMaterial({color:0xe6c229});
  for (const [x0, x1, z] of [[-44, 45, 11.5], [-44, 45, 38.5], [74, 130, 47.8]]){
    const l = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, .25), lineM); l.rotation.x = -Math.PI/2; l.position.set((x0 + x1)/2, .03, z); scene.add(l);
  }
  for (const z of ZONES){
    const w = z.x1 - z.x0, d = z.z1 - z.z0;
    const pad = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({color:z.color, roughness:1, transparent:true, opacity:dark ? .28 : .2, depthWrite:false}));
    pad.rotation.x = -Math.PI/2; pad.position.set(z.x0 + w/2, .04, z.z0 + d/2); pad.receiveShadow = true; scene.add(pad);
    const el = document.createElement("div"); el.className = "zlbl"; el.textContent = z.name; $("labels").appendChild(el);
    zoneLabels.push({el, pos:new THREE.Vector3(z.x0 + w/2, .2, z.z1 - 1.6)});
  }

  // конвейеры цеха — это пункт «Конвейера» из чек-листа
  U = BY_ID.conv;
  // Порядок тот же, что в регламенте и на карте линии: питатели →
  // ДТЕ117 → PL 601 → поворот → СМК 102 → УСМ 40 → СМК 126 →
  // бункеры → Оптима → пресс → формовка.
  const CONV = [[[79,41.5],[79,44]], [[90,41.5],[90,44]],
    [[79,44],[97,44]], [[103,44],[108,44]], [[114,44],[121,44]],
    [[123,46],[123,50]],
    [[118,51.8],[110,51.8]], [[104,51.8],[95,51.8]], [[88,51.8],[58,51.8]],
    [[53.7,47],[53.7,37]], [[52,30],[52,25.5]], [[49,24],[31,24]], [[23,24],[14,24]]];
  const convRoot = new THREE.Group(); scene.add(convRoot);
  for (const path of CONV) for (let k = 0; k < path.length - 1; k++) conveyor(convRoot, path[k], path[k+1], k === path.length - 2);
  U = null;
  optimize(convRoot); pickables.push(convRoot);
  flow(CONV);

  for (const u of UNITS){
    U = u;
    const g = u.model ? MODELS[u.model](u) : new THREE.Group();
    U = null;
    g.position.set(...u.pos);
    g.traverse(o => { if (o.isMesh){ o.userData.unit = o.userData.unit || u; o.castShadow = o.receiveShadow = !o.material.transparent; } });
    scene.add(g); optimize(g);
    // движущиеся узлы склеиваем внутри себя: крутятся целиком
    const dyns = []; g.traverse(o => { if (o !== g && o.userData.dyn && !o.isMesh) dyns.push(o); });
    dyns.forEach(optimize);
    u.group = g; pickables.push(g);
    const el = document.createElement("button"); el.className = "lbl"; el.type = "button";
    el.innerHTML = `<span class="n"></span><span>${esc(u.name)}</span>`;
    el.addEventListener("click", () => select(u, true));
    $("labels").appendChild(el);
    u.label = el; u.anchor = new THREE.Vector3(u.pos[0], u.top || 3, u.pos[2]);
  }
  // Сушилок на плане две, в чек-листе дежурного — одна позиция.
  // Вторую ставим как часть цеха и привязываем к тому же пункту:
  // нажали на любую — открылась «Сушилка».
  if (MODELS.dryer){
    const second = MODELS.dryer(BY_ID.dryer);
    second.position.set(-29, 0, 41);
    second.traverse(o => { if (o.isMesh){ o.userData.unit = BY_ID.dryer; o.castShadow = o.receiveShadow = !o.material.transparent; } });
    scene.add(second); optimize(second); pickables.push(second);
  }

  cars();
  rebuildParts();

  ring = new THREE.Mesh(new THREE.RingGeometry(3.2, 3.7, 56), new THREE.MeshBasicMaterial({color:0x3b82f6, transparent:true, opacity:.85, side:THREE.DoubleSide, depthWrite:false}));
  ring.rotation.x = -Math.PI/2; ring.visible = false; scene.add(ring);
}

function conveyor(root, a, b, last){
  const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
  if (len < .4) return;
  const g = new THREE.Group();
  beltSeg(g, -len/2, len/2, 1.25, 0, .85, TEX.belt, .9);
  if (len > 3){ motor(g, len/2 - .9, .75, .95, .8, .26, -1); pillow(g, len/2, 1.1, -.6, .7); pillow(g, len/2, 1.1, .6, .7); }
  if (last) limitSw(g, len/2 - .3, 1.45, -.55);
  P("scraper", box(g, .08, .08, .8, M(COL.guard), len/2 + .15, 1.0, 0));
  g.position.set(a[0] + dx/2, 0, a[1] + dz/2); g.rotation.y = -Math.atan2(dz, dx);
  g.traverse(o => { if (o.isMesh){ o.userData.unit = BY_ID.conv; } });
  root.add(g);
}

// комья массы едут по лентам
function flow(paths){
  const segs = []; for (const p of paths) for (let k = 0; k < p.length - 1; k++) segs.push([p[k], p[k+1]]);
  const per = 5, n = segs.length*per;
  const inst = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.17, 0), M(COL.clay, .95, 0), n);
  inst.castShadow = true; scene.add(inst);
  const st = [], o = new THREE.Object3D();
  segs.forEach(s => { for (let k = 0; k < per; k++) st.push({s, t:k/per, r:Math.random()*6}); });
  const draw = () => { st.forEach((p, i) => { const [a, b] = p.s; o.position.set(a[0] + (b[0] - a[0])*p.t, 1.42, a[1] + (b[1] - a[1])*p.t); o.rotation.set(p.r, p.r*2, 0); o.scale.setScalar(.8 + (p.r % 1)*.6); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); }); inst.instanceMatrix.needsUpdate = true; };
  draw();
  ANIM.push(dt => { for (const p of st){ const [a, b] = p.s; const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; p.t += .9*dt/len; if (p.t > 1) p.t -= 1; } draw(); });
}

// вагонетки: сушилка, потом печь
function cars(){
  // Два пути сушилок и путь печи — там же, где рельсы на плане.
  const lines = [{z:31, x0:-40, x1:-18, n:9, unit:"dryer", fired:false},
                 {z:41, x0:-40, x1:-18, n:9, unit:"dryer", fired:false},
                 {z:20.8, x0:-40, x1:-20, n:9, unit:"kiln", fired:true}];
  for (const L of lines){
    const arr = [];
    for (let i = 0; i < L.n; i++){
      const g = new THREE.Group(); box(g, 2.6, .45, 2.9, M(0x34383d, .6, .5), 0, .65, 0);
      for (const x of [-.9, .9]) for (const z of [-1.5, 1.5]) cyl(g, .2, .2, .12, M(0x111111), x, .4, z, Math.PI/2, 0, 0, 12);
      for (let k = 0; k < 3; k++) box(g, 2.2, .45, 2.4, M(L.fired ? 0xc65f3a : 0xb98a6a, .95, 0), 0, 1.13 + k*.48, 0);
      g.position.set(L.x0 + i*(L.x1 - L.x0)/L.n, 0, L.z); scene.add(g); arr.push(g);
      g.traverse(o => { if (o.isMesh){ o.userData.unit = BY_ID[L.unit]; } }); optimize(g);
    }
    ANIM.push(dt => { for (const c of arr){ c.position.x += .9*dt; if (c.position.x > L.x1) c.position.x -= (L.x1 - L.x0); } });
  }
}

function fitStage(){
  // сцена занимает всё место под шапкой; на телефоне — над нижней панелью
  const st = $("plant"), top = st.getBoundingClientRect().top + scrollY;
  const reserve = innerWidth <= 768 ? 84 : 14;
  st.style.height = Math.max(420, innerHeight - top - reserve) + "px";
}
function resize(){
  if (!renderer) return;
  fitStage();
  const rc = $("plant").getBoundingClientRect();
  const w = W = Math.round(rc.width), h = H = Math.round(rc.height);
  renderer.setSize(w, h, false); camera.aspect = w/h;
  const panel = $("panel").getBoundingClientRect();
  if (innerWidth > 768){ camera.fov = 42; const off = panel.width + 24; camera.setViewOffset(w + off, h, off, 0, w, h); }
  else { const off = Math.min(panel.height, h*.5) + 8; camera.fov = 2*Math.atan(Math.tan(21*Math.PI/180)*(h + off)/h)*180/Math.PI; camera.setViewOffset(w, h + off, 0, off, w, h); }
  camera.updateProjectionMatrix();
}

// ── камера ──
let fly = null;
function flyTo(target, dist, instant){
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  if (!isFinite(dir.x) || dir.lengthSq() < .1) dir.set(.55, .7, .9).normalize();
  dir.y = Math.max(dir.y, .45); dir.normalize();
  const endPos = target.clone().add(dir.multiplyScalar(dist));
  if (instant || matchMedia("(prefers-reduced-motion: reduce)").matches){ controls.target.copy(target); camera.position.copy(endPos); controls.update(); fly = null; return; }
  fly = {t:0, fromT:controls.target.clone(), toT:target.clone(), fromP:camera.position.clone(), toP:endPos};
}
function viewAll(instant){
  // Завод вытянут с запада на восток почти на 180 м: от угля и печи
  // до корпуса массаподготовки. Отходим дальше, иначе края не влезают.
  const narrow = innerWidth <= 768, target = new THREE.Vector3(narrow ? 33 : 34, 0, 32);
  const pos = new THREE.Vector3(target.x - 54, narrow ? 260 : 190, target.z + (narrow ? 210 : 162));
  if (instant){ camera.position.copy(pos); controls.target.copy(target); controls.update(); return; }
  fly = {t:0, fromT:controls.target.clone(), toT:target, fromP:camera.position.clone(), toP:pos};
}

const tmp = new THREE.Vector3(), box3 = new THREE.Box3();
let partLabels = [];
function tick(dt, now){
  if (fly){
    fly.t = Math.min(1, fly.t + dt*1.8);
    const k = fly.t < .5 ? 2*fly.t*fly.t : 1 - Math.pow(-2*fly.t + 2, 2)/2;
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromP, fly.toP, k);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  if (ring.visible) ring.material.opacity = .5 + Math.sin(now/300)*.3;
  const pulse = .75 + Math.sin(now/220)*.55;
  for (const h of HOT) h.material.emissiveIntensity = pulse;
  renderer.render(scene, camera);
  placeLabels();
}

function project(v){ tmp.copy(v).project(camera); return {x:(tmp.x*.5 + .5)*W, y:(-tmp.y*.5 + .5)*H, vis:tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1}; }
function placeLabels(){
  const camDist = camera.position.distanceTo(controls.target);
  // названия станков без наложений: важные (выбранный, на маршруте) — первыми
  const taken = [];
  const units = UNITS.slice().sort((a, b) => (b === SELECTED) - (a === SELECTED) || b.label.classList.contains("on-route") - a.label.classList.contains("on-route"));
  for (const u of units){
    const p = project(u.anchor), routed = ROUTE_KIND && u.label.classList.contains("on-route");
    let show = p.vis && (camDist < (innerWidth <= 768 ? 250 : 190) || u === SELECTED || routed) && !(SELECTED === u && camDist < 26 && partLabels.length);
    if (show){
      const w = u.lw || (u.lw = u.name.length*6.8 + (routed ? 46 : 22)), r = {x0:p.x - w/2, x1:p.x + w/2, y0:p.y - 26, y1:p.y};
      if (u !== SELECTED && taken.some(q => r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0)) show = false;
      else taken.push(r);
    }
    u.label.style.display = show ? "" : "none";
    if (show){ u.label.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-100%)`; u.label.style.zIndex = u === SELECTED ? 5 : routed ? 3 : 1; }
  }
  for (const z of zoneLabels){ const p = project(z.pos); z.el.style.display = p.vis ? "" : "none"; if (p.vis) z.el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`; }
  const placed = [], focus = HOT.length > 0;
  const order = partLabels.slice().sort((a, b) => b.el.classList.contains("hot") - a.el.classList.contains("hot"));
  for (const pl of order){
    const hot = pl.el.classList.contains("hot");
    const p = project(pl.pos);
    let show = p.vis && camDist < 48 && (!focus || hot);
    if (show){
      const w = pl.w || (pl.w = Math.max(60, pl.el.textContent.length*6.6 + 24)), h = 22;
      const r = {x0:p.x - w/2, x1:p.x + w/2, y0:p.y - h/2, y1:p.y + h/2};
      if (placed.some(q => r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0)) show = false;
      else placed.push(r);
    }
    pl.el.style.display = show ? "" : "none";
    if (show) pl.el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
  }
}

function bindPicking(canvas){
  let down = null; const pt = new THREE.Vector2();
  canvas.addEventListener("pointerdown", e => { down = {x:e.clientX, y:e.clientY}; fly = null; });
  canvas.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
    const r = canvas.getBoundingClientRect();
    pt.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1);
    raycaster.setFromCamera(pt, camera);
    const hit = raycaster.intersectObjects(pickables, true).find(h => h.object.userData.unit);
    if (!hit) return;
    const u = hit.object.userData.unit, part = hit.object.userData.part;
    if (u === SELECTED && part && u.parts[part] && PART[part]) showPart(part);
    else select(u, true);
  });
}

// ═══ Узлы: подписи и подсветка ═══
function centerOf(objs){ box3.makeEmpty(); for (const o of objs){ o.updateWorldMatrix(true, true); box3.expandByObject(o); } return {c:box3.getCenter(new THREE.Vector3()), size:box3.getSize(new THREE.Vector3()), top:box3.max.y}; }
function clearHot(){ for (const h of HOT) h.mesh.material = h.orig; HOT = []; partLabels.forEach(p => p.el.classList.remove("hot")); }
function highlight(kinds){
  clearHot();
  const u = SELECTED; if (!u) return;
  for (const k of kinds) for (const o of u.parts[k] || []) o.traverse(m => {
    if (!m.isMesh) return;
    const orig = m.material, c = orig.clone(); c.emissive = new THREE.Color(0xff5a00); c.emissiveIntensity = 1; if (c.map) c.map = orig.map;
    m.material = c; HOT.push({mesh:m, orig, material:c});
  });
  partLabels.forEach(p => p.el.classList.toggle("hot", kinds.includes(p.kind)));
}
function buildPartLabels(u){
  partLabels.forEach(p => p.el.remove()); partLabels = [];
  if (!u || u.id === "conv") return;
  for (const [kind, objs] of Object.entries(u.parts)){
    if (!PART[kind] || !objs.length) continue;
    const {c, top} = centerOf(objs.slice(0, 6));
    const el = document.createElement("button"); el.className = "plbl"; el.type = "button"; el.textContent = PART[kind].n;
    el.addEventListener("click", () => showPart(kind));
    $("labels").appendChild(el);
    partLabels.push({el, kind, pos:new THREE.Vector3(c.x, Math.min(top + .25, c.y + 1.2), c.z)});
  }
}
let ACTIVE = {kind:null, item:null};
function showPart(kind, item){
  ACTIVE = {kind, item:item || null};
  const kinds = item ? partsFor(item, SELECTED) : [kind];
  highlight(kinds);
  const objs = kinds.flatMap(k => SELECTED.parts[k] || []);
  if (objs.length && SELECTED.id !== "conv"){ const {c, size} = centerOf(objs); const dist = Math.max(7, Math.min(40, Math.max(size.x, size.z)*1.6 + 5)); flyTo(c, dist*(camera.aspect < 1 ? 1.6 : 1)); }
  renderPanel();
}

// ═══ Панель ═══
function zoneDot(name){ const z = ZONES.find(z => z.name === name); return z ? "#" + z.color.toString(16).padStart(6, "0") : "#888"; }
function unitSize(u){ return {dryer:20, kiln:24, compressor:8, coal:13, pack:9, bunkers:6, press:7.5, mixer:5, lightpanel:4, feeder:5, forming:6}[u.model] || 4.6; }
function select(u, fly2 = true){
  SELECTED = u; ACTIVE = {kind:null, item:null}; clearHot();
  for (const x of UNITS) x.label.classList.toggle("sel", x === u);
  const s = unitSize(u);
  ring.visible = u.id !== "conv"; ring.position.set(u.pos[0], .08, u.pos[2]); ring.scale.setScalar(s/3.5);
  buildPartLabels(u);
  renderPanel(); resize();
  if (u.id === "conv"){ highlight(["belt"]); if (fly2) viewAll(false); return; }
  if (fly2) flyTo(new THREE.Vector3(u.pos[0], 1.5, u.pos[2]), Math.max(16, s*2.4)*(camera.aspect < 1 ? 1.9 : 1));
}
function checksHTML(list){
  if (!list || !list.length) return `<p class="none">Этого пункта нет в его чек-листе.</p>`;
  return `<div class="checks">${list.map(it => {
    const has = partsFor(it, SELECTED).length, on = ACTIVE.item === it;
    return `<button class="ck" ${has ? `data-item="${esc(it)}"` : "disabled"} aria-pressed="${on}"><span class="mk">✓</span><span>${esc(it)}</span>${has ? `<span class="go">${on ? "◉ показано" : "показать"}</span>` : ""}</button>`;
  }).join("")}</div>`;
}
function renderPanel(){
  const head = $("panelHead"), body = $("panelBody");
  $("panel").classList.remove("min");
  if (!SELECTED){
    const r = ROUTE_KIND;
    head.innerHTML = `<div class="crumb">${r ? (r === "el" ? "Маршрут дежурного электрика" : "Маршрут дежурного слесаря") : "Как пользоваться"}</div><h2>${r ? `${ROUTE[r].length} точек обхода` : "Где что стоит в цехе"}</h2>`;
    body.innerHTML = `<p class="intro">${r ? "Номера на станках — порядок обхода, как в чек-листе. «Начать обход» проведёт камеру по всем точкам."
      : "Станки из чек-листов дежурных. Нажмите на станок: увидите, из чего он состоит, а нажатие на пункт проверки подсветит нужное место на станке."}</p>
      ${r ? `<div class="step"><button class="btn primary" id="startRoute" style="flex:1">Начать обход →</button></div>` : ""}
      <div class="legend"><span><span class="dot" style="background:var(--el)"></span> проверяет электрик</span><span><span class="dot" style="background:var(--sl)"></span> проверяет слесарь</span><span><span class="dot" style="background:var(--hl)"></span> подсвеченный узел</span></div>
      <div class="list">${listHTML()}</div>`;
    $("startRoute")?.addEventListener("click", () => select(BY_NAME[ROUTE[r][0]]));
    body.querySelectorAll("[data-u]").forEach(b => b.addEventListener("click", () => select(BY_NAME[b.dataset.u])));
    return;
  }
  const u = SELECTED, r = ROUTE_KIND, idx = r ? ROUTE[r].indexOf(u.name) : -1;
  head.innerHTML = `<button class="close" id="closeSel" aria-label="Закрыть">×</button>
    <div class="crumb"><span class="dot" style="background:${zoneDot(u.zone)}"></span> ${esc(u.zone)}${idx >= 0 ? ` · точка ${idx + 1} из ${ROUTE[r].length}` : ""}</div>
    <h2>${esc(u.name)}${u.code && !u.name.includes(u.code) ? `<span class="code">${esc(u.code)}</span>` : ""}</h2>
    ${r ? `<div class="step"><button class="btn" id="prevStep" ${idx <= 0 ? "disabled" : ""}>← Назад</button>
      <span class="of">${idx >= 0 ? `${idx + 1} / ${ROUTE[r].length}` : "не на маршруте"}</span>
      <button class="btn primary" id="nextStep" ${idx < 0 || idx >= ROUTE[r].length - 1 ? "disabled" : ""}>Дальше →</button></div>` : ""}`;
  const kinds = Object.keys(u.parts).filter(k => PART[k] && u.parts[k].length);
  const info = ACTIVE.kind && !ACTIVE.item ? PART[ACTIVE.kind] : null;
  const itemInfo = ACTIVE.item ? partsFor(ACTIVE.item, u).map(k => PART[k]) : [];
  const facts = u.facts ? `<dl class="facts">${Object.entries(u.facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "";
  const elB = `<h3><span class="dot" style="background:var(--el)"></span> Проверяет электрик</h3>${checksHTML(EL[u.name])}`;
  const slB = `<h3><span class="dot" style="background:var(--sl)"></span> Проверяет слесарь</h3>${checksHTML(SL[u.name])}`;
  body.innerHTML = `
    <h3>Что это</h3><p>${esc(u.what)}</p>
    <h3>Где найти</h3><p>${esc(u.where)}</p>${facts}
    ${kinds.length ? `<h3>Из чего состоит</h3><div class="parts">${kinds.map(k => `<button class="pchip" data-part="${k}" aria-pressed="${ACTIVE.kind === k && !ACTIVE.item}">${esc(PART[k].n)}</button>`).join("")}</div>` : ""}
    ${info ? `<div class="pinfo"><b>${esc(info.n)}</b>${esc(info.t)}</div>` : ""}
    ${itemInfo.length ? `<div class="pinfo"><b>«${esc(ACTIVE.item)}» — где смотреть</b>${itemInfo.map(p => `${esc(p.n)}: ${esc(p.t)}`).join("<br>")}</div>` : ""}
    ${r === "sl" ? slB + elB : elB + slB}`;
  $("closeSel").addEventListener("click", () => { SELECTED = null; clearHot(); ring.visible = false; buildPartLabels(null); UNITS.forEach(x => x.label.classList.remove("sel")); renderPanel(); resize(); });
  $("prevStep")?.addEventListener("click", () => select(BY_NAME[ROUTE[r][idx - 1]]));
  $("nextStep")?.addEventListener("click", () => select(BY_NAME[ROUTE[r][idx + 1]]));
  body.querySelectorAll("[data-part]").forEach(b => b.addEventListener("click", () => showPart(b.dataset.part)));
  body.querySelectorAll("[data-item]").forEach(b => b.addEventListener("click", () => showPart(null, b.dataset.item)));
}
function listHTML(){
  let h = "", last = null;
  for (const u of UNITS){
    if (ROUTE_KIND && !ROUTE[ROUTE_KIND].includes(u.name)) continue;
    if (u.zone !== last){ h += `<div class="zone"><span class="dot" style="background:${zoneDot(u.zone)}"></span> ${esc(u.zone)}</div>`; last = u.zone; }
    const n = ROUTE_KIND ? ROUTE[ROUTE_KIND].indexOf(u.name) + 1 : 0;
    h += `<button data-u="${esc(u.name)}">${n ? `<b style="min-width:22px;font-variant-numeric:tabular-nums">${n}.</b>` : ""}<span>${esc(u.name)}</span>
      <span class="tags">${EL[u.name] ? '<span class="tag el">Э</span>' : ""}${SL[u.name] ? '<span class="tag sl">С</span>' : ""}</span></button>`;
  }
  return h;
}
function setRoute(kind){
  ROUTE_KIND = kind;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.route === kind));
  $("plant").classList.toggle("route-el", kind === "el"); $("plant").classList.toggle("route-sl", kind === "sl");
  for (const u of UNITS){ if (!u.label) continue; const i = kind ? ROUTE[kind].indexOf(u.name) : -1; u.label.classList.toggle("on-route", i >= 0); u.label.querySelector(".n").textContent = i >= 0 ? i + 1 : ""; }
  if (routeLine){ scene.remove(routeLine); routeLine = null; }
  if (kind && scene){
    UNITS.forEach(u => u.lw = 0);
    const pts = ROUTE[kind].map(n => BY_NAME[n]).filter(Boolean).map(u => new THREE.Vector3(u.pos[0], .3, u.pos[2] + (u.id.endsWith("hop") ? -2.4 : 0)));
    routeLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({color:kind === "el" ? 0xf0b24c : 0x5b9cff, dashSize:1.6, gapSize:.9}));
    routeLine.computeLineDistances(); scene.add(routeLine);
  }
  if (SELECTED && kind && !ROUTE[kind].includes(SELECTED.name)){ SELECTED = null; clearHot(); if (ring) ring.visible = false; buildPartLabels(null); UNITS.forEach(x => x.label && x.label.classList.remove("sel")); }
  renderPanel();
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setRoute(b.dataset.route)));
$("viewAll").addEventListener("click", () => { if (renderer) viewAll(false); });
const motionBtn = $("motion");
function paintMotion(){ motionBtn.textContent = RUN ? "❚❚ Пауза" : "▶ Движение"; motionBtn.setAttribute("aria-label", RUN ? "Остановить движение" : "Запустить движение"); }
motionBtn.addEventListener("click", () => { RUN = !RUN; paintMotion(); });
paintMotion();
$("panelHead").addEventListener("click", e => { if (innerWidth <= 768 && !e.target.closest("button")){ $("panel").classList.toggle("min"); resize(); } });

initLayout().then(async () => {
  let T;
  try { T = await ACAI.get('/api/duty-round/template'); }
  catch {
    $("loading").textContent = "Не удалось загрузить чек-листы обхода. Обновите страницу.";
    return;
  }
  loadLists(T);
  renderPanel();
  fitStage();
  init();
  // переход из «Обхода дежурного»: сразу к станку и, если указан, к пункту
  const q = new URLSearchParams(location.search), u = BY_NAME[q.get("unit") || ""];
  if (u && renderer){ select(u, true); const item = q.get("item"); if (item && partsFor(item, u).length) setTimeout(() => showPart(null, item), 650); }
});
</script>
</body>
</html>
