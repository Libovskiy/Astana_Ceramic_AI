<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>События — ACAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/acai.css?v=9">
<style>
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;border-left:4px solid var(--border);}
.task-card.high{border-left-color:var(--danger);}
.task-card.normal{border-left-color:var(--warn);}
.task-card.low{border-left-color:var(--accent);}
.task-card.done{border-left-color:var(--ok);opacity:.7;}
.task-card.critical{border-left-color:var(--danger);background:rgba(239,68,68,.04);}
.task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
.task-title{font-size:14px;font-weight:600;}
.task-desc{white-space:pre-wrap;font-size:12px;color:var(--text-dim);margin-bottom:8px;}
.task-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
.due-label{font-weight:700;}
.due-label.overdue{color:var(--danger);}
.due-label.today{color:var(--warn);}
.due-label.soon{color:var(--accent);}
.due-label.ok{color:var(--ok);}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-chip{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">События и задачи</div>
        <div class="topbar-sub">Плановые работы и задания</div>
      </div>
      <div class="topbar-right">
        <button class="btn primary" onclick="openAddTask()">+ Задача</button>
        <span class="topbar-clock" id="topbarClock"></span>
      </div>
    </header>
    <div class="page">

      <div class="metrics" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px" id="taskMetrics">
        <div class="metric"><div class="metric-label">Загрузка...</div></div>
      </div>

      <div class="filters-row">
        <button class="filter-chip active" data-f="">Все</button>
        <button class="filter-chip" data-f="new">Новые</button>
        <button class="filter-chip" data-f="in_progress">В работе</button>
        <button class="filter-chip" data-f="done">Выполненные</button>
        <button class="filter-chip" data-f="overdue" style="color:var(--danger)">Просроченные</button>
        <input class="input" id="taskSearch" placeholder="🔍 Поиск..." style="width:200px;margin-left:auto" oninput="renderTasks()">
      </div>

      <div id="taskList"><div class="empty">Загрузка...</div></div>
    </div>
  </div>
</div>
<div class="overlay hidden" id="_overlay"><div class="modal" id="_modal" style="width:500px;max-width:95vw"></div></div>

<script src="/static/acai_layout.js?v=10"></script>
<script src="/static/mobile_nav_v2.js?v=2"></script>
<script>
let allTasks=[];let currentFilter='';

const PRIO_LABELS={high:'Высокий',normal:'Нормальный',low:'Низкий',critical:'Критический'};
const TYPE_LABELS={ordinary:'Обычная',maintenance:'ТО',spare_part:'Запчасти',production:'Производство',laboratory:'Лаборатория',document:'Документ',personnel:'Персонал',critical:'Критическая',event:'Событие'};
const STATUS_LABELS={new:'Новая',in_progress:'В работе',done:'Выполнена',cancelled:'Отменена'};

function dueInfo(due_at,status){
  if(!due_at||status==='done')return{label:'',cls:''};
  const diff=new Date(due_at).getTime()-Date.now();
  if(diff<0)return{label:'⚠ Просрочено',cls:'overdue'};
  if(diff<3600000)return{label:'Через <1ч',cls:'today'};
  if(diff<86400000)return{label:'Сегодня',cls:'today'};
  if(diff<86400000*3)return{label:`${Math.ceil(diff/86400000)}д`,cls:'soon'};
  return{label:`${Math.ceil(diff/86400000)}д`,cls:'ok'};
}

async function load(){
  const r=await ACAI.get('/api/tasks');
  allTasks=r.tasks||[];
  const now=Date.now();
  const open=allTasks.filter(t=>t.status==='new'||t.status==='in_progress').length;
  const inprog=allTasks.filter(t=>t.status==='in_progress').length;
  const done=allTasks.filter(t=>t.status==='done').length;
  const overdue=allTasks.filter(t=>t.due_at&&new Date(t.due_at).getTime()<now&&t.status!=='done'&&t.status!=='cancelled').length;
  document.getElementById('taskMetrics').innerHTML=`
    <div class="metric ${open>0?'accent':'ok'}"><div class="metric-label">Открытых</div><div class="metric-value accent">${open}</div><div class="metric-sub">задач</div></div>
    <div class="metric ${inprog>0?'warn':'ok'}"><div class="metric-label">В работе</div><div class="metric-value ${inprog>0?'warn':'ok'}">${inprog}</div><div class="metric-sub">выполняются</div></div>
    <div class="metric ok"><div class="metric-label">Выполнено</div><div class="metric-value ok">${done}</div><div class="metric-sub">задач</div></div>
    <div class="metric ${overdue>0?'danger':'ok'}"><div class="metric-label">Просрочено</div><div class="metric-value ${overdue>0?'danger':'ok'}">${overdue}</div><div class="metric-sub">требует внимания</div></div>`;
  renderTasks();
  loadAssignees();   // подтягиваем исполнителей и перерисовываем
}

function renderTasks(){
  const now=Date.now();
  let items=allTasks;
  if(currentFilter==='overdue') items=items.filter(t=>t.due_at&&new Date(t.due_at).getTime()<now&&t.status!=='done');
  else if(currentFilter) items=items.filter(t=>t.status===currentFilter);
  const q=(document.getElementById('taskSearch')?.value||'').toLowerCase();
  if(q) items=items.filter(t=>(t.title||'').toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q));
  if(!items.length){document.getElementById('taskList').innerHTML='<div class="empty">Задач нет</div>';return;}

  // сортируем: сначала просроченные, потом по приоритету
  const PRIO_W={critical:0,high:1,normal:2,low:3};
  items=[...items].sort((a,b)=>{
    const ao=a.due_at&&new Date(a.due_at).getTime()<now?0:1;
    const bo=b.due_at&&new Date(b.due_at).getTime()<now?0:1;
    if(ao!==bo)return ao-bo;
    return(PRIO_W[a.priority]??2)-(PRIO_W[b.priority]??2);
  });

  document.getElementById('taskList').innerHTML=items.map(t=>{
    const di=dueInfo(t.due_at,t.status);
    const cls=t.status==='done'?'done':(t.priority||'normal');
    const dueStr=t.due_at?new Date(t.due_at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    return`<div class="task-card ${cls}">
      <div class="task-head">
        <div class="task-title">${t.title||'—'}</div>
        <div style="display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap">
          <span class="badge ${t.priority==='high'||t.priority==='critical'?'danger':t.priority==='normal'?'warn':'accent'}" style="font-size:10px">${PRIO_LABELS[t.priority]||t.priority}</span>
          <span class="badge neutral" style="font-size:10px">${STATUS_LABELS[t.status]||t.status}</span>
          ${t.task_type?`<span class="badge neutral" style="font-size:10px">${TYPE_LABELS[t.task_type]||t.task_type}</span>`:''}
        </div>
      </div>
      ${t.description?`<div class="task-desc">${taskDesc(t.description)}</div>`:''}
      <div class="task-meta">
        ${dueStr?`<span>📅 ${dueStr}</span>`:''}
        ${di.label?`<span class="due-label ${di.cls}">${di.label}</span>`:''}
        ${t.creator_name?`<span>✏️ ${t.creator_name}</span>`:''}
        ${t.equipment_name?`<span>⚙️ ${t.equipment_name}</span>`:''}
        ${assigneeLabel(t.id)}
        ${t.status!=='done'?`<button class="btn secondary sm" style="margin-left:auto" onclick="openAssign(${t.id})">👤 Назначить</button>
          <button class="btn ok sm" onclick="doneTask(${t.id})">✓ Выполнено</button>`:
          `<button class="btn secondary sm" style="margin-left:auto" onclick="reopenTask(${t.id})">↩ Переоткрыть</button>`}
      </div>
    </div>`;
  }).join('');
}

// В описании заявок с обхода лежат ссылки на снимки — показываем их
// миниатюрами, иначе инженеру пришлось бы копировать адрес в строку браузера.
const PHOTO_RE=/\/api\/checklist\/photo\/(\d+)/g;

function taskDesc(text){
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ids=[...String(text).matchAll(PHOTO_RE)].map(m=>m[1]);
  if(!ids.length) return esc(text);

  // убираем сами ссылки и осиротевший заголовок «Фото с места:»
  const body=String(text)
    .replace(PHOTO_RE,'')
    .replace(/Фото с места:\s*/,'')
    .split('\n').filter(l=>l.trim()).join('\n');

  const thumbs=ids.map(id=>`<img src="/api/checklist/photo/${id}"
      onclick="viewTaskPhoto('${id}')"
      style="width:72px;height:72px;object-fit:cover;border-radius:8px;
             border:1px solid var(--border);cursor:pointer">`).join('');

  return`${esc(body)}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${thumbs}</div>`;
}

function viewTaskPhoto(id){
  ACAI.showModal(`
    <img src="/api/checklist/photo/${id}" style="width:100%;border-radius:8px;max-height:72vh;object-fit:contain">
    <div class="modal-foot">
      <a class="btn secondary" href="/api/checklist/photo/${id}" target="_blank">Открыть оригинал</a>
      <button class="btn secondary" onclick="ACAI.closeModal()">Закрыть</button>
    </div>
  `);
}

// ── назначение исполнителей ───────────────────────────────
let assignees={};   // {task_id: [{id, full_name, role}]}

function assigneeLabel(taskId){
  const a=assignees[taskId];
  if(!a) return '';
  if(!a.length) return `<span style="color:var(--warn)">👤 Не назначен</span>`;
  return `<span>👤 ${a.map(u=>u.full_name||u.username).join(', ')}</span>`;
}

async function loadAssignees(){
  const ids=allTasks.filter(t=>t.status!=='done').map(t=>t.id);
  await Promise.all(ids.map(async id=>{
    try{
      const r=await ACAI.get(`/api/tasks/${id}/assignees`);
      assignees[id]=r.assignees||[];
    }catch{ assignees[id]=[]; }
  }));
  renderTasks();
}

async function openAssign(taskId){
  let users=[],current=[];
  try{
    const [u,a]=await Promise.all([
      ACAI.get('/api/tasks/assignable'),
      ACAI.get(`/api/tasks/${taskId}/assignees`)
    ]);
    users=u.users||[]; current=(a.assignees||[]).map(x=>x.id);
  }catch(e){
    ACAI.toast(e.message==='403'?'Назначать может только руководитель':e.message,'danger');
    return;
  }
  if(!users.length){ ACAI.toast('Некого назначить — в системе нет исполнителей','danger'); return; }

  const ROLE={technician:'Техник',worker:'Рабочий',engineer:'Инженер',
              electrician:'Электрик',mechanic:'Механик',
              chief_engineer:'Гл. инженер',chief_mechanic:'Гл. механик',
              chief_electrician:'Гл. энергетик',shift_supervisor:'Нач. смены',
              technologist:'Технолог'};

  ACAI.showModal(`
    <h3>Кто займётся</h3>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">
      Рядом с именем — сколько задач уже висит на человеке.
    </div>
    <div style="max-height:50vh;overflow-y:auto">
      ${users.map(u=>`
        <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;
                      background:var(--surface-2);border-radius:8px;margin-bottom:6px;cursor:pointer">
          <input type="checkbox" value="${u.id}" ${current.includes(u.id)?'checked':''}
                 style="width:16px;height:16px;flex-shrink:0">
          <span style="flex:1">
            <span style="font-size:13px;font-weight:600">${u.full_name||u.username}</span>
            <span style="font-size:11px;color:var(--text-dim)"> · ${ROLE[u.role]||u.role}</span>
          </span>
          <span style="font-size:11px;color:${u.open_tasks>4?'var(--danger)':'var(--text-dim)'};flex-shrink:0">
            ${u.open_tasks} задач
          </span>
        </label>`).join('')}
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="ACAI.closeModal()">Отмена</button>
      <button class="btn primary" id="assignSave" onclick="saveAssign(${taskId})">Назначить</button>
    </div>
  `);
}

async function saveAssign(taskId){
  const btn=document.getElementById('assignSave');
  if(btn){btn.disabled=true;btn.textContent='Сохраняем...';}
  const ids=[...document.querySelectorAll('#_modal input[type=checkbox]:checked')].map(c=>+c.value);
  try{
    const r=await ACAI.post(`/api/tasks/${taskId}/assign`,{user_ids:ids});
    ACAI.closeModal();
    ACAI.toast(ids.length?`Назначено: ${ids.length}`:'Исполнители сняты','ok');
    await load();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Назначить';}
    ACAI.toast(e.message,'danger');
  }
}

async function doneTask(id){
  try{await ACAI.post(`/api/tasks/${id}/status`,{status:'done'});ACAI.toast('Выполнено ✓','ok');await load();}
  catch(e){ACAI.toast(e.message,'danger');}
}
async function reopenTask(id){
  try{await ACAI.post(`/api/tasks/${id}/status`,{status:'new'});ACAI.toast('Переоткрыто');await load();}
  catch(e){ACAI.toast(e.message,'danger');}
}

function openAddTask(){
  const now=new Date();now.setDate(now.getDate()+1);
  const dateStr=now.toISOString().slice(0,16);
  ACAI.showModal(`
    <h3>Новая задача</h3>
    <div class="field"><label>Название *</label><input class="input" id="nt-title" placeholder="Что нужно сделать?"></div>
    <div class="field"><label>Описание</label><textarea class="input" id="nt-desc" rows="2"></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label>Приоритет</label>
        <select class="input" id="nt-prio">
          <option value="low">Низкий</option>
          <option value="normal" selected>Нормальный</option>
          <option value="high">Высокий</option>
          <option value="critical">Критический</option>
        </select>
      </div>
      <div class="field"><label>Тип</label>
        <select class="input" id="nt-type">
          <option value="ordinary" selected>Обычная</option>
          <option value="maintenance">ТО</option>
          <option value="spare_part">Запчасти</option>
          <option value="production">Производство</option>
          <option value="critical">Критическая</option>
          <option value="event">Событие</option>
        </select>
      </div>
      <div class="field"><label>Срок</label><input class="input" id="nt-due" type="datetime-local" value="${dateStr}"></div>
      <div class="field"><label>Видимость</label>
        <select class="input" id="nt-vis">
          <option value="everyone">Всем</option>
          <option value="role">По роли</option>
          <option value="assignees">Только мне</option>
        </select>
      </div>
    </div>
    <div class="field" id="nt-role-wrap" style="display:none"><label>Роль</label>
      <select class="input" id="nt-role">
        <option value="director">Директор</option>
        <option value="chief_engineer">Гл. инженер</option>
        <option value="engineer">Инженер</option>
        <option value="shift_supervisor">Мастер смены</option>
        <option value="chief_mechanic">Гл. механик</option>
        <option value="mechanic">Механик</option>
        <option value="worker">Рабочий</option>
      </select>
    </div>
    <div id="nt-err" style="color:var(--danger);font-size:12px;min-height:16px"></div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="ACAI.closeModal()">Отмена</button>
      <button class="btn primary" onclick="submitTask()">Создать</button>
    </div>
  `);
  document.getElementById('nt-vis').onchange=function(){
    document.getElementById('nt-role-wrap').style.display=this.value==='role'?'block':'none';
  };
}

async function submitTask(){
  const title=document.getElementById('nt-title')?.value.trim();
  if(!title){document.getElementById('nt-err').textContent='Введите название';return;}
  const vis=document.getElementById('nt-vis')?.value;
  try{
    await ACAI.post('/api/tasks',{
      title,
      description:document.getElementById('nt-desc')?.value.trim()||null,
      priority:document.getElementById('nt-prio')?.value||'normal',
      task_type:document.getElementById('nt-type')?.value||'ordinary',
      due_at:document.getElementById('nt-due')?.value||null,
      visibility:vis||'everyone',
      visibility_role:vis==='role'?document.getElementById('nt-role')?.value:null,
    });
    ACAI.toast('Задача создана','ok');ACAI.closeModal();await load();
  }catch(e){document.getElementById('nt-err').textContent=e.message;}
}

document.querySelectorAll('.filter-chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');currentFilter=btn.dataset.f;renderTasks();
  });
});

initLayout();load();
</script>
</body>
</html>
