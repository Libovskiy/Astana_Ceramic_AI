<!DOCTYPE html>
<html lang="ru" data-default-theme="light">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAI — Разбор поломки</title>
    <!-- Обращения — отдельная страница со своими стилями, без общего
         acai.css. По умолчанию светлая (data-default-theme), тёмная —
         по кнопке, своя контрастная палитра в конце chat.css. -->
    <script src="/static/theme.js?v=2"></script>
    <link rel="stylesheet" href="/static/chat.css?v=10">
</head>
<body>

<div class="chat-app">

    <!-- ============ ШАПКА ============ -->
    <header class="chat-header">

        <div class="chat-header-left">
            <button type="button" id="chatBack" class="chat-back" title="Назад к списку">‹</button>
            <div>
                <div class="chat-title" id="chatTitle">Разбор поломки</div>
                <div class="chat-subtitle" id="chatSubtitle">ACAI</div>
            </div>
        </div>

        <div class="chat-header-right">
            <!-- Кнопка "Разделы" ведёт в рабочую зону по должности
                 (см. HOME_BY_ROLE в chat.js). Рабочему она нужна:
                 упаковочные бригады заполняют сменный отчёт, а он
                 живёт на отдельной странице. -->
            <button type="button" id="chatTheme" class="chat-action" title="Светлая / тёмная тема"><span data-icon=moon2></span></button>
            <button type="button" id="chatSound" class="chat-action" title="Звук уведомлений"><span data-icon=sound></span></button>
            <a href="/" id="chatHome" class="chat-action" style="display:none;" title="Другие разделы">Разделы</a>
            <button type="button" id="chatCardButton" class="chat-action" style="display:none;"
                    onclick="toggleCard()" title="История обращения">История</button>
            <button type="button" id="chatResolve" class="chat-action chat-action-done" style="display:none;">
                Решено
            </button>
            <button type="button" id="chatLogout" class="chat-action chat-action-danger" title="Выйти из системы">Выйти</button>
        </div>

    </header>

    <!-- ============ СПИСОК ОБРАЩЕНИЙ ============ -->
    <section class="chat-list" id="chatList">

        <!-- Уведомления на телефон: специалист взял обращение, ответил -->
        <button type="button" class="chat-push" id="chatPush" style="display:none;">
            <span data-icon=bell></span> Включить уведомления на телефон
        </button>

        <button type="button" class="chat-new" id="chatNew">
            <span class="chat-new-icon">+</span>
            Сообщить о проблеме
        </button>

        <div id="chatConversations">
            <div class="chat-empty">Загрузка...</div>
        </div>

    </section>

    <!-- ============ ПЕРЕПИСКА ============ -->
    <section class="chat-thread" id="chatThread">

        <!-- Чей ход — одной плашкой: «ждём механика», «механик ответил»,
             «ваш ход». Чтобы не догадываться по переписке. -->
        <div class="chat-turn" id="chatTurn" style="display:none;"></div>

        <div class="chat-card" id="chatCard" style="display:none;"></div>

        <!-- Где сейчас обращение: зарегистрировано -> ACAI ->
             специалист -> ремонт -> подтверждение -> закрыто -->
        <div class="chat-stages" id="chatStages" style="display:none;"></div>

        <!-- Что уже проверили. Видят специалисты, чтобы не
             повторять работу друг за другом. -->
        <div class="chat-checked" id="chatChecked" style="display:none;"></div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-basis" id="chatBasis" style="display:none;"></div>

        <!-- Действия: взять в работу, ремонт выполнен, черновик,
             подтвердить. Набор зависит от роли и статуса, решает сервер. -->
        <div class="chat-actions" id="chatActions" style="display:none;"></div>

        <!-- "Станок работает?" — закрывает человек, не ИИ -->
        <div class="chat-confirm" id="chatConfirm" style="display:none;"></div>

        <!-- Быстрые ответы на шаг ACAI: помогло / следующий шаг / мастер -->
        <div class="chat-quick" id="chatQuick" style="display:none;"></div>

        <div class="chat-composer" id="chatComposer">
            <textarea
                id="chatInput"
                rows="1"
                placeholder="Напишите сообщение..."
            ></textarea>
            <button type="button" id="chatMic" class="chat-mic" title="Надиктовать голосом"><span data-icon=mic></span></button>
            <button type="button" id="chatSend" class="chat-send" title="Отправить"><span data-icon=arrow></span></button>
        </div>

    </section>

    <!-- ============ НОВОЕ ОБРАЩЕНИЕ ============ -->
    <section class="chat-new-form" id="chatNewForm">

        <div class="chat-new-step">
            <div class="chat-new-label">На каком станке проблема?</div>
            <div id="chatEquipmentList" class="chat-equipment-list">
                <div class="chat-empty">Загрузка...</div>
            </div>
        </div>

        <div class="chat-new-step">
            <div class="chat-new-label">Что случилось?</div>
            <!-- Быстрый выбор: рабочему в перчатках проще нажать, чем
                 печатать. Нажатие подставляет текст, его можно дописать. -->
            <div id="chatQuickProblems" class="chat-quick-problems"></div>
            <div class="chat-new-input">
                <textarea
                    id="chatNewText"
                    rows="3"
                    placeholder="Например: плёнка рвётся при обмотке, подшипник греется и стучит"
                ></textarea>
                <button type="button" id="chatNewMic" class="chat-mic chat-mic-new" title="Надиктовать голосом"><span data-icon=mic></span></button>
            </div>
        </div>

        <button type="button" id="chatNewSubmit" class="chat-submit">Отправить</button>

        <div id="chatNewError" class="chat-new-error"></div>

    </section>

</div>

<script src="/static/icons.js?v=4"></script>
<script src="/static/notify.js?v=31"></script>
<script src="/static/voice.js?v=1"></script>
<script src="/static/push.js?v=1"></script>
<script src="/static/chat.js?v=50"></script>

</body>
</html>
