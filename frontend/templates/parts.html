<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запчасти — ACAI</title>
<script src="/static/theme.js?v=2"></script>
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/acai.css?v=62">
<style>
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.part-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;transition:border-color .15s;}
.part-card:hover{border-color:var(--accent);}
.part-card.low{border-left:3px solid var(--danger);}
.part-card.ok{border-left:3px solid var(--ok);}
.part-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.part-eq{font-size:11px;color:var(--text-dim);margin-bottom:8px;}
.part-qty{font-family:var(--mono);font-size:20px;font-weight:700;}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-chip{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;}
.filter-chip.active{background:var(--accent-solid);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Склад запчастей</div>
        <div class="topbar-sub">Наличие и учёт запчастей</div>
      </div>
      <div class="topbar-right">
        <input class="input" id="searchParts" placeholder="Поиск..." style="width:200px" oninput="renderParts()">
        <button class="btn primary" onclick="openAddPart()">+ Запчасть</button>
        <span class="topbar-clock" id="topbarClock"></span>
      </div>
    </header>
    <div class="page">

      <!-- Вопрос вкладки: чего не хватит, когда станок встанет.
           Ответ словами, дальше — цифры и карточки. -->
      <div class="verdict calm" id="partsVerdict">
        <div class="v-title" style="color:var(--text-dim)">Смотрю склад…</div>
      </div>

      <!-- ЖДУТ СПИСАНИЯ. Слесарь ремонт сделал и запчасть взял, а
           списывает ответственный: гл. механик по механике, гл.
           энергетик по электрике. Система подсказывает, что, судя по
           тексту ремонта и совету ИИ, скорее всего ушло со склада. -->
      <div id="writeoffsCard" class="card" style="display:none;margin-bottom:16px;border-color:var(--warn)">
        <div class="card-head"><h2>Ждут списания</h2>
          <span id="writeoffsCount" style="font-size:11px;color:var(--warn);background:var(--surface-2);padding:2px 8px;border-radius:999px"></span>
        </div>
        <div class="card-body" style="padding:10px 14px" id="writeoffsList"></div>
      </div>

      <div class="metrics" id="partsMetrics" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
        <div class="metric"><div class="metric-label">Загрузка...</div></div>
      </div>

      <div class="filters-row">
        <button class="filter-chip active" data-f="">Все</button>
        <button class="filter-chip" data-f="low" style="color:var(--danger)"><span data-icon=alert></span> Заканчиваются</button>
        <button class="filter-chip" data-f="mechanical">Механика</button>
        <button class="filter-chip" data-f="electrical">Электрика</button>
        <button class="filter-chip" data-f="consumable">Расходники</button>
      </div>

      <div class="parts-grid" id="partsList"><div class="empty">Загрузка...</div></div>

      <!-- ЧТО МЕНЯЛИ ПО ОТЧЁТУ.
           Склад заводят заново, и неоткуда знать, что в нём держать.
           А в сменном отчёте начальника производства за девять месяцев
           записано, что меняли руками. Остатки это не трогает —
           только показывает. -->
      <div class="card" id="reportPartsCard" style="display:none;margin-top:16px">
        <div class="card-head"><h2>Что меняли по отчёту</h2>
          <span style="font-size:11px;color:var(--text-dim)">из сменного отчёта начальника производства</span>
        </div>
        <div class="card-body" style="padding:10px 14px" id="reportParts"></div>
      </div>
    </div>
  </div>
</div>
<div class="overlay hidden" id="_overlay"><div class="modal" id="_modal" style="width:480px;max-width:95vw"></div></div>

<script src="/static/icons.js?v=4"></script>
<script src="/static/acai_layout.js?v=62"></script>
<script src="/static/mobile_nav_v2.js?v=6"></script>
<script>
let allParts=[];let activeFilter='';

const CAT_LABELS={mechanical:'Механика',electrical:'Электрика',consumable:'Расходники',other:'Прочее'};

let writeoffs=[];

async function load(){
  try{
    const r=await ACAI.get('/api/parts');
    allParts=r.parts||[];
  }catch{allParts=[];}
  // Заявки видит только ответственный за эту часть — сервер сам решает,
  // что показать, здесь молча принимаем пустой список.
  try{
    const w=await ACAI.get('/api/parts/writeoffs');
    writeoffs=w.writeoffs||[];
  }catch{writeoffs=[];}
  renderWriteoffs();renderMetrics();renderParts();loadReportParts();
}

const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Что меняли по сменному отчёту: сколько раз, где, когда последний
// раз и заведено ли это на складе.
async function loadReportParts(){
  const card = document.getElementById('reportPartsCard');
  const box = document.getElementById('reportParts');
  if (!card || !box) return;

  let items = [];
  try { items = (await ACAI.get('/api/parts/from-report')).parts || []; } catch { return; }
  if (!items.length) return;

  card.style.display = '';

  const when = v => v ? `${String(v).slice(8,10)}.${String(v).slice(5,7)}.${String(v).slice(2,4)}` : '—';

  box.innerHTML = `
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">
      По записям смен за год. Это не остатки склада, а то, что реально меняли руками —
      подсказка, что стоит держать в запасе.
    </div>
    <table class="table"><thead><tr>
      <th>Деталь</th><th>Раз</th><th>Участки</th><th>Последний раз</th><th>На складе</th>
    </tr></thead><tbody>
      ${items.map(item => `<tr>
        <td title="${esc((item.examples||[]).join(' · '))}">${esc(item.part)}</td>
        <td class="mono">${item.cases}</td>
        <td style="color:var(--text-dim)">${esc(item.sections)}</td>
        <td class="mono">${when(item.last_date)}</td>
        <td>${item.in_stock
              ? `<span class="badge ok">есть: ${esc(item.stock_name)}</span>`
              : '<span style="color:var(--text-dim)">позиции нет</span>'}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

function renderWriteoffs(){
  const card=document.getElementById('writeoffsCard');
  if(!writeoffs.length){
    card.style.display='none';
    document.getElementById('writeoffsList').innerHTML='';  // не оставляем старое в скрытом блоке
    return;
  }
  card.style.display='';
  document.getElementById('writeoffsCount').textContent=`${writeoffs.length}`;

  document.getElementById('writeoffsList').innerHTML=writeoffs.map(w=>`
    <div style="padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
        <div style="font-size:14px;font-weight:700">${esc(w.equipment_name||'—')}
          <span style="font-weight:400;color:var(--text-dim)">· обращение №${w.case_id}</span></div>
        <a href="/chat?case=${w.case_id}" style="font-size:12px;color:var(--accent);text-decoration:none">Открыть обращение ›</a>
      </div>
      ${w.repair_text?`<div style="font-size:13px;color:var(--text-dim);margin-top:4px">Ремонт: «${esc(w.repair_text)}»</div>`:''}
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px">Скорее всего взяли — проверьте и поправьте количество:</div>
      <div style="margin-top:6px">
        ${(w.suggested||[]).map(sg=>`
          <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px">
            <input type="checkbox" class="wo-pick" data-wo="${w.id}" data-part="${sg.part_id}" checked>
            <span style="flex:1;min-width:0">${esc(sg.name)}
              <span style="color:var(--text-dim)">${sg.part_number?`· ${esc(sg.part_number)} `:''}· на складе ${Number(sg.stock).toLocaleString('ru-RU')} ${esc(sg.unit)}${sg.why?` · ${esc(sg.why)}`:''}</span></span>
            <input type="number" class="input wo-qty" data-wo="${w.id}" data-part="${sg.part_id}"
                   value="1" min="0" step="1" style="width:74px">
          </label>`).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn primary sm" onclick="applyWriteoff(${w.id})">Списать отмеченное</button>
        <button class="btn secondary sm" onclick="skipWriteoff(${w.id})">Ничего не брали</button>
      </div>
    </div>`).join('');
}

async function applyWriteoff(id){
  const items=[...document.querySelectorAll(`.wo-pick[data-wo="${id}"]`)]
    .filter(cb=>cb.checked)
    .map(cb=>({part_id:+cb.dataset.part,
               quantity:+(document.querySelector(`.wo-qty[data-wo="${id}"][data-part="${cb.dataset.part}"]`)?.value||0)}))
    .filter(it=>it.quantity>0);
  if(!items.length){ACAI.toast('Отметьте, что списать, или нажмите «Ничего не брали»','warn');return;}
  try{
    const r=await fetch(`/api/parts/writeoffs/${id}/apply`,{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||'Не получилось');
    ACAI.toast(d.shortages?.length?d.shortages.join('; '):'Списано','ok');
    await load();
  }catch(e){ACAI.toast(e.message,'danger');}
}

async function skipWriteoff(id){
  try{
    const r=await fetch(`/api/parts/writeoffs/${id}/skip`,{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||'Не получилось');
    ACAI.toast('Отмечено: со склада не брали');
    await load();
  }catch(e){ACAI.toast(e.message,'danger');}
}

function renderMetrics(){
  const total=allParts.length;
  const low=allParts.filter(p=>p.quantity<=p.min_quantity).length;
  const zero=allParts.filter(p=>p.quantity===0).length;
  document.getElementById('partsMetrics').innerHTML=`
    <div class="metric accent"><div class="metric-label">Позиций</div><div class="metric-value accent">${total}</div></div>
    <div class="metric ${low>0?'danger':'ok'}"><div class="metric-label">Заканчиваются</div><div class="metric-value ${low>0?'danger':'ok'}">${low}</div><div class="metric-sub">≤ минимума</div></div>
    <div class="metric ${zero>0?'danger':'ok'}"><div class="metric-label">Отсутствуют</div><div class="metric-value ${zero>0?'danger':'ok'}">${zero}</div></div>
    <div class="metric ok"><div class="metric-label">В наличии</div><div class="metric-value ok">${total-zero}</div></div>`;

  renderPartsVerdict({total, low, zero});
}

// Сначала то, чего нет совсем, потом то, что на минимуме. Пустой склад —
// это «не заполняли», а не «всё есть».
function renderPartsVerdict(m){
  if(!m.total && !writeoffs.length){
    ACAI.verdict('partsVerdict', {title:'Склад не заполнен',
      sub:'Ни одной позиции не внесено — когда станок встанет, искать запчасть будет негде. Добавьте хотя бы то, что меняют чаще всего.'});
    return;
  }
  const rows=[];
  if(writeoffs.length) rows.push({level:'warning', what:`Ждут списания: ${writeoffs.length}`,
    where:'ремонт сделан, запчасть, похоже, взяли — проверьте и спишите ниже'});
  const out=allParts.filter(p=>p.quantity===0);
  const low=allParts.filter(p=>p.quantity>0&&p.quantity<=p.min_quantity);
  if(out.length) rows.push({level:'critical', what:`Нет совсем: ${out.length}`,
    where:out.slice(0,3).map(p=>p.name).join(', ')+(out.length>3?` и ещё ${out.length-3}`:'')});
  if(low.length) rows.push({level:'warning', what:`На минимуме: ${low.length}`,
    where:low.slice(0,3).map(p=>`${p.name} — ${p.quantity} ${p.unit||'шт'}`).join(', ')});

  if(rows.length){
    const order = out.length || low.length;
    ACAI.verdict('partsVerdict', {title: order ? 'Нужно заказать' : 'Ждут вашего решения', rows});
    return;
  }
  ACAI.verdict('partsVerdict', {title:'Запас в норме',
    sub:`${m.total} позиций, все выше минимума`});
}

function renderParts(){
  const q=(document.getElementById('searchParts')?.value||'').toLowerCase();
  let items=allParts;
  if(activeFilter==='low')items=items.filter(p=>p.quantity<=p.min_quantity);
  else if(activeFilter)items=items.filter(p=>p.category===activeFilter);
  if(q)items=items.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.equipment_name||'').toLowerCase().includes(q));
  if(!items.length){document.getElementById('partsList').innerHTML='<div class="empty">Ничего не найдено</div>';return;}
  document.getElementById('partsList').innerHTML=items.map(p=>{
    const isLow=p.quantity<=p.min_quantity;
    const color=p.quantity===0?'var(--danger)':isLow?'var(--warn)':'var(--ok)';
    return`<div class="part-card ${isLow?'low':'ok'}">
      <div class="part-name">${p.name}</div>
      <div class="part-eq">${p.equipment_name||'Общее'} · ${CAT_LABELS[p.category]||p.category||'—'}</div>
      ${p.part_number?`<div style="font-size:10px;color:var(--text-dim);font-family:var(--code);margin-bottom:6px">${p.part_number}</div>`:''}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
        <div>
          <div style="font-size:10px;color:var(--text-dim)">В наличии</div>
          <div class="part-qty" style="color:${color}">${p.quantity} ${p.unit||'шт'}</div>
          ${p.min_quantity?`<div style="font-size:10px;color:var(--text-dim)">Мин: ${p.min_quantity}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn ok sm" onclick="changeQty(${p.id},1)">+ Приход</button>
          <button class="btn danger sm" onclick="changeQty(${p.id},-1)">− Расход</button>
        </div>
      </div>
      ${p.last_used_at?`<div style="font-size:10px;color:var(--text-dim);margin-top:6px">Последн. использ: ${p.last_used_at.slice(0,10)}</div>`:''}
    </div>`;
  }).join('');
}

async function changeQty(id,direction){
  const part=allParts.find(p=>p.id===id);
  if(!part)return;
  const label=direction>0?'Приход (сколько поступило?)':'Расход (сколько использовано?)';
  const qty=prompt(label,'1');
  if(!qty||isNaN(qty)||parseFloat(qty)<=0)return;
  try{
    await ACAI.post(`/api/parts/${id}/move`,{quantity:parseFloat(qty)*direction});
    ACAI.toast(direction>0?'Приход записан ✓':'Расход записан ✓','ok');
    await load();
  }catch(e){ACAI.toast(e.message,'danger');}
}

function openAddPart(){
  ACAI.get('/api/equipment').then(r=>{
    const eq=r.equipment||r||[];
    ACAI.showModal(`
      <h3>Добавить запчасть</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field" style="grid-column:1/-1"><label>Название *</label><input class="input" id="np-name" placeholder="Например: Подшипник 6205"></div>
        <div class="field"><label>Артикул / номер</label><input class="input" id="np-num" placeholder="6205-2RS"></div>
        <div class="field"><label>Категория</label>
          <select class="input" id="np-cat">
            <option value="mechanical">Механика</option>
            <option value="electrical">Электрика</option>
            <option value="consumable">Расходники</option>
            <option value="other">Прочее</option>
          </select>
        </div>
        <div class="field"><label>Оборудование</label>
          <select class="input" id="np-eq">
            <option value="">— Общее —</option>
            ${eq.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Единица</label><input class="input" id="np-unit" value="шт" placeholder="шт, м, кг..."></div>
        <div class="field"><label>Количество</label><input class="input" id="np-qty" type="number" value="0" min="0"></div>
        <div class="field"><label>Минимальный остаток</label><input class="input" id="np-min" type="number" value="1" min="0"></div>
      </div>
      <div id="np-err" style="color:var(--danger);font-size:12px;min-height:16px"></div>
      <div class="modal-foot">
        <button class="btn secondary" onclick="ACAI.closeModal()">Отмена</button>
        <button class="btn primary" onclick="submitAddPart()">Добавить</button>
      </div>
    `);
  });
}

async function submitAddPart(){
  const name=document.getElementById('np-name')?.value.trim();
  const errEl=document.getElementById('np-err');
  if(!name){errEl.textContent='Введите название';return;}
  try{
    await ACAI.post('/api/parts',{
      name,
      part_number:document.getElementById('np-num')?.value.trim()||null,
      category:document.getElementById('np-cat')?.value||'other',
      equipment_id:parseInt(document.getElementById('np-eq')?.value)||null,
      unit:document.getElementById('np-unit')?.value||'шт',
      quantity:parseFloat(document.getElementById('np-qty')?.value)||0,
      min_quantity:parseFloat(document.getElementById('np-min')?.value)||1,
    });
    ACAI.toast('Запчасть добавлена ✓','ok');ACAI.closeModal();await load();
  }catch(e){errEl.textContent=e.message;}
}

document.querySelectorAll('.filter-chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');activeFilter=btn.dataset.f;renderParts();
  });
});

// меню раньше вывода: ссылки ставятся только на открытые роли страницы
initLayout().then(load, load);

setInterval(() => {
  const overlay = document.getElementById('_overlay');
  if (overlay && !overlay.classList.contains('hidden')) return; // модалка открыта — не мешаем
  load();
}, 45000);
</script>
</body>
</html>
