<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал — ACAI</title>
<script src="/static/theme.js?v=2"></script>
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/acai.css?v=19">
<style>
.log-item {
  display:flex; align-items:flex-start; gap:14px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.log-item:last-child { border-bottom:none; }
.log-icon {
  width:34px; height:34px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; flex-shrink:0;
}
.log-body { flex:1; min-width:0; }
.log-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px; }
.log-who { font-size:13px; font-weight:600; }
.log-what { font-size:13px; color:var(--text-dim); }
.log-target { font-size:12px; color:var(--accent); font-family:var(--mono); }
.log-changes { margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
.chg-row { display:flex; align-items:baseline; gap:8px; font-size:12px; padding:3px 0; flex-wrap:wrap; }
.chg-field { min-width:130px; color:var(--text-dim); }
.chg-before { color:var(--text-dim); text-decoration:line-through; }
.chg-arrow { color:var(--text-dim); }
.chg-after { color:var(--ok); font-weight:600; }
.chg-reason { margin-top:6px; font-size:12px; color:var(--text-dim); font-style:italic; }
.log-changes-empty { font-size:12px; color:var(--text-dim); }
.log-detail { font-size:11px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.log-time { font-size:11px; color:var(--text-dim); font-family:var(--mono); flex-shrink:0; white-space:nowrap; }

.action-icon { font-size:14px; }

.filters-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.filter-chip {
  padding:5px 12px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-dim);
  cursor:pointer; font-size:12px; font-weight:500; transition:all .15s;
}
.filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Журнал действий</div>
        <div class="topbar-sub">История всех действий в системе</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-clock" id="topbarClock"></span>
      </div>
    </header>

    <div class="page">

      <!-- ФИЛЬТРЫ -->
      <div class="filters-row">
        <button class="filter-chip active" data-action="">Все</button>
        <button class="filter-chip" data-action="login">Входы</button>
        <button class="filter-chip" data-action="case">Обращения</button>
        <button class="filter-chip" data-action="equipment">Оборудование</button>
        <button class="filter-chip" data-action="repair">Ремонты</button>
        <input class="input" id="searchLog" placeholder="🔍 Поиск по имени..." style="width:200px;margin-left:auto">
        <select class="input" id="limitSelect" style="width:120px">
          <option value="50">50 записей</option>
          <option value="100">100 записей</option>
          <option value="200" selected>200 записей</option>
        </select>
      </div>

      <!-- ЖУРНАЛ -->
      <div class="card">
        <div class="card-head">
          <h2>Последние действия</h2>
          <span id="logCount" style="font-size:11px;color:var(--text-dim);background:var(--surface-2);padding:2px 8px;border-radius:999px">—</span>
        </div>
        <div class="card-body" style="padding:0 16px" id="logList">
          <div class="empty">Загрузка...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/static/acai_layout.js?v=24"></script>
<script src="/static/mobile_nav_v2.js?v=3"></script>
<script>

let currentAction = '';
let searchQ = '';

  case_escalated:                { icon:'🚨', bg:'rgba(239,68,68,.1)', label:'Передано специалисту' },
  case_take:                     { icon:'▶️', bg:'rgba(99,102,241,.1)', label:'Взято в работу' },
  downtime_closed_by_status:     { icon:'▶️', bg:'rgba(34,197,94,.1)', label:'Простой закрыт по статусу' },
  part_archived:                 { icon:'🗄️', bg:'rgba(239,68,68,.1)', label:'Запчасть убрана' },

  procedure_deleted:             { icon:'🗑️', bg:'rgba(239,68,68,.1)', label:'Инструкция удалена' },

  // учётные записи
  admin_revoke_sessions:         { icon:'🔒', bg:'rgba(239,68,68,.1)', label:'Сессии завершены' },
  user_password_changed:         { icon:'🔑', bg:'rgba(245,158,11,.1)', label:'Пароль сотрудника изменён' },
  user_role_changed:             { icon:'🏷️', bg:'rgba(245,158,11,.1)', label:'Должность изменена' },
  user_created:                  { icon:'➕', bg:'rgba(34,197,94,.1)', label:'Создан сотрудник' },
  user_password_reset:           { icon:'🔑', bg:'rgba(245,158,11,.1)', label:'Пароль сотрудника сброшен' },
  user_renamed:                  { icon:'✏️', bg:'rgba(59,130,246,.1)', label:'Сотрудник переименован' },
  user_deleted:                  { icon:'🗑️', bg:'rgba(239,68,68,.1)', label:'Учётка удалена' },
  user_enabled:                  { icon:'✅', bg:'rgba(34,197,94,.1)', label:'Доступ возвращён' },
  user_disabled:                 { icon:'🚫', bg:'rgba(239,68,68,.1)', label:'Доступ закрыт' },
  password_changed:              { icon:'🔑', bg:'rgba(245,158,11,.1)', label:'Пароль изменён' },
  login_disabled:                { icon:'🚫', bg:'rgba(239,68,68,.1)', label:'Вход при закрытом доступе' },
  login_blocked:                 { icon:'⛔', bg:'rgba(239,68,68,.1)', label:'Вход заблокирован (перебор)' },
};

function getMeta(action) {
  // точное совпадение
  if (ACTION_META[action]) return ACTION_META[action];
  // частичное
  for (const [key, meta] of Object.entries(ACTION_META)) {
    if (action?.includes(key)) return meta;
  }
  return { icon:'📝', bg:'rgba(100,116,139,.1)', label: action };
}

// Раскрытие записи: что именно поменяли.
//
// Грузим по нажатию, а не вместе со списком: разница есть не у всех
// записей, а тянуть её для сотни строк заранее — лишний вес на
// заводском Wi-Fi.
const loadedChanges = {};

async function toggleEntry(id, row) {
  const box = document.getElementById('chg-' + id);
  if (!box) return;

  if (box.style.display !== 'none') { box.style.display = 'none'; return; }

  box.style.display = '';

  if (loadedChanges[id]) { box.innerHTML = loadedChanges[id]; return; }

  box.innerHTML = '<div class="log-changes-empty">Загрузка…</div>';

  let entry;
  try {
    const r = await ACAI.get('/api/audit-log/' + id);
    entry = r.entry;
  } catch {
    box.innerHTML = '<div class="log-changes-empty">Не удалось загрузить подробности</div>';
    return;
  }

  const rows = (entry.changes || []).map(c => `
    <div class="chg-row">
      <span class="chg-field">${esc(c.label)}</span>
      <span class="chg-before">${esc(c.before)}</span>
      <span class="chg-arrow">→</span>
      <span class="chg-after">${esc(c.after)}</span>
    </div>`).join('');

  const reason = entry.reason
    ? `<div class="chg-reason">Причина: ${esc(entry.reason)}</div>` : '';

  // У части записей разницы нет — их писали до того, как система
  // научилась её сохранять. Честно об этом говорим, а не показываем
  // пустоту.
  const body = rows
    ? rows + reason
    : `<div class="log-changes-empty">Подробности этого изменения не записаны${entry.reason ? '' : '.'}</div>` + reason;

  loadedChanges[id] = body;
  box.innerHTML = body;
}

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getRoleLabel(role) {
  return {
    admin:'Администратор', director:'Директор',
    chief_engineer:'Гл. инженер', engineer:'Инженер',
    worker:'Рабочий', shift_supervisor:'Мастер смены',
    chief_mechanic:'Гл. механик', mechanic:'Механик',
    chief_electrician:'Гл. электрик', electrician:'Электрик',
    // Без этих трёх журнал показывал сырое «technologist» рядом с
    // остальными должностями по-русски.
    technologist:'Технолог', analyst:'Аналитик', lab_technician:'Лаборант',
  }[role] || role || '—';
}

async function loadLog() {
  const limit = document.getElementById('limitSelect').value;
  const params = new URLSearchParams({ limit });
  if (currentAction) params.set('action', currentAction);
  if (searchQ) params.set('search', searchQ);

  const r = await ACAI.get(`/api/audit-log?${params}`);
  allEntries = r.entries || [];
  renderLog();
}

function renderLog() {
  document.getElementById('logCount').textContent = `${allEntries.length} записей`;

  if (!allEntries.length) {
    document.getElementById('logList').innerHTML = '<div class="empty">Записей нет</div>';
    return;
  }

  document.getElementById('logList').innerHTML = allEntries.map(e => {
    const meta = getMeta(e.action);
    const who = e.full_name || e.username || '—';
    const roleLabel = getRoleLabel(e.role);
    // Сервер подставляет название объекта; ссылка вида «equipment:287»
    // остаётся запасным вариантом, если объект удалили.
    const target = e.target_name || e.target || '';
    const detail = e.details || '';

    // форматируем время
    const ts = e.created_at ? new Date(e.created_at.replace(' ','T')) : null;
    const timeStr = ts ? ts.toLocaleString('ru-RU', {
      day:'2-digit', month:'2-digit',
      hour:'2-digit', minute:'2-digit'
    }) : '—';
    const agoStr = ts ? ACAI.timeAgo(e.created_at) : '—';

    return `<div class="log-item" onclick="toggleEntry(${e.id}, this)" style="cursor:pointer">
      <div class="log-icon" style="background:${meta.bg}">${meta.icon}</div>
      <div class="log-body">
        <div class="log-head">
          <span class="log-who">${who}</span>
          <span class="badge neutral" style="font-size:10px">${roleLabel}</span>
          <span class="log-what">${meta.label}</span>
          ${target ? `<span class="log-target">${target}</span>` : ''}
        </div>
        ${detail ? `<div class="log-detail">${detail}</div>` : ''}
        <div class="log-changes" id="chg-${e.id}" style="display:none"></div>
      </div>
      <div class="log-time" title="${timeStr}">${agoStr}</div>
    </div>`;
  }).join('');
}

// фильтры по типу действия
document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAction = btn.dataset.action;
    loadLog();
  });
});

document.getElementById('searchLog').addEventListener('input', e => {
  searchQ = e.target.value;
  loadLog();
});

document.getElementById('limitSelect').addEventListener('change', loadLog);

initLayout();
loadLog();
setInterval(loadLog, 60000);
</script>
</body>
</html>
